          cat > vg_check.js <<'JSEOF'
          /* Vision Gallery robot -- ROBOT CHECKS (d17.192, shop 27 Oct: "make it work without Admin open")

             After the cutter, the robot runs the checks of Admin -> TO CHECK by itself: it signs in to the shop account the same
             way the website's passcode sign-in does (a sign-in made with the robot's own database key -- no e-mail, no passcode,
             nothing new to set up), opens the live Admin page in a hidden browser and lets that page do exactly what it does on a
             phone: touch-up, rim, inside the lenses, arms, picture reader, colour and shape, AUTO-LIVE. Same code, same result.

             It runs only when Admin -> TO CHECK -> ROBOT CHECKS is ON, or for one frame when the robot is started by hand with
             check:<frame name>. When nothing in TO CHECK changed since the last check (and that was less than an hour ago) it
             does not open the browser at all.

             Needs: SUPABASE_URL, SUPABASE_KEY (the robot's key, already there). Optional: SITE (default https://visiongallery.me),
             RECUT (check:<frame>), SHOP_EMAIL. */
          'use strict';
          const crypto = require('crypto');

          const SITE = () => (process.env.SITE || 'https://visiongallery.me').replace(/\/+$/, '');
          const KEY_PRINT = 'robotcheck_print', KEY_SESSION = 'robotsession', AGAIN_MS = 60 * 60e3;

          function say(s){ console.log(s); }

          async function rest(o, path, init){
            init = init || {};
            const headers = Object.assign({ apikey: o.key, Authorization: 'Bearer ' + o.key, 'Content-Type': 'application/json' }, init.headers || {});
            const r = await fetch(o.url + path, Object.assign({}, init, { headers }));
            let body = null; try { body = await r.json(); } catch(e){}
            return { ok: r.ok, status: r.status, body };
          }
          function pendingOf(p){ return Array.isArray(p && p.pendingViews) ? p.pendingViews.filter(v => v !== 'side' && v !== 'side2') : []; }
          function problemsOf(p){ const o = (p && p.viewProblems && typeof p.viewProblems === 'object') ? Object.assign({}, p.viewProblems) : {}; delete o.side; delete o.side2; return o; }
          function isToCheck(p){                                   /* the same rule as Admin */
            if (!p || !p.tryOnReady || !p.tryOnUrl || p.draft || p.deleted) return false;
            return !!p.awaitingCheck || pendingOf(p).length > 0 || Object.keys(problemsOf(p)).length > 0;
          }
          function matches(p, only){
            const o = String(only || '').trim().toLowerCase(); if (!o) return true;
            return String(p.id).toLowerCase() === o || String(p.name || '').toLowerCase() === o || String(p.name || '').toLowerCase().indexOf(o) >= 0;
          }
          /* everything the checks look at -- when none of it changed, a new run would find nothing new */
          function fingerprint(frames, set){
            const pick = p => {
              const v = {}; ['tryOnUrl', 'tryOnSource', 'tryOnAngleUrl', 'tryOnAngleSource', 'tryOnAngleRUrl', 'tryOnAngleRSource', 'url', 'colour', 'colour2', 'shape', 'rim',
                'awaitingCheck', 'tryOnLocked', 'tryOnAngleFit', 'tryOnAngleRFit'].forEach(k => { v[k] = p[k] === undefined ? null : p[k]; });
              v.pend = pendingOf(p); v.prob = problemsOf(p); v.hide = p.hideViews || null; v.locks = p.tryOnViewLocks || null; v.auto = p.autoLive || null; v.det = p.detailsOk || null;
              const fors = o => o && typeof o === 'object' ? Object.keys(o).sort().map(k => [k, o[k] && o[k].for, o[k] && o[k].v, o[k] && o[k].good, o[k] && o[k].url, o[k] && o[k].undone]) : null;
              v.rc = fors(p.rimCheck); v.rf = fors(p.rimFix); v.cc = fors(p.cutCheck); v.at = fors(p.autoTouch);
              v.ic = p.insideCheck ? [p.insideCheck.for, p.insideCheck.v] : null; v.ifx = p.insideFix ? [p.insideFix.url, p.insideFix.undone] : null;
              return [p.id, v];
            };
            const s = JSON.stringify({ f: frames.map(pick).sort((a, b) => String(a[0]).localeCompare(String(b[0]))), live: !!(set && set.autoLive === true) });
            return crypto.createHash('sha256').update(s).digest('hex').slice(0, 24);
          }
          async function readShop(o){
            for (let t = 0; t < 3; t++){
              let shop = null; try { shop = await rest(o, '/rest/v1/products?select=id,data&id=eq.__shop'); } catch (e) { shop = null; }   /* a dropped connection is tried again too */
              if (shop && shop.ok && Array.isArray(shop.body)) return (shop.body[0] && shop.body[0].data && shop.body[0].data.shop) || {};
              if (t < 2) await new Promise(r => setTimeout(r, 2000 * (t + 1)));
            }
            throw new Error('could not read the shop settings');
          }
          /* (2 Nov) the frames, page by page (200 at a time, in a fixed order) -- the database answers at most 1,000 rows to one
             request, so one big request would silently miss frames once the shop grows. Settings rows (__shop, __robot ...) are left
             out HERE: the database reads "_" in a like-filter as "any one character", so a filter "id=not.like.__*" hid EVERY frame. */
          async function readFrames(o){
            const out = [], seen = new Set(), SIZE = 200;      /* (a frame added meanwhile can shift a page: each id once) */
            for (let off = 0; off < 200000; off += SIZE){
              let r = null;
              for (let t = 0; t < 3; t++){
                try { r = await rest(o, '/rest/v1/products?select=id,data&order=id.asc&limit=' + SIZE + '&offset=' + off); } catch (e) { r = null; }
                if (r && r.ok && Array.isArray(r.body)) break;
                if (t < 2) await new Promise(res => setTimeout(res, 2000 * (t + 1)));
              }
              if (!r || !r.ok || !Array.isArray(r.body)) throw new Error('could not read the frames (' + (r && r.status) + ')');
              r.body.forEach(x => { if (x && x.id != null && String(x.id).slice(0, 2) !== '__' && !seen.has(String(x.id))){ seen.add(String(x.id)); out.push(Object.assign({ id: x.id }, x.data || {})); } });
              if (r.body.length < SIZE) break;
            }
            return out;
          }
          async function readState(o){
            const set = await readShop(o);
            const frames = await readFrames(o);
            return { frames, set };
          }
          async function readPrint(o){
            const r = await rest(o, '/rest/v1/shop_private?select=data&id=eq.' + KEY_PRINT);
            return (r.ok && Array.isArray(r.body) && r.body[0] && r.body[0].data) || null;
          }
          async function savePrint(o, data){
            await rest(o, '/rest/v1/shop_private?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
              body: JSON.stringify([{ id: KEY_PRINT, data, updated_at: new Date().toISOString() }]) });
          }

          /* should the browser be opened at all? */
          async function plan(o){
            const recut = String(o.recut || '').trim();
            const m = /^check:(.+)$/i.exec(recut);
            const only = m ? m[1].trim() : '';
            /* (2 Nov) the setting first: with ROBOT CHECKS off and no check:<frame>, the frames are not even read */
            if (!only){
              const set0 = await readShop(o);
              if (set0.robotChecks !== true) return { go: false, reason: 'ROBOT CHECKS are off (Admin -> TO CHECK -> ROBOT CHECKS). Nothing checked here.' };
            }
            const st = await readState(o);
            const todo = st.frames.filter(isToCheck).filter(p => matches(p, only));
            if (only){
              if (!st.frames.some(p => matches(p, only))) return { go: false, reason: 'ROBOT CHECKS: no frame called "' + only + '"' };
              return { go: true, only, reason: 'ROBOT CHECKS: test on one frame -- ' + only + (todo.length ? '' : ' (it is not in TO CHECK -- looked at anyway)'), st, todo };
            }
            if (st.set.robotChecks !== true) return { go: false, reason: 'ROBOT CHECKS are off (Admin -> TO CHECK -> ROBOT CHECKS). Nothing checked here.' };
            if (!todo.length) return { go: false, reason: 'ROBOT CHECKS: nothing in TO CHECK.', st, todo };
            const print = fingerprint(todo, st.set), last = await readPrint(o);
            if (last && last.print === print && Date.now() - Date.parse(last.at || 0) < AGAIN_MS)
              return { go: false, reason: 'ROBOT CHECKS: ' + todo.length + ' frame(s) in TO CHECK, nothing changed since the last check (' + String(last.at).slice(11, 16) + ' UTC).', st, todo, print };
            return { go: true, only: '', reason: 'ROBOT CHECKS: ' + todo.length + ' frame(s) in TO CHECK -- checking now.', st, todo, print };
          }

          /* the shop account: looked up by its e-mail on every page of accounts (customers who sign in to My Orders have accounts
             too, so it is not always on the first page). Otherwise the one account with an e-mail, once every page was seen. */
          async function shopUser(o){
            const want = String(o.shopEmail || process.env.SHOP_EMAIL || 'visionviewoptic@gmail.com').toLowerCase();
            const withMail = []; let all = false;
            for (let page = 1; page <= 50; page++){
              const u = await rest(o, '/auth/v1/admin/users?page=' + page + '&per_page=200');
              if (!u.ok) break;
              const list = u.body ? (Array.isArray(u.body) ? u.body : (u.body.users || [])) : [];
              const hit = list.find(x => x && x.email && String(x.email).toLowerCase() === want);
              if (hit) return hit;
              list.forEach(x => { if (x && x.email) withMail.push(x); });
              if (list.length < 200){ all = true; break; }
            }
            if (all && withMail.length === 1) return withMail[0];             /* the one account with an e-mail, every page seen */
            throw new Error('the shop account was not found');
          }
          /* a sign-in for the shop account, made with the robot's key (the same way the website's passcode sign-in makes one).
             The robot keeps ONE sign-in of its own and renews it each run, so sign-ins do not pile up. */
          async function shopSession(o){
            const saved = await rest(o, '/rest/v1/shop_private?select=data&id=eq.' + KEY_SESSION);
            const rt = saved.ok && Array.isArray(saved.body) && saved.body[0] && saved.body[0].data && saved.body[0].data.rt;
            let sess = null;
            if (rt){
              const r = await rest(o, '/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: rt }) });
              if (r.ok && r.body && r.body.access_token) sess = r.body;
            }
            if (!sess){
              const hit = await shopUser(o);
              const g = await rest(o, '/auth/v1/admin/generate_link', { method: 'POST', body: JSON.stringify({ type: 'magiclink', email: hit.email }) });
              if (!g.ok || !g.body) throw new Error('the shop account did not answer (' + g.status + ')');
              const p = g.body.properties || g.body, tries = [];
              if (p.hashed_token) tries.push({ type: p.verification_type || 'magiclink', token_hash: p.hashed_token });
              if (p.hashed_token && (p.verification_type || 'magiclink') !== 'magiclink') tries.push({ type: 'magiclink', token_hash: p.hashed_token });
              if (p.email_otp) tries.push({ type: 'email', email: hit.email, token: p.email_otp });
              for (const t of tries){
                const v = await rest(o, '/auth/v1/verify', { method: 'POST', body: JSON.stringify(t) });
                if (v.ok && v.body && v.body.access_token){ sess = v.body; break; }
              }
              if (!sess) throw new Error('the shop account did not hand over a sign-in');
            }
            if (sess.refresh_token) await rest(o, '/rest/v1/shop_private?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
              body: JSON.stringify([{ id: KEY_SESSION, data: { rt: sess.refresh_token, at: new Date().toISOString() }, updated_at: new Date().toISOString() }]) });
            return sess;
          }

          const KIT = require('path').join(require('os').tmpdir(), 'vg-check-kit');      /* outside the repository folder */
          async function browserKit(){
            let pw = null;
            for (const name of ['playwright-core', 'playwright', require('path').join(KIT, 'node_modules', 'playwright-core')]){ try { pw = require(name); break; } catch(e){} }
            if (!pw){
              say('installing the hidden browser driver ...');
              require('child_process').execSync('npm install --no-save --silent --no-audit --no-fund --prefix "' + KIT + '" playwright-core@1.56.0', { stdio: 'inherit', timeout: 180e3 });
              pw = require(require('path').join(KIT, 'node_modules', 'playwright-core'));
            }
            return pw;
          }
          async function launch(pw, o){
            if (o.launch) return o.launch(pw);
            try { return await pw.chromium.launch({ channel: 'chrome', headless: true }); }          /* Google Chrome is on the GitHub computer */
            catch(e){
              say('Chrome not found -- fetching the browser once ...');
              require('child_process').execSync('npx --yes playwright-core@1.56.0 install chromium', { stdio: 'inherit', timeout: 300e3, cwd: require('os').tmpdir() });
              return pw.chromium.launch({ headless: true });
            }
          }

          async function run(o){
            const p = await plan(o);
            say(p.reason);
            if (!p.go) return { skipped: true, reason: p.reason };
            const sess = await shopSession(o);
            const shaped = { access_token: sess.access_token, refresh_token: '', expires_at: Date.now() + (Number(sess.expires_in) || 3600) * 1000,   /* the page never gets the renewal key */
              email: (sess.user && sess.user.email) || '', user_id: (sess.user && sess.user.id) || '' };
            const pw = await browserKit(), browser = await launch(pw, o);
            const budgetMs = Number(o.budgetMs || process.env.CHECK_MINUTES * 60e3) || 6 * 60e3;
            let result = null; const errs = [];
            try {
              const ctx = await browser.newContext({ viewport: { width: 1100, height: 900 }, serviceWorkers: 'block' });
              await ctx.addInitScript(({ s, robot, sync, origin }) => {
                if (location.origin !== origin) return;                          /* the shop's own pages only -- never another site or frame */
                try { localStorage.setItem('vg_session', JSON.stringify(s)); if (sync) localStorage.setItem('vg_sync', JSON.stringify(sync)); } catch(e){}
                window.VG_ROBOT = robot;
              }, { s: shaped, robot: { run: true, only: p.only || '', budgetMs }, sync: o.publicKey ? { url: o.url, key: o.publicKey } : null, origin: new URL(SITE()).origin });
              const page = await ctx.newPage();
              page.on('pageerror', e => errs.push(String(e && e.message || e).slice(0, 160)));
              page.on('dialog', d => d.dismiss().catch(() => {}));                 /* nothing may wait for a tap */
              if (o.setupPage) await o.setupPage(page, ctx);
              await page.goto(SITE() + '/admin.html', { waitUntil: 'load', timeout: 90e3 });
              /* the live Admin starts its robot run at once -- an older website build (before d17.192) cannot */
              try { await page.waitForFunction(() => window.VG_ROBOT && window.VG_ROBOT.result, null, { timeout: 60e3, polling: 500 }); }
              catch(e){ throw new Error('the live website is an older build without ROBOT CHECKS -- upload the website zip (d17.192 or newer) first'); }
              try { await page.waitForFunction(() => window.VG_ROBOT && window.VG_ROBOT.done === true, null, { timeout: budgetMs + 90e3, polling: 1000 }); }
              catch(e){ say('::warning::ROBOT CHECKS: the page did not finish in time -- what it did so far is below'); }
              result = await page.evaluate(() => window.VG_ROBOT.result).catch(() => null);
              if (result && !result.ended) result.timeUp = true;
            } finally { await browser.close().catch(() => {}); }
            /* the report in the robot's log */
            if (result){
              if (result.error) say('::warning::ROBOT CHECKS stopped: ' + result.error);
              (result.steps || []).forEach(s => say('  did: ' + s));
              (result.frames || []).forEach(f => say('  ' + f.name + ': ' + f.state));
              if ((result.went || []).length) say('::notice::Went live by itself: ' + result.went.join(', '));
            }
            if (errs.length) say('  page notes: ' + errs.slice(0, 5).join(' | '));
            /* what was looked at, so the next run can skip when nothing changed -- only when every check had its answer */
            const finished = result && !result.error && !result.timeUp && !(result.frames || []).some(f => /^still checking/.test(f.state));
            if (!p.only && finished){
              try { const st = await readState(o); await savePrint(o, { print: fingerprint(st.frames.filter(isToCheck), st.set), at: new Date().toISOString() }); } catch(e){}
            }
            return { result, errs };
          }

          async function main(){
            const o = { url: String(process.env.SUPABASE_URL || '').replace(/\/+$/, ''), key: process.env.SUPABASE_KEY || '', recut: process.env.RECUT || '' };
            if (!o.url || !o.key){ say('ROBOT CHECKS: SUPABASE_URL or SUPABASE_KEY missing -- skipped'); return; }
            try { await run(o); }
            catch(e){ say('::warning::ROBOT CHECKS could not run: ' + String(e && e.message || e).slice(0, 200)); }
          }
          module.exports = { plan, run, fingerprint, isToCheck, shopSession };
          if (require.main === module) main().then(() => process.exit(0));
          JSEOF
          echo "robot unpacked: $(wc -l < vg_look.py) + $(wc -l < vg_cut.py) + $(wc -l < vg_check.js) + $(wc -l < vg-white.js) + $(wc -l < vg_white_run.js) lines"

      - name: Is anything waiting?
        id: look
        env:
          SUPABASE_URL: https://oscpunukbyosckrmopeh.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RECUT: ${{ !startsWith(github.event.inputs.recut, 'check:') && github.event.inputs.recut || '' }}
        run: |
          set +e
          echo "Robot build 2026-11-13a (FRAME MAP TEST: test-white:<frame> adds two rows to its test picture -- 5 the NEW FRAME MAP: the robot follows the photo's own edge lines to measure the whole frame (rim, bridge, nose pads, end pieces, arms) and the lenses, puts every frame pixel back exactly as photographed (pixel check: 0 different), turns the demo name, stickers and printing on the lens white, and leaves the table line under the frame to the white copy; 6 a map of what it measured; the test pictures are also saved in the repo (folder test-white) so they always open; a test only, nothing on the shop or any frame changes, every other robot job exactly as before) -- as 11-02b (SAFER ROBOT: the 30-degree try-on pictures of a frame fixed by hand now wake the robot, which makes them and puts them in TO CHECK; a frame whose pictures were cut short by the time limit is never marked done -- it is finished on the next run; one frame with bad data never stops the others or wakes the robot again and again; a photo-store failure is tried again, not saved as a problem; a frame that cannot be read just before saving is not written (a delete or a staff edit is never undone); ROBOT CHECKS read the frames page by page and see them all (the old filter hid every frame); the upload preset and any Gemini key are kept out of the public report files; the white-test page always says what the run did) -- as 11-01a (GEMINI TEST UPDATED: test-white:<frame> asks Google which Gemini models the key can use today and tries the newest Flash, then the newest Robotics-ER, then 2.5 Flash; reads the outline as points or as a picture mask; what Gemini calls lens is taken off the rims, nose pads and arms kept, and lens glass is never put back; every model's answer is in the report; the test pictures are on test-white.md in the repo with links that open; nothing else changed) -- as 10-30b (SHOP PHOTOS ON WHITE BY THE ROBOT: the front, 30-degree left and 30-degree right shop photos are made on white by the robot itself -- no phone needs Admin open; the website's own white maker runs in a hidden Chrome, then every pixel the white maker turned white inside the frame is looked at: rim, inner edge and nose pads that were cut are put back from the photo, and the whole rim is checked along the frame's outline -- if any of it is still missing the shop shows the photo as taken; a staff choice in Admin is never touched; white:<frame> makes one frame again, white:all every older white photo; test-white:<frame> makes a test picture with Gemini's outline of the frame, nothing saved) -- as 10-28c (RIMLESS LENSES FROM THE PHOTO: on a frame whose rim type says Rimless or 3 piece, each lens edge is traced on the photo itself, the two lenses as mirror images, one smooth line each -- front and 30-degree pictures; when the photo does not clearly show the edge the frame is held for TRACE DEMO; every other frame is cut exactly as before) -- as 10-28a (the robot file made smaller -- GitHub runs a workflow file only if it is 500 KB or less, and 10-27b was 516 KB so no run started; the cutter is now stored packed and unpacked on the runner, byte for byte the same; nothing else changed) -- as 10-27b (ROBOT CHECKS: when Admin -> TO CHECK -> ROBOT CHECKS is on, after the cutter the robot runs every TO CHECK check itself -- touch-up, rim, inside the lenses, arms, picture reader, colour, AUTO-LIVE -- in the live Admin page, signed in to the shop account; no phone needs Admin open; check:<frame> tests one frame; as 10-27a, plus: RIMLESS / HALF-RIM: when the photo's lens edge is too faint to trace, the lenses are taken from the AI's own shape -- the arms and ragged bits taken out, one plain smooth line -- and then cleared as before: the 17% tint and a thin edge line, the printing and arms seen through the glass gone, the bridge, end pieces and nose pads kept; a rimless or half-rim frame whose lenses still cannot be found is kept off the website with a note (draw them with TRACE DEMO) -- never sent with solid white lenses; as 10-26a, plus: the AI's own outer edge on full-rim cuts, front and 30-degree: along the outside of the frame the AI model's clean outline is used -- no dots beside the rim, no bites, no grey line through it, pin-holes in an arm closed; the lens openings, the arms the front cut takes off and any place the AI and the robot disagree stay the robot's; half-rim, supra and rimless unchanged; the shop photo on white unchanged; as 10-24a, plus: an ARM is never taken for glass on a 30-degree photo: a long, narrow or solid dark area is not a lens opening -- the Good Days half-rim arm was hollowed out; as 08d, plus earlier: robot reads shape/colour/material/rim but never fills them -- staff decide; as 08c, plus: the white shop photo ignores background patches and table shadow the cut-out took in, and keeps no grey halo; as 08a, plus: the shop photo on plain white -- frame untouched, demo lens clear, light shadows -- made with every front cut, and white:<frame> for frames already on the shop; as 07s, plus: the 30-degree rim healing and bottom smoothing only where the lens really has a rim along its bottom -- a supra or rimless lens edge is left as it is; the smoothed bottom keeps the frame's own colours and pattern; as 07r, plus: the nose pads (arm, holder and the clear silicone pad) put back on the 30-degree pictures from the photo, the grey patch under the bridge removed, and the try-on told not to clean these pictures again; as 07q, plus: the bottom rim of the 30-degree pictures made smooth and even -- no zigzag; as 07p, plus: the nose pads stay; the table shadow under the bottom rim is removed; as 07n, plus: the far temple keeps its first 5-6 mm behind the hinge, fading out; as 07m, plus: on 30-degree pictures everything seen through the lenses is cleared -- the far temple across the demo, solid glass in its top -- and the far temple behind the bridge (double bridge) is removed; as 07k, plus: the rim on 30-degree pictures is healed -- small breaks closed with the photo's own pixels, glare dots beside the rim removed, nose-pad side and hinge left alone; as 07j, plus: 30-degree fit points found on thin metal rims too -- a softer rim edge, small breaks closed, a lens cut short by solid glass gets its real height; as 05i, plus: cuts the optional 90-degree RIGHT TEMPLE photo (admin tile 5) as tryOnSide2Url; the shop's decisions win -- an approval, a published fix or details changed in admin while the robot is working are never undone; a frame deleted in admin while being cut is never written back; the end pieces bright silver faces the edge finishing dropped are put back; a continuous thin line runs under the copied demo edge so it never has gaps; bar above the lenses never cut; nose pads kept; full-rim and aviator unchanged; stages:<code>; CHECK PHOTO)" > look.txt
          python vg_look.py >> look.txt 2>&1
          code=$?
          cat look.txt
          { echo "### What the robot found"; echo '```'; cat look.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Install the cutter
        if: steps.look.outputs.waiting != '0'
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r vg_requirements.txt

      - name: Keep the model between runs
        if: steps.look.outputs.waiting != '0'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/mobile_sam.pt
          key: birefnet-cache-v2

      - name: Cut whatever is waiting
        if: steps.look.outputs.waiting != '0'
        env:
          SUPABASE_URL: https://oscpunukbyosckrmopeh.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
          CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_PRESET }}
          ALERT_NUMBERS: ${{ secrets.ALERT_NUMBERS }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          RECUT: ${{ !startsWith(github.event.inputs.recut, 'check:') && github.event.inputs.recut || '' }}
        run: |
          set +e
          python vg_cut.py > cut.txt 2>&1
          code=$?
          cat cut.txt
          { echo "### What the robot did"; echo '```'; sed -E "s/^::(warning|notice|error)::/  /" cut.txt | tail -n 80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Check the frames in TO CHECK (ROBOT CHECKS)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          SUPABASE_URL: https://oscpunukbyosckrmopeh.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RECUT: ${{ github.event.inputs.recut }}
        run: |
          set +e
          node vg_check.js > check.txt 2>&1
          cat check.txt
          { echo "### ROBOT CHECKS"; echo '```'; sed -E "s/^::(warning|notice|error)::/  /" check.txt | tail -n 60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Write the robot's report into the repo
        if: always()
        run: |
          {
            echo "Run $GITHUB_RUN_NUMBER  $(date -u)"
            echo "Trigger: $GITHUB_EVENT_NAME"
            echo
            echo "--- what the robot found ---"
            cat look.txt 2>/dev/null || echo "(the look did not run)"
            echo
            echo "--- what the robot did ---"
            { sed -E 's/^::(warning|notice|error)::/  /' cut.txt 2>/dev/null | tail -n 80; } || echo "(the cutter did not run)"
            echo
            echo "--- robot checks (TO CHECK) ---"
            { sed -E 's/^::(warning|notice|error)::/  /' check.txt 2>/dev/null | tail -n 40; } || echo "(the checks did not run)"
          } > robot-log.txt
          if [ -s cut.txt ]; then
            { echo "Run $GITHUB_RUN_NUMBER  $(date -u)"; echo; sed -E 's/^::(warning|notice|error)::/  /' cut.txt | tail -n 120; } > last-cut.txt
          fi
          rm -f vg_look.py vg_cut.py vg_requirements.txt vg_check.js look.txt cut.txt check.txt
          git config user.name  "vg-cutter"
          git config user.email "vg-cutter@users.noreply.github.com"
          git add robot-log.txt
          git add last-cut.txt 2>/dev/null || true
          git add test-white.md 2>/dev/null || true
          git add -A test-white 2>/dev/null || true
          git commit -m "robot log, run $GITHUB_RUN_NUMBER" || exit 0
          git pull --rebase --quiet || true
          git push || true
