name: Cut-out robot

# The whole robot lives in this one file. Every ten minutes it takes a
# ten-second look at the shop database; only when a frame is waiting
# does it install the cutter and do the work. "Run workflow" does it
# now; the Trial box takes: first (re-cut one frame), a frame id, or
# reset (forgive rejected frames and try them again).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      recut:
        description: 'check:<frame> (ROBOT CHECKS on one frame) / first / a frame id / stages:<code> (picture of every step, nothing saved) / reset / all / test:<id or fullrim> / test-lens:<ids, names or all> / guard / guard:save:<ids or all> / adopt-lens:<ids or all> / test-plain:<id> / test-colour:<id> / recolour:<ids or all> / adopt:<ids or all> / restore:<ids or all> / clear:<ids> / views:<frame> / white:<frame or all> (shop photos on white made again by the robot, rim checked) / test-white:<frame> (white photo test with Gemini -- a picture only, nothing saved)'
        required: false
        default: ''

permissions:
  contents: write

# Only one robot at a time: a new look waits until the running cut has
# finished, so two runs never cut the same frames at once.
concurrency:
  group: cut-out-robot
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unpack the robot
        run: |
          cat > vg_look.py <<'PYEOF'
          """
          The ten-second look.

          This runs every ten minutes and does almost nothing: it asks the shop
          database whether any frame is waiting for a cut-out, and writes down that
          the robot is alive. Only if something IS waiting does the real cutter get
          woken, with its half-gigabyte of libraries and its model.

          Deliberately written with nothing but what Python already has, so this
          step needs no installing at all. An idle day therefore costs seconds, not
          minutes -- which is what makes running every ten minutes sensible.
          """

          import datetime
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          SUPABASE_URL = (os.environ.get("SUPABASE_URL") or "").strip().rstrip("/")
          SUPABASE_KEY = (os.environ.get("SUPABASE_KEY") or "").strip()


          def key_role():
              try:
                  import base64
                  part = SUPABASE_KEY.split(".")[1]
                  part += "=" * (-len(part) % 4)
                  return json.loads(base64.urlsafe_b64decode(part)).get("role", "?")
              except Exception:
                  return "not a legacy JWT key"
          MAX_TRIES = int(os.environ.get("MAX_TRIES", "3"))


          def call(path, method="GET", body=None, prefer=None):
              req = urllib.request.Request(SUPABASE_URL + path, method=method)
              req.add_header("apikey", SUPABASE_KEY)
              req.add_header("Authorization", "Bearer " + SUPABASE_KEY)
              req.add_header("Content-Type", "application/json")
              if prefer:
                  req.add_header("Prefer", prefer)
              data = json.dumps(body).encode() if body is not None else None
              # A BROKEN DOWNLOAD IS TRIED AGAIN (2026-09-29): the quick look read
              # everything in one go with no second try ("IncompleteRead"), and a
              # cut-short answer was quietly taken as "no frames at all". Now a
              # broken or unreadable answer is retried after 3, 6, 12 s; a real
              # refusal (4xx, e.g. a wrong key) still stops at once.
              last = None
              for i in range(4):
                  try:
                      with urllib.request.urlopen(req, data, timeout=45) as r:
                          text = r.read().decode() or "[]"
                      return json.loads(text)
                  except urllib.error.HTTPError as e:
                      if 400 <= e.code < 500:
                          raise RuntimeError("database answered %d: %s" % (e.code, e.read().decode()[:200]))
                      last = e
                  except Exception as e:
                      last = e
                  if i < 3:
                      print("database read broke (%s) -- trying again in %d s" % (str(last)[:80], 3 * 2 ** i))
                      time.sleep(3 * 2 ** i)
              raise RuntimeError("database read failed 4 times: %s" % str(last)[:160])


          def waiting(p):
              if p.get("draft") or p.get("deleted"):
                  return False          # a DRAFT (details not typed yet) is never cut -- same rule as the robot itself
              if p.get("tryOnLocked"):
                  return False
              if p.get("tryOnOk") is False:
                  return False          # try-on switched off by hand in admin: leave it
              if (p.get("tryOnFails") or 0) >= MAX_TRIES:
                  return False
              if p.get("tryOnReady") and p.get("tryOnUrl"):
                  return False
              ang = p.get("anglePhotos") if isinstance(p.get("anglePhotos"), dict) else {}
              return bool(p.get("rawFrontUrl") or p.get("originalUrl") or ang.get("front") or p.get("url"))


          # SHOP PHOTOS ON WHITE BY THE ROBOT (2026-10-30): a frame whose front / 30-degree photos have no white copy made from the
          # photo that is there now also wakes the cutter (the same rule as the cutter's white_todo and Admin's whiteTodo).
          WHITE_TRIES = 3
          WHITE_SYS_TRIES = 12


          def _wnum(v):
              try:
                  return float(v)
              except Exception:
                  return 0.0


          def white_sources(p):
              out = {}
              if p.get("url"):
                  out["front"] = p.get("url")
              for g in (p.get("gallery") if isinstance(p.get("gallery"), list) else []):
                  if isinstance(g, dict) and g.get("url") and g.get("view") in ("angle", "angle-right") and g.get("view") not in out:
                      out[g.get("view")] = g.get("url")
              return out


          def white_waiting(p):
              """The cutter's white_todo rule, exactly (a person's choice, done, tried enough -> not waiting)."""
              try:
                  if not isinstance(p, dict) or p.get("deleted"):
                      return 0
                  W = p.get("whitePhotos") if isinstance(p.get("whitePhotos"), dict) else {}
                  n = 0
                  for k, src in white_sources(p).items():
                      if not str(src).startswith("https://res.cloudinary.com/"):
                          continue
                      e = W.get(k) if isinstance(W.get(k), dict) else None
                      if e and e.get("from") == src:
                          if e.get("staff") or (e.get("by") and e.get("by") != "robot"):
                              continue
                          if _wnum(e.get("v")) == 2 and _wnum(e.get("mk")) >= 3 and not e.get("redo"):
                              continue
                          if _wnum(e.get("fails")) >= WHITE_TRIES or _wnum(e.get("sysFails")) >= WHITE_SYS_TRIES:
                              continue
                      n += 1
                  return n
              except Exception:
                  return 0


          def main():
              now = datetime.datetime.utcnow().isoformat() + "Z"
              state = {"lastLook": now, "ok": False}
              failed = False
              recut = (os.environ.get("RECUT") or "").strip()
              if not SUPABASE_URL or not SUPABASE_KEY:
                  print("::error::STOP: the SUPABASE_KEY secret is missing or empty.")
                  failed = True
              else:
                  print("::notice::Database %s, key role: %s" % (SUPABASE_URL, key_role()))
              count = 0
              try:
                  rows, off = [], 0                                   # pages of 200: small answers break less often
                  while True:
                      page = call("/rest/v1/products?select=id,data&order=id.asc&limit=200&offset=%d" % off)
                      rows += page
                      if len(page) < 200:
                          break
                      off += 200
                  frames = [r.get("data") or {} for r in rows if not str(r.get("id") or "").startswith("__")]
                  if recut.lower() == "all":
                      # cut every frame again with the current method (after a cutter
                      # improvement). Hand-supplied PNGs and switched-off try-ons are left.
                      redo = []
                      for r in rows:
                          d = r.get("data") or {}
                          if str(r.get("id") or "").startswith("__") or d.get("tryOnLocked") or d.get("tryOnOk") is False:
                              continue
                          d["tryOnReady"] = False; d["tryOnFails"] = 0; d.pop("tryOnFail", None)
                          d.pop("tryOnAngleUrl", None); d.pop("tryOnSideUrl", None); d.pop("tryOnSide2Url", None)
                          redo.append({"id": str(r.get("id")), "data": d, "updated_at": now})
                      if redo:
                          call("/rest/v1/products?on_conflict=id", "POST", redo,
                               "resolution=merge-duplicates,return=minimal")
                      print("Re-cut all: %d frame(s) queued for a fresh cut." % len(redo))
                      recut = ""
                      frames = [r.get("data") or {} for r in rows if not str(r.get("id") or "").startswith("__")]
                  if recut.lower() == "fullrim":
                      # re-cut only the frames saved as "Full rim" in admin (the method
                      # changed for them). Half rim / supra / rimless, switched-off and
                      # hand-supplied frames are left exactly as they are. Each frame's
                      # current cut-out is kept in tryOnPrev so it can be put back.
                      redo = []
                      for r in rows:
                          d = r.get("data") or {}
                          rim = str(d.get("rim") or d.get("rimType") or "").lower()
                          full = ("full" in rim) and not any(w in rim for w in ("half", "semi", "supra", "rimless"))
                          if str(r.get("id") or "").startswith("__") or d.get("tryOnLocked") or d.get("tryOnOk") is False or not full:
                              continue
                          if d.get("tryOnUrl"):
                              d["tryOnPrev"] = {"url": d.get("tryOnUrl"), "numbers": d.get("tryOnNumbers"),
                                                "angle": d.get("tryOnAngleUrl"), "side": d.get("tryOnSideUrl")}
                          d["tryOnReady"] = False; d["tryOnFails"] = 0; d.pop("tryOnFail", None)
                          d.pop("tryOnAngleUrl", None); d.pop("tryOnSideUrl", None); d.pop("tryOnSide2Url", None)
                          redo.append({"id": str(r.get("id")), "data": d, "updated_at": now})
                      if redo:
                          call("/rest/v1/products?on_conflict=id", "POST", redo,
                               "resolution=merge-duplicates,return=minimal")
                      print("Re-cut full rim: %d frame(s) queued: %s" % (len(redo), ", ".join(
                          str((x["data"].get("name") or x["id"]))[:20] for x in redo)))
                      recut = ""
                      frames = [r.get("data") or {} for r in rows if not str(r.get("id") or "").startswith("__")]
                  if recut.lower() == "reset":
                      # forgive every rejection: the fault was ours (a wrong secret),
                      # not the photos. The cutter then tries them all again.
                      cleared = []
                      for r in rows:
                          d = r.get("data") or {}
                          if str(r.get("id") or "").startswith("__"):
                              continue
                          if (d.get("tryOnFails") or 0) > 0:
                              d["tryOnFails"] = 0
                              d.pop("tryOnFail", None)
                              cleared.append({"id": str(r.get("id")), "data": d, "updated_at": now})
                      if cleared:
                          call("/rest/v1/products?on_conflict=id", "POST", cleared,
                               "resolution=merge-duplicates,return=minimal")
                      print("Reset: %d frame(s) forgiven and back in the queue." % len(cleared))
                      recut = ""
                  count = sum(1 for p in frames if waiting(p))
                  try:
                      whites = sum(white_waiting(p) for p in frames)
                  except Exception:
                      whites = 0
                  if whites:
                      print("::notice::Shop photos on white waiting: %d (the robot makes them now)." % whites)
                  rejected = sum(1 for p in frames if (p.get("tryOnFails") or 0) >= MAX_TRIES)
                  # say WHY, so a rejection can be read from the run page
                  reasons = {}
                  for p in frames:
                      if (p.get("tryOnFails") or 0) >= 1 and p.get("tryOnFail"):
                          reasons.setdefault(str(p.get("tryOnFail"))[:160], []).append(str(p.get("name") or p.get("id"))[:24])
                  for why, names in sorted(reasons.items(), key=lambda kv: -len(kv[1]))[:6]:
                      print("  %d frame(s): %s  [%s]" % (len(names), why, ", ".join(names[:4])))
                  state = {"lastLook": now, "ok": True, "waiting": count,
                           "rejected": rejected, "frames": len(frames)}
                  if recut:
                      count = max(count, 1)     # a trial cut was asked for: wake the cutter
                  if whites:
                      count = max(count, 1)     # white photos waiting: wake the cutter too
                  state["whiteWaiting"] = whites
                  print("::notice::Frames: %d. Waiting: %d. Rejected: %d.%s" % (len(frames), count, rejected,
                        ("  Trial re-cut asked for: " + recut) if recut else ""))
              except Exception as e:
                  state["error"] = str(e)[:300]
                  print("::error::STOP: could not read the database: %s" % str(e)[:200].replace("\n", " "))
                  failed = True

              # The health line in admin reads this row.
              try:
                  old = call("/rest/v1/products?select=id,data&id=eq.__robot")
                  keep = (old[0].get("data") if old else None) or {}
                  keep.update(state)
                  if state.get("ok") and "error" not in state:
                      keep.pop("error", None)
                  call("/rest/v1/products?on_conflict=id", "POST",
                       [{"id": "__robot", "data": keep, "updated_at": now}],
                       "resolution=merge-duplicates,return=minimal")
              except Exception as e:
                  print("Could not write the health note: %s" % str(e)[:150])

              out = os.environ.get("GITHUB_OUTPUT")
              if out:
                  with open(out, "a") as f:
                      f.write("waiting=%d\n" % count)
              if failed:
                  raise SystemExit(1)


          if __name__ == "__main__":
              main()
          PYEOF
          # the cutter program, packed (GitHub runs a workflow file only if it is 500 KB or less; unpacked it is the same file)
          base64 -d > vg_cut.py.gz <<'B64EOF'
          H4sIAAAAAAAC/9y9+3YbR9In+D+fogY6sqokEAJISbZB0bO0RFscS6QOSbfazeFiikABKBO3riqI
