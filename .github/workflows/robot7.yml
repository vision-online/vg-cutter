          def download(url):
              r = requests.get(url, timeout=120)
              r.raise_for_status()
              return r.content


          def alpha_of(png_bytes):
              a = np.asarray(Image.open(io.BytesIO(png_bytes)).convert("RGBA"))[..., 3]
              return a


          def guard_compare(old_png, new_png):
              """How far a fresh cut has moved from the approved one. Returns a dict:
              the outline size of each, and the share of pixels that changed once the
              two are laid on top of each other at the same size."""
              o, n = alpha_of(old_png), alpha_of(new_png)
              out = {"oldSize": "%dx%d" % (o.shape[1], o.shape[0]),
                     "newSize": "%dx%d" % (n.shape[1], n.shape[0])}
              out["widthChange"] = (n.shape[1] - o.shape[1]) / float(max(1, o.shape[1]))
              out["heightChange"] = (n.shape[0] - o.shape[0]) / float(max(1, o.shape[0]))
              import cv2
              from scipy import ndimage
              n2 = cv2.resize(n, (o.shape[1], o.shape[0]), interpolation=cv2.INTER_NEAREST)
              solid_o, solid_n = o > 127, n2 > 127
              # 2026-09-23: judge the OUTLINE apart from the GLASS. Clearing more of a
              # demo lens is an improvement (MobileSAM did exactly that on Visibilla and
              # it read as "29.5% moved"); a change to the frame's own shape or rim is
              # the thing that must never pass unseen.
              fill_o = ndimage.binary_fill_holes(solid_o)
              fill_n = ndimage.binary_fill_holes(solid_n)
              out["outlineChange"] = int((fill_o ^ fill_n).sum()) / float(max(1, int(fill_o.sum())))
              glass_o, glass_n = fill_o & ~solid_o, fill_n & ~solid_n
              out["glassCleared"] = (int(glass_n.sum()) - int(glass_o.sum())) / float(max(1, int(fill_o.sum())))
              out["pixelChange"] = int((solid_o ^ solid_n).sum()) / float(max(1, int(solid_o.sum())))
              # RIM LOSS: material that disappeared close to the frame's outer edge. Glass
              # cleared inside a lens lies deep in; a rim eaten from the inside lies within
              # about a rim's thickness of the outside, and the outline does not move, so
              # nothing else here would see it.
              # HOW WIDE IS THE RIM in each cut-out: for a pixel just inside a lens
              # edge, the distance to the outside IS the rim's thickness there. Compare
              # the typical value in both. Glass cleared deeper inside a lens barely
              # changes it; a rim eaten from the inside drops it at once, with the
              # outline unmoved and nothing else able to see it.
              def rim_width(fill, solid):
                  glass = fill & ~solid
                  if not glass.any() or not solid.any():
                      return 0.0, 0.0
                  d = ndimage.distance_transform_edt(fill)
                  ring = ndimage.binary_dilation(glass, iterations=2) & solid
                  if not ring.any():
                      return 0.0, 0.0
                  v = d[ring]
                  # leave out the ring around any leftover patch deep inside a lens: it
                  # sits far from the outside and would hide a thin spot on the rim
                  v = v[v <= np.median(v) * 1.5]
                  if not v.size:
                      return 0.0, 0.0
                  # the thinnest tenth matters: a rim eaten on ONE side leaves the
                  # middle value untouched, exactly as the robot's own rim check found
                  return float(np.median(v)), float(np.percentile(v, 10))
              (rw_o, thin_o), (rw_n, thin_n) = rim_width(fill_o, solid_o), rim_width(fill_n, solid_n)
              out["rimWidth"] = (rw_o, rw_n)
              out["rimThinner"] = 0.0 if thin_o <= 0 or thin_n <= 0 else max(0.0, (thin_o - thin_n) / thin_o)
              return out


          def run_guard(products, cname, cpreset):
              """THE SAFETY NET (2026-09-23). A change to the robot must never quietly
              spoil a frame that was already right. These reference frames carry an
              approved cut-out; this re-cuts each one with the robot as it stands now
              and compares. Nothing is published, nothing is saved.
                guard:save:<ids or all-live>  remember today's cut-outs as approved
                guard                          re-cut them all and report the differences"""
              ref = [p for p in products if (p.get("guardBase") or {}).get("url")]
              if not ref:
                  log("::warning::GUARD: no reference frames yet. Run  guard:save:<ids>  on frames whose "
                      "cut-outs you have approved, then  guard  checks every robot change against them.")
                  return
              log("GUARD: checking %d reference frame(s) against their approved cut-outs" % len(ref))
              worst = 0.0
              for p in ref:
                  pid = str(p.get("id")); nm = (p.get("name") or "")[:22]
                  base = p["guardBase"]
                  try:
                      src = front_photo(p)
                      rim_txt = str(p.get("rim") or p.get("rimType") or "").lower()
                      rk = rim_kind_of(rim_txt) if (is_metal(p) or str(pid) in NEW_METHOD_IDS) else ""
                      _hint = any(k in rim_txt for k in ("half", "supra", "semi", "rimless"))
                      png, nums = cut(download(src), front=True, rim_kind=rk, half_rim_hint=_hint,
                                      colour_bytes=None, front_crop=False, lens_fix=lens_ok(p), size=p.get("size"))
                      # the same second try the live cutting does, so guard shows what
                      # the shop would really get (2026-09-23)
                      if rk and nums.get("rimBad"):
                          log("    the thin-metal way damaged the rim -- trying the plain way once")
                          png2, nums2 = cut(download(src), front=True, rim_kind="", half_rim_hint=_hint,
                                            colour_bytes=None, front_crop=False, lens_fix=lens_ok(p), size=p.get("size"))
                          if not nums2.get("reject"):
                              png, nums = png2, nums2
                              log("    the plain way came out clean -- using that")
                          else:
                              log("    the plain way was no better: " + str(nums2.get("reject"))[:70])
                      d = guard_compare(download(base["url"]), png)
                      # glass GAINED is an improvement; glass LOST means a lens went solid again
                      moved = max(abs(d["widthChange"]), abs(d["heightChange"]), d["outlineChange"],
                                  max(0.0, -d["glassCleared"]), d.get("rimThinner", 0.0))
                      worst = max(worst, moved)
                      mark = "SAME" if moved <= 0.01 else ("CHANGED" if moved <= 0.05 else "BADLY CHANGED")
                      glass = d["glassCleared"] * 100
                      log("    %-22s %-13s outline %+.1f%%  width %+.1f%%  height %+.1f%%  glass %s%.1f%%  rim %.0f->%.0f px  (%s -> %s)"
                          % (nm, mark, d["outlineChange"] * 100, d["widthChange"] * 100, d["heightChange"] * 100,
                             "+" if glass >= 0 else "", glass, d.get("rimWidth", (0, 0))[0], d.get("rimWidth", (0, 0))[1], d["oldSize"], d["newSize"]))
                      if moved > 0.01:
                          try:
                              url = cloudinary_upload(png, "guard-%s" % pid, cname, cpreset)
                              log("      the fresh cut: " + url)
                          except Exception:
                              pass
                  except Exception as e:
                      log("    %-22s could not be checked: %s" % (nm, str(e)[:90]))
              if worst <= 0.01:
                  log("::notice::GUARD: every reference frame came out the same. The change is safe.")
              else:
                  log("::warning::GUARD: a reference frame moved by %.1f%%. Look at the pictures above "
                      "before putting this robot to work on the shop." % (worst * 100))


          def save_guard(products, want):
              """Remember today's cut-outs as the approved ones."""
              n = 0
              for p in products:
                  pid = str(p.get("id"))
                  if ("all" not in want and not any(frame_matches(p, w) for w in want)) or not p.get("tryOnUrl"):
                      continue
                  p["guardBase"] = {"url": p["tryOnUrl"], "at": datetime.datetime.utcnow().isoformat() + "Z"}
                  save_product(p); n += 1
                  log("    approved cut-out remembered for %s (%s)" % (pid, (p.get("name") or "")[:24]))
              log("::notice::GUARD: %d reference frame(s) saved. From now on  guard  checks every robot change against them." % n)


          def views_for_hand_published(products):
              """VIEWS FOR FRAMES THAT WENT LIVE BY HAND (2026-09-26): a frame published
              with FIX IT or CLEAN GLASS, or saved with a ready-made PNG, never passes
              through the robot's own front cut, so its 45 and side views were never
              cut. Only frames saved or hand-fixed from 26 Sep on are done here
              automatically; older frames wait for the shop's views:<id> command.
              Runs on every normal wake-up, including when nothing is waiting."""
              try:
                  cname_v = cpreset_v = None
                  for p in products:
                      if out_of_time():
                          break
                      if not (p.get("tryOnReady") and p.get("tryOnUrl")) or p.get("deleted") or p.get("draft"):
                          continue
                      if int(p.get("tryOnViewsV") or 0) >= VIEWS_VERSION:
                          continue
                      # (a) staff changed this frame's 45 photos in the edit panel: that is
                      #     the go-ahead for this frame; (b) new frames and frames published
                      #     through FIX IT. A CLEAN GLASS on an older frame does not count --
                      #     those wait for views:<id>.
                      if not p.get("tryOnViewsWant"):
                          if not p.get("tryOnLocked"):
                              continue
                          if max(str(p.get("added") or ""), str(p.get("tryOnFixedAt") or "")) < "2026-09-26":
                              continue
                      if not (angle_photo(p) or angle_right_photo(p) or side_photo(p)):
                          continue
                      if cname_v is None:
                          cname_v, cpreset_v = cloudinary_probe(products)
                      log("--- %s : %s (views for a hand-published frame)" % (p.get("id"), (p.get("name") or "")[:40]))
                      cut_views(p, cname_v, cpreset_v)
                      p.pop("tryOnViewsWant", None)
                      save_product(p)
              except Exception as _ex:
                  log("    views for hand-published frames stopped: %s" % str(_ex)[:100])


          def main():
              if not SUPABASE_URL or not SUPABASE_KEY:
                  log("STOP: SUPABASE_URL or SUPABASE_KEY is missing from the repository secrets.")
                  return 1

              log("Database: %s  key: %s" % (SUPABASE_URL, key_role()))
              try:
                  products = fetch_products()
              except Exception as e:
                  msg = str(e)
                  if "401" in msg or "403" in msg or "JWT" in msg:
                      log("::error::STOP: the database rejected the key. Replace the SUPABASE_KEY secret "
                          "with the service_role key (Supabase -> Settings -> API Keys -> Legacy).")
                  else:
                      log("::error::STOP: could not read the database: %s" % msg[:300].replace("\n", " "))
                  health({"ok": False, "error": msg[:300]})
                  return 1
              todo = [p for p in products if waiting(p)]
              recut = (os.environ.get("RECUT") or "").strip()
              test_mode = ""
              if recut.lower().startswith("guard:save:") or recut.lower() == "guard:save":
                  want = [x.strip() for x in recut.split(":", 2)[2].split(",") if x.strip()] if recut.count(":") >= 2 else ["all"]
                  cname, cpreset = cloudinary_probe(products)
                  save_guard(products, want)
                  return 0
              if recut.lower() == "guard":
                  cname, cpreset = cloudinary_probe(products)
                  run_guard(products, cname, cpreset)
                  return 0
              if recut.lower().startswith("fit:"):
                  # FIT POINTS WITHOUT RE-CUTTING (1 Oct): fit:all or fit:<ids> reads the
                  # 45 and side cut-outs a frame already has and records their bridge and
                  # lens openings. Nothing is cut, nothing goes to TO CHECK.
                  want = [x.strip() for x in recut.split(":", 1)[1].split(",") if x.strip()]
                  done = 0
                  for p in products:
                      if str(p.get("id", "")).startswith("__") or p.get("draft") or p.get("deleted"):
                          continue
                      if "all" not in want and not any(frame_matches(p, w) for w in want):
                          continue
                      changed = False
                      for field, label in (("tryOnAngleUrl", "45 left"), ("tryOnAngleRUrl", "45 right")):
                          url = p.get(field)
                          if not url:
                              continue
                          try:
                              fit = angle_anchors(download(url))
                          except Exception as ex:
                              log("--- %s: %s could not be read: %s" % (p.get("name") or p.get("id"), label, str(ex)[:60])); continue
                          p[field.replace("Url", "Fit")] = fit
                          changed = True
                          log("--- %s: %s fit points %s" % (p.get("name") or p.get("id"), label,
                              ("bridge at (%d,%d), lens height %d px" % (fit["bridge"][0], fit["bridge"][1], fit["lensHeightPx"])) if fit else "not found (the try-on will use the picture's box)"))
                      if changed:
                          save_product(p); done += 1
                  log("Fit points recorded for %d frame(s)." % done)
                  return 0
              if recut.lower().startswith("adopt-lens:"):
                  # like adopt:, but ONLY test cuts made by test-lens: (older test cuts,
                  # e.g. Sizzler's, are never made live by this)
                  ADOPT_LENS_ONLY[0] = True
                  recut = "adopt:" + recut.split(":", 1)[1]
              if recut.lower().startswith("adopt:"):
                  # Make a checked test cut live: "adopt:id1,id2" or "adopt:all". The
                  # cut-out it replaces is kept in tryOnPrev (restore: puts it back).
                  want = [x.strip() for x in recut.split(":", 1)[1].split(",") if x.strip()]
                  for p in products:
                      t = p.get("tryOnTest")
                      if not t or not t.get("url"):
                          continue
                      if "all" not in want and not any(frame_matches(p, w) for w in want):
                          continue
                      if ADOPT_LENS_ONLY[0] and (not t.get("lens") or not lens_ok(p)):
                          continue
                      if t.get("reject"):
                          log("    NOT adopted %s (%s): the photo needs a re-shoot"
                              % (p.get("id"), (p.get("name") or "")[:30]))
                          continue
                      if p.get("tryOnUrl"):
                          p["tryOnPrev"] = {"url": p.get("tryOnUrl"), "numbers": p.get("tryOnNumbers"),
                                            "angle": p.get("tryOnAngleUrl"), "side": p.get("tryOnSideUrl")}
                      p["tryOnUrl"] = t["url"]; p["tryOnReady"] = True
                      if t.get("reading"):
                          fl = apply_reading(p, t["reading"])     # shape, rim, material, colour
                          if fl:
                              log("    read from the photo: " + ", ".join(fl))
                      if t.get("numbers"):
                          p["tryOnNumbers"] = t["numbers"]
                      p.pop("tryOnWarning", None); p.pop("tryOnTest", None)
                      p["tryOnCutBy"] = "robot"
                      save_product(p)
                      log("    adopted %s (%s) -> %s" % (p.get("id"), (p.get("name") or "")[:30], t["url"]))
                  return 0
              if recut.lower().startswith("clear:"):
                  # Take a try-on DOWN because the photo is not fit for it (arms or
                  # stickers across the glass): "clear:id1,id2". The frame stays in
                  # the shop; it shows no try-on and the robot leaves it alone until a
                  # new front photo is uploaded in admin (that upload resets
                  # tryOnFails to 0 and the robot cuts it fresh).
                  want = [x.strip() for x in recut.split(":", 1)[1].split(",") if x.strip()]
                  for p in products:
                      if not any(frame_matches(p, w) for w in want):
                          continue
                      for k in ("tryOnUrl", "tryOnAngleUrl", "tryOnSideUrl", "tryOnNumbers",
                                "tryOnTest", "tryOnPrev", "tryOnWarning",
                                "tryOnAngleRUrl", "tryOnViewsV", "tryOnViewsOk", "tryOnViewsWant",
                                "pendingViews", "viewProblems", "tryOnAngleSource", "tryOnAngleRSource", "tryOnSideSource"):
                          p.pop(k, None)
                      p["tryOnUrl"] = ""
                      p["tryOnReady"] = False
                      p["tryOnFails"] = MAX_TRIES
                      p["tryOnFail"] = ("photo not fit for try-on (arms or stickers across the glass) "
                                        "-- re-shoot: arms straight back, stickers off, nothing behind the lenses")
                      save_product(p)
                      log("    cleared %s (%s): try-on taken down, waiting for a new photo" % (p.get("id"), (p.get("name") or "")[:30]))
                  return 0
              if recut.lower().startswith("views:"):
                  # VIEWS (2026-09-26): cut the 45 left, 45 right and 90 side views of
                  # frames already on the shop, on white. The front cut-out is not
                  # touched. Try one frame first: views:<id>. Then views:all.
                  want = [x.strip() for x in recut.split(":", 1)[1].split(",") if x.strip()]
                  cname, cpreset = cloudinary_probe(products)
                  done_n = 0
                  for p in products:
                      pid = str(p.get("id"))
                      if "all" not in want and not any(frame_matches(p, w) for w in want):
                          continue
                      if not p.get("tryOnUrl") or p.get("deleted") or p.get("draft"):
                          continue
                      if "all" in want and int(p.get("tryOnViewsV") or 0) >= VIEWS_VERSION:
                          continue                                   # done in an earlier run
                      if out_of_time():
                          log("Time is up; run views:all again to finish the rest.")
                          break
                      log("--- %s : %s" % (pid, (p.get("name") or "")[:40]))
                      n = cut_views(p, cname, cpreset, force=True)
                      save_product(p)
                      done_n += 1
                      vo = p.get("tryOnViewsOk") or {}
                      log("    views on white: %s" % (", ".join("%s %s" % (k, "clean" if v else "photo kept") for k, v in vo.items()) or "no angle photos"))
                      for f in ("tryOnAngleUrl", "tryOnAngleRUrl", "tryOnSideUrl"):
                          if p.get(f): log("      %s: %s" % (f, p[f]))
                  log("  Views done for %d frame(s)." % done_n)
                  return 0
              if recut.lower().startswith("recolour:"):
                  # RE-COLOUR (2026-09-21, Rauf's go): every plastic / sheet / TR frame
                  # is cut again with the SAME shape method, colours taken from the
                  # plain photo (no white sharpening lines). SAFETY: the new cut goes
                  # live ONLY if its shape is identical, pixel for pixel, to the live
                  # cut-out; otherwise the frame is skipped and left as it is. The old
                  # cut-out is kept in tryOnPrev, so "restore:<id>" puts it back.
                  want = [x.strip() for x in recut.split(":", 1)[1].split(",") if x.strip()]
                  cname, cpreset = cloudinary_probe(products)
                  n_ok = n_skip = 0
                  for p in products:
                      pid = str(p.get("id"))
                      if "all" not in want and not any(frame_matches(p, w) for w in want):
                          continue
                      if is_metal(p) or not p.get("tryOnUrl") or not front_photo(p) or p.get("tryOnLocked"):
                          continue
                      if p.get("tryOnColour") == "plain-v1" and "all" in want:
                          continue                                   # done in an earlier run
                      if out_of_time():
                          log("Time is up; run recolour:all again to finish the rest.")
                          break
                      name = (p.get("name") or "")[:30]
                      try:
                          src = front_photo(p)
                          rim_txt = str(p.get("rim") or p.get("rimType") or "").lower()
                          hint = any(k in rim_txt for k in ("half", "supra", "semi", "rimless"))
                          png, nums = cut(download(src), front=True, rim_kind="", half_rim_hint=hint,
                                          colour_bytes=download(no_enhancement(src)))
                          new_a = np.asarray(Image.open(io.BytesIO(png)).convert("RGBA"))[..., 3]
                          old_a = np.asarray(Image.open(io.BytesIO(download(p["tryOnUrl"]))).convert("RGBA"))[..., 3]
                          if new_a.shape != old_a.shape:
                              log("    SKIPPED %s (%s): shape size differs %s vs %s -- left as it is"
                                  % (pid, name, new_a.shape, old_a.shape)); n_skip += 1; continue
                          diff = int((new_a != old_a).sum())
                          if diff:
                              log("    SKIPPED %s (%s): shape differs in %d pixels -- left as it is"
                                  % (pid, name, diff)); n_skip += 1; continue
                          url = cloudinary_upload(png, "tryon-" + pid, cname, cpreset)
                          p["tryOnPrev"] = {"url": p.get("tryOnUrl"), "numbers": p.get("tryOnNumbers"),
                                            "angle": p.get("tryOnAngleUrl"), "side": p.get("tryOnSideUrl")}
                          p["tryOnUrl"] = url
                          p["tryOnColour"] = "plain-v1"
                          save_product(p)
                          n_ok += 1
                          log("    RECOLOURED %s (%s): shape identical, colours from plain photo -> %s"
                              % (pid, name, url))
                      except Exception as e:
                          n_skip += 1
                          log("    SKIPPED %s (%s): error %s -- left as it is" % (pid, name, str(e)[:200]))
                  log("Re-colour finished: %d re-coloured, %d skipped (left as they were)." % (n_ok, n_skip))
                  return 0
              if recut.lower().startswith("test-plain:"):
                  # TEST ONLY: same cutting (Sizzler method), but from the plain photo
                  # instead of the enhanced one. Result goes to tryOnTest; live unchanged.
                  PLAIN_PHOTO[0] = True
                  recut = "test:" + recut.split(":", 1)[1]
              if recut.lower().startswith("test-colour:"):
                  # TEST ONLY: shape exactly as today (enhanced photo, Sizzler
                  # method); only the COLOURS come from the plain photo.
                  PLAIN_PHOTO[0] = "colour"
                  recut = "test:" + recut.split(":", 1)[1]
              if recut.lower().startswith("test-lens:"):
                  # TEST ONLY (lens step): each frame is cut twice -- exactly as live
                  # today, and with the lens step -- and the two are compared pixel by
                  # pixel. A comparison picture (changes in red) is uploaded and the
                  # result with the lens step goes to tryOnTest. Live is unchanged.
                  LENS_TEST[0] = True
                  recut = "test:" + recut.split(":", 1)[1]
              if recut.lower().startswith("test:"):
                  # A CHECKED test: cut with the normal method, upload, and keep the
                  # result in tryOnTest for review. The live cut-out is NOT changed.
                  # "test:<id>", "test:fullrim" (Full rim frames other than Lot).
                  test_mode = "plain"
                  what = recut.split(":", 1)[1].strip()
                  if LENS_TEST[0] and what.lower() == "all":
                      # test-lens:all -- every frame the lens step is meant for, that has a
                      # front photo, try-on switched on, and is not rejected or hand-supplied
                      todo = [p for p in products if not str(p.get("id") or "").startswith("__")
                              and lens_ok(p) and front_photo(p) and p.get("tryOnOk") is not False
                              and not p.get("tryOnLocked") and (p.get("tryOnFails") or 0) < MAX_TRIES]
                  elif what.lower() == "fullrim":
                      todo = []
                      for p in products:
                          rim = str(p.get("rim") or p.get("rimType") or "").lower()
                          full = ("full" in rim) and not any(w in rim for w in ("half", "semi", "supra", "rimless"))
                          if full and front_photo(p) and str(p.get("id")) not in NEW_METHOD_IDS \
                                  and p.get("tryOnOk") is not False and not p.get("tryOnLocked") \
                                  and not (p.get("tryOnTest") or {}).get("url"):
                              todo.append(p)
                  else:
                      ids_ = [x.strip() for x in what.split(",") if x.strip()]
                      low_ = [x.lower() for x in ids_]
                      def _nm(p):
                          n_ = str(p.get("name") or "").strip().lower()
                          return n_ in low_ or (n_.split() or [""])[0] in low_
                      todo = [p for p in products if str(p.get("id")) in ids_ or _nm(p)]
                  recut = ""
                  log("Test cut of %d frame(s): %s" % (len(todo), ", ".join((p.get("name") or "")[:16] for p in todo)))
              if recut.lower().startswith("restore:"):
                  # UNDO: put back the cut-out a frame had before the last full-rim
                  # re-cut (kept in tryOnPrev). "restore:id1,id2" or "restore:all".
                  want = [x.strip() for x in recut.split(":", 1)[1].split(",") if x.strip()]
                  for p in products:
                      prev = p.get("tryOnPrev")
                      if not prev or not prev.get("url"):
                          continue
                      if "all" not in want and not any(frame_matches(p, w) for w in want):
                          continue
                      p["tryOnUrl"] = prev["url"]; p["tryOnReady"] = True
                      if prev.get("numbers"):
                          p["tryOnNumbers"] = prev["numbers"]
                      for k2, f2 in (("angle", "tryOnAngleUrl"), ("side", "tryOnSideUrl")):
                          if prev.get(k2):
                              p[f2] = prev[k2]
                      # old views may not be clean: the shop shows their photos again
                      # until views:<id> cuts them anew (2026-09-26)
                      p["tryOnViewsV"] = 0; p["tryOnViewsOk"] = {}; p.pop("tryOnAngleRUrl", None)
                      save_product(p)
                      log("    restored %s (%s) -> %s" % (p.get("id"), (p.get("name") or "")[:30], prev["url"]))
                  return 0
              if recut.lower().startswith("test-raw:"):
                  # PROOF TEST: what each AI model itself sees, before any of our own
                  # rim fixing. The same photo goes through the normal BiRefNet (1024 px)
                  # and BiRefNet_HR (2048 px); both raw masks are uploaded as black and
                  # white pictures and compared number by number. Nothing is saved.
                  global _model
                  import cv2
                  pid_ = recut.split(":", 1)[1].strip()
                  pick = next((p for p in products if str(p.get("id")) == pid_), None)
                  cname, cpreset = cloudinary_probe(products)
                  img = Image.open(io.BytesIO(download(front_photo(pick)))).convert("RGB")
                  if max(img.size) > 1600:
                      sc = 1600.0 / max(img.size)
                      img = img.resize((int(img.width * sc), int(img.height * sc)), Image.LANCZOS)
                  masks = {}
                  for name, size in (("ZhengPeng7/BiRefNet", 1024), ("ZhengPeng7/BiRefNet_HR", 2048)):
                      MODEL_NAME[0] = name; MODEL_SIZE[0] = size; _model = None
                      t0 = time.time()
                      mk = coarse_mask(img)
                      masks[name] = mk
                      buf = io.BytesIO()
                      Image.fromarray((mk * 255).round().astype(np.uint8), "L").save(buf, "PNG")
                      u = cloudinary_upload(buf.getvalue(), "test-rawmask-" + name.split("/")[1], cname, cpreset)
                      log("    RAW MASK %s at %d px: %.0f s, frame pixels %d, soft pixels %d -> %s" % (
                          name, size, time.time() - t0, int((mk > 0.5).sum()),
                          int(((mk > 0.05) & (mk < 0.95)).sum()), u))
                  a = masks["ZhengPeng7/BiRefNet"]; b = masks["ZhengPeng7/BiRefNet_HR"]
                  log("    DIFFERENCE: pixels where the two models disagree (one says frame, other says not): %d; "
                      "average difference %.4f" % (int(((a > 0.5) != (b > 0.5)).sum()), float(np.abs(a - b).mean())))
                  return 0
              if recut.lower().startswith("test-hr:"):
                  # A TEST: cut one frame with BiRefNet_HR (MIT licence, free) looking
                  # at the photo at 2048 px. The result is uploaded and its link
                  # printed, but NOTHING is saved to the frame -- the live cut-out
                  # stays as it is. No other frame is touched in a test run.
                  test_mode = "hr"
                  MODEL_NAME[0] = "ZhengPeng7/BiRefNet_HR"
                  MODEL_SIZE[0] = 2048
                  recut = recut.split(":", 1)[1].strip()
                  todo = []
              if recut:
                  # a trial: cut one frame again even though it already has a cut-out
                  if recut.lower() == "first":
                      pick = next((p for p in products if front_photo(p) and not p.get("tryOnLocked") and not p.get("draft")), None)
                  else:
                      pick = next((p for p in products if frame_matches(p, recut)), None)
                  if pick is None:
                      log("Trial re-cut: no frame matched '%s'." % recut)
                  elif pick not in todo:
                      pick["tryOnFails"] = 0
                      todo.insert(0, pick)
                      log("Trial re-cut of %s (%s)." % (pick.get("id"), (pick.get("name") or "")[:40]))
              log("Catalogue: %d frames. Waiting for a cut-out: %d." % (len(products), len(todo)))
              if not todo:
                  views_for_hand_published(products)
                  log("Nothing to do.")
                  return 0

              cname, cpreset = cloudinary_probe(products)
              if not cname:
                  log("::error::STOP: Cloudinary refused every cloud name / preset combination, so nothing "
                      "was cut. The lines above list what was tried and what Cloudinary said. Fix: in "
                      "Cloudinary -> Settings -> Upload, confirm the Unsigned preset name, and put it in the "
                      "CLOUDINARY_PRESET secret exactly.")
                  health({"ok": False, "error": "Cloudinary refused every candidate"})
                  return 1

              done = failed = 0
              rejected = []
              for p in todo[:MAX_FRAMES]:
                  if out_of_time():
                      log("Time is up for this run; the rest go in the next one.")
                      break
                  pid = p.get("id")
                  try:
                      log("--- %s : %s" % (pid, (p.get("name") or "")[:50]))
                      rim_txt = str(p.get("rim") or p.get("rimType") or "").lower()
                      # The new rim method (made for the thin metal frame Lot) is used
                      # ONLY for the frames listed in NEW_METHOD_IDS. Every other frame is
                      # cut with the old method, as Rauf asked (it spoiled Sizzler).
                      rk = rim_kind_of(rim_txt) if str(pid) in NEW_METHOD_IDS else ""
                      # old method: the half-rim hint is read from the rim text, as before
                      old_hint = None if rk else any(k in rim_txt for k in ("half", "supra", "semi", "rimless"))
                      src = front_photo(p)
                      colour_src = None
                      if not PLAIN_PHOTO[0] and not is_metal(p):
                          # normal setting from 2026-09-21: shape from this photo,
                          # colours from the same photo without enhancement
                          colour_src = no_enhancement(src)
                          if colour_src == src:
                              colour_src = None
                      if PLAIN_PHOTO[0] == "colour":
                          colour_src = no_enhancement(src)
                          log("    colour photo (no enhancement): " + colour_src)
                      elif PLAIN_PHOTO[0]:
                          src = no_enhancement(src)
                          log("    plain photo (no enhancement): " + src)
                      # front box first: TEST runs only until Rauf approves it
                      fc = bool(test_mode) and not is_metal(p) and not LENS_TEST[0]
                      lf = LENS_TEST[0] or str(pid) in LENS_FIX_IDS or (LENS_FOR_ALL and lens_ok(p))
                      photo_b = download(src)
                      colour_b = download(colour_src) if colour_src else None
                      metal_test = LENS_TEST[0] and is_metal(p)
                      # a metal frame in a test-lens run: the MAIN result is the one rule
                      # for everyone (VG-1005's way, no thin-metal path)
                      rk_use = "" if metal_test else rk
                      hint_use = any(k in rim_txt for k in ("half", "supra", "semi", "rimless")) if metal_test else old_hint
                      png, nums = cut(photo_b, front=True, rim_kind=rk_use, half_rim_hint=hint_use,
                                      colour_bytes=colour_b, front_crop=fc, lens_fix=lf, size=p.get("size"))
                      # SECOND TRY FOR A THIN METAL RIM (2026-09-23). The thin-metal path
                      # shaved 3 px off the 4 px rim of the "9.9.9" aviator and the rim
                      # check caught it. Rather than lose the frame, cut it once more the
                      # plain way and keep that if it passes. Frames that already cut
                      # well never reach this.
                      if rk_use and nums.get("rimBad"):
                          log("    the thin-metal way damaged the rim -- trying the plain way once")
                          png2, nums2 = cut(photo_b, front=True, rim_kind="", half_rim_hint=hint_use,
                                            colour_bytes=colour_b, front_crop=fc, lens_fix=lf, size=p.get("size"))
                          if not nums2.get("reject"):
                              png, nums = png2, nums2
                              log("    the plain way came out clean -- using that")
                          else:
                              log("    the plain way was no better: " + str(nums2.get("reject"))[:70])
                      if LENS_TEST[0]:
                          png0, _ = cut(photo_b, front=True, rim_kind=rk, half_rim_hint=old_hint,
                                        colour_bytes=colour_b, front_crop=fc, lens_fix=False, size=p.get("size"))
                          if metal_test:
                              pics, names_ = [png0, png], ["today (live)", "one rule (VG-1005 way)"]
                              rk_m = rim_kind_of(rim_txt) or "full"
                              png_m, _ = cut(photo_b, front=True, rim_kind=rk_m, half_rim_hint=None,
                                             colour_bytes=colour_b, front_crop=fc, lens_fix=True, size=p.get("size"))
                              pics.append(png_m); names_.append("thin-metal way + lens step")
                              compare_many(pics, names_, pid, p.get("name"), cname, cpreset)
                          else:
                              lens_compare(png0, png, pid, p.get("name"), cname, cpreset)
                      if test_mode:
                          url = cloudinary_upload(png, "test-%s-%s" % (test_mode, pid), cname, cpreset)
                          if test_mode == "plain":
                              nums.pop("reading", None); warn_ = nums.pop("warning", None)
                              rej_ = nums.pop("reject", None)
                              read_ = nums.pop("reading", None)
                              p["tryOnTest"] = {"url": url, "numbers": nums, "warning": rej_ or warn_,
                                                "at": datetime.datetime.utcnow().isoformat() + "Z"}
                              if read_:
                                  p["tryOnTest"]["reading"] = read_      # applied when the cut is adopted
                              if rej_:
                                  p["tryOnTest"]["reject"] = True
                                  log("    (in a live run this photo would be REJECTED: " + rej_ + ")")
                              if LENS_TEST[0]:
                                  p["tryOnTest"]["lens"] = True
                              save_product(p)
                          log("    TEST RESULT (%s, live cut-out unchanged) -> %s" % (test_mode, url))
                          done += 1
                          continue
                      if nums.get("reject"):
                          why = nums.pop("reject")
                          p["tryOnUrl"] = ""
                          p["tryOnReady"] = False
                          p["tryOnFails"] = MAX_TRIES
                          p["tryOnFail"] = why
                          # FIX IT (2026-09-26): the cut is kept as a draft, with its source
                          # picture, so staff can open it, clean or put back, look once and
                          # publish -- instead of only being able to re-shoot.
                          try:
                              _durl = cloudinary_upload(png, "draft-" + str(pid), cname, cpreset)
                              _surl = cloudinary_upload(LAST_SOURCE[0], "source-" + str(pid), cname, cpreset) if LAST_SOURCE[0] else ""
                              p["tryOnDraft"] = {"url": _durl, "source": _surl, "why": why,
                                                 "at": datetime.datetime.utcnow().isoformat() + "Z"}
                              log("    draft kept for FIX IT: " + _durl)
                          except Exception as _ex:
                              log("    draft could not be kept: %s" % str(_ex)[:70])
                          save_product(p)
                          rejected.append("%s: %s" % (p.get("name") or pid, why))
                          log("::warning::%s REJECTED, kept off the website: %s" % (pid, why))
                          continue
                      url = cloudinary_upload(png, "tryon-" + str(pid), cname, cpreset)
                      try:
                          if LAST_SOURCE[0]:
                              p["tryOnSource"] = cloudinary_upload(LAST_SOURCE[0], "source-" + str(pid), cname, cpreset)
                      except Exception as _ex:
                          log("    source picture could not be kept: %s" % str(_ex)[:60])
                      p.pop("tryOnDraft", None)
                      p["tryOnUrl"] = url
                      p["tryOnReady"] = True
                      # READY TO CHECK (2026-09-27, shop): a fresh cut is not put live by
                      # the robot any more -- a person looks at it in admin and approves it
                      p["awaitingCheck"] = True
                      reading = nums.pop("reading", {}) or {}
                      warning = nums.pop("warning", None)
                      if warning:
                          p["tryOnWarning"] = warning
                          log("    CHECK PHOTO: " + warning)
                      else:
                          p.pop("tryOnWarning", None)
                      p["tryOnNumbers"] = nums
                      p["tryOnCutBy"] = "robot"
                      if reading:
                          filled = apply_reading(p, reading)
                          if filled:
                              log("    read from the photo: " + ", ".join(filled))

                      cut_views(p, cname, cpreset)

                      p.pop("tryOnFail", None)
                      p["tryOnFails"] = 0
                      save_product(p)
                      done += 1
                      log("    done -> %s" % url)
                  except Exception as e:
                      failed += 1
                      import traceback as _tb
                      log("    CRASH DETAIL: " + " | ".join(_tb.format_exc().strip().splitlines()[-8:]))
                      why = plain_reason(e)
                      tries = (p.get("tryOnFails") or 0) + 1
                      p["tryOnFails"] = tries
                      p["tryOnFail"] = why
                      p["tryOnReady"] = False
                      try:
                          save_product(p)
                      except Exception:
                          pass
                      log("::warning::%s FAILED (%d of %d): %s" % (pid, tries, MAX_TRIES, why))
                      if tries >= MAX_TRIES:
                          rejected.append("%s: %s" % (p.get("name") or pid, why))

              if rejected:
                  whatsapp("Vision Gallery - frames rejected\n\n" + "\n".join(rejected[:10]) +
                           "\n\nThese frames are NOT on the website. Please take a proper "
                           "photo again and save it in admin.")

              views_for_hand_published(products)

              # WHY FRAMES WERE HELD BACK (2026-09-23). Counting the causes shows which
              # one to fix next, instead of guessing: "6 held back: 4 cut off, 2 glass".
              if rejected:
                  kinds = {}
                  for r in rejected:
                      low = r.lower()
                      if "sideways" in low:            k = "photo sideways"
                      elif "runs off the edge" in low: k = "frame cut off at the edge"
                      elif "a little closer" in low:   k = "photo taken too far away"
                      elif "arms show above" in low:   k = "arms above the frame"
                      elif "arm shows beside" in low:  k = "arm beside the frame"
                      elif "glass did not clear" in low: k = "glass did not clear"
                      elif "rim came out" in low:      k = "rim damaged"
                      elif "does not match the numbers" in low: k = "size does not match the typed numbers"
                      else:                            k = "other"
                      kinds[k] = kinds.get(k, 0) + 1
                  log("::notice::Why they were held back: " +
                      ", ".join("%d %s" % (v, k) for k, v in sorted(kinds.items(), key=lambda x: -x[1])))
              health({"ok": True, "cut": done, "failed": failed,
                      "rejectedNow": len(rejected),
                      "waiting": max(0, len(todo) - done)})
              log("::notice::Finished. Cut %d, failed %d, rejected %d, still waiting %d.%s"
                  % (done, failed, len(rejected), max(0, len(todo) - done),
                     ("  Rejected: " + "; ".join(rejected[:5])) if rejected else ""))
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          cat > vg_requirements.txt <<'PYEOF'
          torch==2.4.1
          torchvision==0.19.1
          transformers==4.44.2
          timm==1.0.9
          einops==0.8.0
          kornia==0.7.3
          pillow==10.4.0
          numpy==1.26.4
          scipy==1.14.1
          pymatting==1.1.12
          opencv-python-headless==4.10.0.84
          scikit-image==0.24.0
          requests==2.32.3
          git+https://github.com/ChaoningZhang/MobileSAM.git
          PYEOF
          echo "robot unpacked: $(wc -l < vg_look.py) + $(wc -l < vg_cut.py) lines"

      - name: Is anything waiting?
        id: look
        env:
          SUPABASE_URL: https://oscpunukbyosckrmopeh.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RECUT: ${{ github.event.inputs.recut }}
        run: |
          set +e
          echo "Robot build 2026-10-01j (as 01i, plus the sheet-ring peel judges against the LOCAL wall colour in lens mode, so it no longer erases a clear lower rim; codes in the run box; 45-degree fit points; CHECK PHOTO)" > look.txt
          python vg_look.py >> look.txt 2>&1
          code=$?
          cat look.txt
          { echo "### What the robot found"; echo '```'; cat look.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Install the cutter
        if: steps.look.outputs.waiting != '0'
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r vg_requirements.txt

      - name: Keep the model between runs
        if: steps.look.outputs.waiting != '0'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/mobile_sam.pt
          key: birefnet-cache-v2

      - name: Cut whatever is waiting
        if: steps.look.outputs.waiting != '0'
        env:
          SUPABASE_URL: https://oscpunukbyosckrmopeh.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
          CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_PRESET }}
          ALERT_NUMBERS: ${{ secrets.ALERT_NUMBERS }}
          RECUT: ${{ github.event.inputs.recut }}
        run: |
          set +e
          python vg_cut.py > cut.txt 2>&1
          code=$?
          cat cut.txt
          { echo "### What the robot did"; echo '```'; sed -E "s/^::(warning|notice|error)::/  /" cut.txt | tail -n 80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Write the robot's report into the repo
        if: always()
        run: |
          {
            echo "Run $GITHUB_RUN_NUMBER  $(date -u)"
            echo "Trigger: $GITHUB_EVENT_NAME"
            echo
            echo "--- what the robot found ---"
            cat look.txt 2>/dev/null || echo "(the look did not run)"
            echo
            echo "--- what the robot did ---"
            { sed -E 's/^::(warning|notice|error)::/  /' cut.txt 2>/dev/null | tail -n 80; } || echo "(the cutter did not run)"
          } > robot-log.txt
          if [ -s cut.txt ]; then
            { echo "Run $GITHUB_RUN_NUMBER  $(date -u)"; echo; sed -E 's/^::(warning|notice|error)::/  /' cut.txt | tail -n 120; } > last-cut.txt
          fi
          rm -f vg_look.py vg_cut.py vg_requirements.txt look.txt cut.txt
          git config user.name  "vg-cutter"
          git config user.email "vg-cutter@users.noreply.github.com"
          git add robot-log.txt
          git add last-cut.txt 2>/dev/null || true
          git commit -m "robot log, run $GITHUB_RUN_NUMBER" || exit 0
          git pull --rebase --quiet || true
          git push || true
