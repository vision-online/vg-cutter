              keep_end = ndimage.binary_dilation(keep_end, iterations=1) & (alpha > 0) & ends

              front = lens | rim_band | bridge | keep_end
              put_back = 0
              n_moved = 0
              n_outline = 0
              gaps_dbg = []
              thick_dbg = []
              if dark_frame:
                  dist_in = ndimage.distance_transform_edt(lens)
                  # the nose-pad corner: the pads sit on the nasal side of each lens,
                  # from about the lens middle down to a third of the way below it
                  pads = np.zeros_like(solid)
                  px0 = int(lx1 - 0.22 * (lx1 - lx0)); px1 = int(rx0 + 0.22 * (rx1 - rx0))
                  pads[int(max(0, midy - 0.05 * lens_h)):int(min(H, midy + 0.30 * lens_h)),
                       max(0, px0):min(W, px1 + 1)] = True
                  D = lum < 0.65 * bg_l
                  # a thin highlight line ON the metal must not split the rim: close
                  # gaps up to 4 px, never across anything as bright as the sheet
                  _k = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (5, 5))
                  D = D | ((cv2.morphologyEx(D.astype(np.uint8), cv2.MORPH_CLOSE, _k) > 0) &
                           (lum < max(0.90 * bg_l, 190.0)))
                  # THE RIM, TRACED RAY BY RAY. From each lens centre, 2400 rays go
                  # out. Around the point where a ray leaves the traced opening, the
                  # FIRST dark run met coming from the glass is the rim -- wherever it
                  # sits, inside or outside the traced outline, in every direction
                  # separately. The run is taken for at most 1.4x the rim's measured
                  # thickness: the rim's reflection on the sheet below the bottom rim
                  # (it touches the rim at the lowest point) is never taken. What
                  # else lies in that window -- the white glass edge, the pale band,
                  # the reflection, arm tips on the rim -- is not frame.
                  win = 2.0 * rim_t + 8.0
                  cap = 1.4 * rim_t + 1.0
                  rim_m = np.zeros_like(solid)
                  gov = np.zeros_like(solid)
                  step = 0.5
                  minlen = max(2, int(0.3 * rim_t / step))
                  def _dark_runs(dk):
                      # dark runs along a ray, gaps of up to 2 samples bridged
                      runs_r = []; j = 0; n = dk.size
                      while j < n:
                          if not dk[j]:
                              j += 1; continue
                          st = j; last = j; gap = 0; j += 1
                          while j < n:
                              if dk[j]:
                                  last = j; gap = 0
                              else:
                                  gap += 1
                                  if gap > 2:
                                      break
                              j += 1
                          runs_r.append((st, last))
                      return runs_r
                  for r in (L, R):
                      ys, xs = np.where(r)
                      cy, cx = ys.mean(), xs.mean()
                      tmax = float(np.hypot(H, W))
                      ts = np.arange(0.0, tmax, step)
                      NA = 2400
                      angs = np.linspace(0, 2 * np.pi, NA, endpoint=False)
                      rays = [None] * NA
                      first = np.full(NA, np.nan)
                      # pass 1: every ray, every dark run in its window
                      for k, ang in enumerate(angs):
                          yy = np.rint(cy + np.sin(ang) * ts).astype(int)
                          xx = np.rint(cx + np.cos(ang) * ts).astype(int)
                          ok = (yy >= 0) & (yy < H) & (xx >= 0) & (xx < W)
                          if not ok.all():
                              n_ok = int(np.argmin(ok))
                              yy = yy[:n_ok]; xx = xx[:n_ok]
                          if yy.size < 4:
                              continue
                          leave = np.where(~r[yy, xx])[0]
                          if leave.size == 0:
                              continue
                          i0 = int(leave[0])
                          padray = bool(pads[yy[i0], xx[i0]])
                          # in the nose-pad corner only look from near the outline
                          # outward, so the pads (further in) are never touched
                          back = (max(0.0, -r_in) + 3.0) if padray else win
                          a0 = max(0, i0 - int(back / step)); a1 = min(yy.size, i0 + int(win / step))
                          wy = yy[a0:a1]; wx = xx[a0:a1]
                          runs_r = _dark_runs(D[wy, wx])
                          rays[k] = (a0, wy, wx, runs_r, yy, xx, i0, padray)
                          longr = [rr for rr in runs_r if rr[1] - rr[0] + 1 >= minlen]
                          if longr:
                              first[k] = (a0 + longr[0][0]) * step
                      # the rim's path round the lens: for each ray, the median of the
                      # first proper dark run over the rays within 22 degrees either
                      # side. An arm tip seen through the glass, or the reflection
                      # under the bottom rim, covers only a few of those rays and
                      # cannot pull the path off the rim.
                      half = int(NA * 22 / 360)
                      ext_f = np.concatenate([first[-half:], first, first[:half]])
                      prof = np.full(NA, np.nan)
                      for k in range(NA):
                          wv = ext_f[k:k + 2 * half + 1]
                          wv = wv[~np.isnan(wv)]
                          if wv.size:
                              prof[k] = np.median(wv)
                      # pass 2: on each ray the rim is the dark run that lies on that path
                      picked = [None] * NA
                      sep = np.zeros(NA, bool)
                      miss = np.zeros(NA, bool); dbg_i0 = np.full(NA, np.nan); dbg_near = np.full(NA, np.nan)
                      for k in range(NA):
                          if rays[k] is None:
                              miss[k] = True
                              continue
                          a0, wy, wx, runs_r, yy, xx, i0, padray = rays[k]
                          dbg_i0[k] = i0 * step
                          miss[k] = True
                          tol = max(6.0, 0.8 * rim_t) / step
                          if not padray and not np.isnan(prof[k]):
                              c = int(round(prof[k] / step))
                              if abs(c - i0) > tol:
                                  # the traced opening leaks out through a break in
                                  # the rim here (or stops short of it), so the ray
                                  # "leaves" the lens far from the rim. Look around
                                  # the rim's path instead of around that point.
                                  a0 = max(0, c - int(win / step))
                                  a1 = min(yy.size, c + int(win / step))
                                  if a1 - a0 < 4:
                                      continue
                                  wy = yy[a0:a1]; wx = xx[a0:a1]
                                  runs_r = _dark_runs(D[wy, wx])
                                  n_moved += 1
                          gov[wy, wx] = True
                          if not runs_r or np.isnan(prof[k]):
                              continue
                          pk = prof[k] / step - a0          # the path, in this window's samples
                          dbg_near[k] = (a0 + min(runs_r, key=lambda rr: abs(rr[0] - pk))[0]) * step
                          def _dist(rr):
                              # 0 when the run covers the path point (an arm tip seen
                              # through the glass can join the rim from the inside:
                              # the run then starts early but still covers the rim)
                              if rr[0] - tol <= pk <= rr[1]:
                                  return 0.0 if rr[0] <= pk else pk - rr[0] if False else abs(rr[0] - pk)
                              return abs(rr[0] - pk)
                          good = [rr for rr in runs_r if rr[1] - rr[0] + 1 >= minlen] or runs_r
                          cover = [rr for rr in good if rr[0] <= pk + tol and rr[1] >= pk]
                          thick = lambda rr: (rr[1] - rr[0] + 1) * step >= 0.6 * rim_t
                          pi = i0 - a0
                          # a rim-thick run where the ray leaves the traced opening
                          at_out = [] if padray else \
                              [rr for rr in good if abs(rr[0] - pi) <= tol and thick(rr)]
                          cover_t = [rr for rr in cover if thick(rr)]
                          if cover_t:
                              st, last = min(cover_t, key=_dist)
                              st = max(st, int(pk - 2.0 / step))    # the rim starts at the path, not earlier
                          elif at_out:
                              # the path was pulled off the rim by something thin and
                              # dark inside the glass (a price tag's printed line, seen
                              # on Lot): the rim is the rim-thick run at the outline
                              st, last = min(at_out, key=lambda rr: abs(rr[0] - pi))
                              n_outline += 1
                          elif cover:
                              st, last = min(cover, key=_dist)
                              st = max(st, int(pk - 2.0 / step))
                          else:
                              st, last = min(good, key=lambda rr: abs(rr[0] - pk))
                              if abs(st - pk) > tol:
                                  continue            # nothing on the path here: leave it
                          picked[k] = (wy, wx, st, last)
                          # the rim ends cleanly here when another dark run (the rim's
                          # reflection on the sheet, an arm) starts just past it
                          nxt = [rr for rr in runs_r if rr[0] > last + 2 and rr[0] - last <= int(10.0 / step)]
                          sep[k] = bool(nxt) and (last - st + 1) <= int(cap / step)
                          miss[k] = False
                      # how thick the rim is along each ray: the run is cut to what the
                      # rim measures around it (30th percentile of the runs within 40
                      # degrees, +20%), so where the rim's reflection on the sheet joins
                      # it under the bottom rim (on Lot over some 40 degrees) the
                      # reflection is not taken. Never below the rim's own thickness
                      # there; never above the old 1.4x cap.
                      runlen = np.array([np.nan if q is None else float(q[3] - q[2] + 1) for q in picked])
                      hw = int(NA * 40 / 360)
                      ext_l = np.concatenate([runlen[-hw:], runlen, runlen[:hw]])
                      sep_idx = np.where(sep & ~np.isnan(runlen))[0]
                      for k in range(NA):
                          q = picked[k]
                          if q is None:
                              continue
                          wy, wx, st, last = q
                          wv = ext_l[k:k + 2 * hw + 1]; wv = wv[~np.isnan(wv)]
                          capk = int(cap / step)
                          if wv.size >= 8:
                              capk = min(capk, max(minlen, int(1.2 * np.percentile(wv, 30) + 2.0 / step)))
                          # where the reflection is seen apart from the rim nearby, the
                          # rim's true thickness there is known: the joined rays take
                          # that (+20%), not rim plus reflection
                          if not sep[k] and sep_idx.size >= 2:
                              # between two stretches where the rim is seen apart from
                              # its reflection (at most 70 degrees apart), the rim's
                              # thickness runs smoothly from one to the other; a ray there
                              # that is thicker than that has the reflection joined on
                              j = np.searchsorted(sep_idx, k)
                              kp = sep_idx[j - 1] if j > 0 else sep_idx[-1] - NA
                              kn = sep_idx[j] if j < sep_idx.size else sep_idx[0] + NA
                              if kn - kp <= int(NA * 70 / 360):
                                  # each side's thickness from the ten rays nearest it
                                  # (the very last one before the joint is often thicker)
                                  sp = sep_idx[max(0, j - 10):j] if j > 0 else sep_idx[-10:]
                                  sn = sep_idx[j:j + 10] if j < sep_idx.size else sep_idx[:10]
                                  lp = float(np.median(runlen[sp])); ln_ = float(np.median(runlen[sn]))
                                  li = lp + (ln_ - lp) * (k - kp) / float(max(1, kn - kp))
                                  if runlen[k] > li + 2.0 / step:
                                      capk = min(capk, max(minlen, int(round(li + 1.0 / step))))
                          last = min(last, st + capk)
                          rim_m[wy[st:last + 1], wx[st:last + 1]] = True
                          if k % 20 == 0 and 40 <= k * 360.0 / NA <= 140:
                              thick_dbg.append("%s%d:%s%d>%d" % ("L" if r is L else "R", int(k * 360.0 / NA),
                                                                 "s" if sep[k] else "-", int(runlen[k]), last - st + 1))
                      # which directions got no rim (5-degree bins, >30% of rays empty)
                      for b in range(72):
                          sl = slice(b * NA // 72, (b + 1) * NA // 72)
                          if miss[sl].mean() > 0.3:
                              def _m(v):
                                  v = v[sl]; v = v[~np.isnan(v)]
                                  return round(float(np.median(v)), 1) if v.size else None
                              gaps_dbg.append(("R" if r is R else "L", b * 5, round(float(miss[sl].mean()), 2),
                                               _m(dbg_i0), _m(first), _m(prof), _m(dbg_near)))
                  rim_m = cv2.morphologyEx(rim_m.astype(np.uint8), cv2.MORPH_CLOSE,
                                           np.ones((3, 3), np.uint8)) > 0
                  # a few neighbouring rays can still miss the rim (on Lot: where a
                  # price tag hangs behind it), leaving a 1-3 px slit across the rim.
                  # A wider closing bridges such slits -- dark metal pixels only.
                  _k7 = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (7, 7))
                  rim_m = rim_m | ((cv2.morphologyEx(rim_m.astype(np.uint8), cv2.MORPH_CLOSE, _k7) > 0) & D)
                  gov = cv2.morphologyEx(gov.astype(np.uint8), cv2.MORPH_CLOSE,
                                         np.ones((3, 3), np.uint8)) > 0
                  soft = np.clip((bg_l - lum) / max(1.0, bg_l - frame_l), 0.0, 1.0)
                  edge = ndimage.binary_dilation(rim_m, iterations=1) & ~rim_m & gov
                  rimA = np.where(rim_m, 1.0, np.where(edge, soft, 0.0)).astype(np.float32)
                  sel = gov & ~bridge & ~keep_end
                  front = front | gov
                  out = np.where(front, alpha, 0.0).astype(np.float32)
                  put_back = int((rim_m & sel & (out < 0.5)).sum())
                  out = np.where(sel, rimA, out).astype(np.float32)
                  # the pad corner keeps what the model cut, plus dark rim metal
                  pc = pads & rim_band & D
                  out = np.maximum(out, pc.astype(np.float32))
              else:
                  out = np.where(front, alpha, 0.0).astype(np.float32)
              if dark_frame:
                  # the glass edge: where the lens meets the rim the glass catches
                  # the light and the photo shows a white line hugging the rim's
                  # inside (measured on Lot: 3-5 px at lum 250-255, fully opaque).
                  # On a face it reads as a broken, patchy rim. It is glass, not
                  # metal: flooded away from the clear opening through pale pixels
                  # only, so it stops at the dark metal -- a highlight lying ON the
                  # metal, with dark on both sides, is never reached. The nose-pad
                  # corner is left alone (clear silicone pads are pale too).
                  near_edge = (lens & (dist_in <= in_lim + 8)) | rim_band
                  # "pale" here means as bright as the sheet or brighter: the glass
                  # edge measured 250-255 on Lot. The metal's own highlight (the top
                  # of the wire catching light, 100-180) is NOT pale by this test --
                  # an earlier, looser test flooded it and cut slits into the rim.
                  pale_t = max(0.90 * bg_l, 190.0)
                  pale = (lum >= pale_t) & near_edge & ~pads & (out > 0.02)
                  seed = ndimage.binary_dilation(out <= 0.02, iterations=1) & pale
                  glass_edge = ndimage.binary_propagation(seed, mask=pale)
                  out[glass_edge] = 0.0
                  info_glass = int(glass_edge.sum())
                  # a rim is solid across its width: any slit or pinhole inside the
                  # rim zone narrower than 5 px, between rim on both sides and not
                  # as bright as the sheet, is filled. Closing only ADDS pixels.
                  zone = (lens & (dist_in <= in_lim + 2)) | ((dist_out > 0) & (dist_out <= out_lim))
                  s_now = (out > 0.5).astype(np.uint8)
                  k5 = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (5, 5))
                  closed = cv2.morphologyEx(s_now, cv2.MORPH_CLOSE, k5) > 0
                  add = closed & (s_now == 0) & zone & (lum < pale_t) & ~glass_edge & \
                        (ndimage.binary_dilation(rim_m, iterations=2) | pads)
                  out[add] = 1.0
                  info_glass = (info_glass, int(add.sum()))
              else:
                  info_glass = 0
              # stray specks left inside the openings or under the rim (a tag's
              # printed line, bits of the reflection): anything solid that is not
              # joined to the frame and smaller than a rim-sized square goes.
              n_lab, lab, st_cc, _ = cv2.connectedComponentsWithStats((out > 0.5).astype(np.uint8), 8)
              specks = 0
              if n_lab > 2:
                  big = int(np.argmax(st_cc[1:, cv2.CC_STAT_AREA])) + 1
                  lim = max(40.0, rim_t * rim_t)
                  small = np.zeros_like(solid)
                  for i in range(1, n_lab):
                      if i != big and st_cc[i, cv2.CC_STAT_AREA] < lim:
                          small |= lab == i
                          specks += 1
                  if specks:
                      keep = (lab > 0) & ~small
                      halo = ndimage.binary_dilation(small, iterations=2) & ~keep
                      halo &= ~ndimage.binary_dilation(keep & (out > 0.5), iterations=1)
                      out[small | halo] = 0.0
              # debug: a column through each lens's lowest point, bottom rim area
              dbg_cols = []
              try:
                  for r in (L, R):
                      ys, xs = np.where(r)
                      # the columns where the solid run just under the opening is longest
                      cand = []
                      _w = int(xs.max() - xs.min())
                      for xq in range(int(xs.min() + 0.2 * _w), int(xs.max() - 0.2 * _w), 3):
                          cy_ = ys[xs == xq]
                          if cy_.size == 0 or cy_.max() < ys.mean():
                              continue
                          yb = int(cy_.max())
                          colo = out[yb:min(H, yb + 60), xq] > 0.5
                          nz = np.where(colo)[0]
                          if nz.size == 0:
                              continue
                          run = 0
                          for v in colo[nz[0]:]:
                              if not v:
                                  break
                              run += 1
                          cand.append((run, xq, yb))
                      cand.sort(reverse=True)
                      for run, xq, yb in cand[:2]:
                          col = []
                          for yq in range(max(0, yb - 22), min(H, yb + 30)):
                              lv = lum[yq, xq]
                              c1 = "#" if lv < 90 else ("+" if lv < 150 else ("-" if lv < 200 else "W"))
                              c2 = "A" if alpha[yq, xq] > 0.5 else "."
                              c3 = "R" if (dark_frame and rim_m[yq, xq]) else "."
                              c4 = "G" if (dark_frame and gov[yq, xq]) else "."
                              c5 = "L" if r[yq, xq] else "."
                              c6 = "O" if out[yq, xq] > 0.5 else "."
                              col.append(c1 + c2 + c3 + c4 + c5 + c6)
                          dbg_cols.append("x%d yb%d run%d: %s" % (xq, yb, run, " ".join(col)))
              except Exception as e:
                  dbg_cols.append("dbg err %s" % e)
              info = {"rimT": round(rim_t, 1), "rimOff": round(rim_off, 1), "rimIn": round(r_in, 1), "rimOut": round(r_out, 1), "bgL": round(bg_l), "frameL": round(frame_l),
                      "darkFrame": bool(dark_frame), "rimPutBack": put_back, "raysMoved": n_moved, "byOutline": n_outline, "specks": specks, "noRim": gaps_dbg[:14], "glassEdge": info_glass,
                      "removed": int((solid & ~front).sum())}
              return out, info


          def lens_measurements(alpha, regions, half_rim=True):
              """The numbers the try-on uses, from traced lens regions."""
              ys, xs = np.where(alpha > 0.2)
              if not xs.size:
                  return {}
              front_w = int(xs.max() - xs.min() + 1)
              front_h = int(ys.max() - ys.min() + 1)
              out = {"frontWidthPx": front_w, "frontHeightPx": front_h, "halfRim": bool(half_rim)}
              eyes = []
              boxes = []
              for r in regions:
                  yy, xx = np.where(r)
                  boxes.append((int(xx.min()), int(xx.max()), int(yy.min()), int(yy.max())))
              for (x0, x1, y0, y1) in boxes:
                  eyes.append({"centreX": float((x0 + x1) / 2.0), "centreY": float((y0 + y1) / 2.0),
                               "widthPx": int(x1 - x0 + 1), "heightPx": int(y1 - y0 + 1),
                               "centreXFrac": float(((x0 + x1) / 2.0 - xs.min()) / front_w)})
              out["lenses"] = eyes
              if len(boxes) == 2:
                  out["bridgePx"] = int(boxes[1][0] - boxes[0][1])
                  out["pupilGapPx"] = float(eyes[1]["centreX"] - eyes[0]["centreX"])
              return out


          def _close_ring_trace(a, colour_rgb, min_alpha=0.42):
              """
              CLOSE THE RING (2026-09-30, Rauf's Ocelot frame): a full-rim frame has a
              closed rim around each lens by definition. When the cut lost part of it
              (a clear or gradient lower rim looks like background to the matte, and
              the glass step then eats it), find where the rim breaks off, trace the
              missing rim in the ORIGINAL photo along its faint edges, and bring that
              band back from the real pixels -- see-through where the rim is clear,
              never painted solid. Returns (new alpha, list of notes); the alpha is
              returned unchanged when nothing sensible can be done. Also returns the
              rebuilt band as a mask, so the rim check can count it as rim even where
              the rim is clear (light on screen, solid for the check).
              """
              notes = []
              import cv2
              try:
                  from skimage.morphology import skeletonize
                  from skimage.graph import route_through_array
                  from scipy.signal import savgol_filter
              except Exception as ex:
                  return a, ["ring: library missing (%s)" % str(ex)[:40]], None
              H, W = a.shape
              rim0 = (a > 0.5).astype(np.uint8)
              n, lab, stats, _ = cv2.connectedComponentsWithStats(rim0)
              if n < 2:
                  return a, ["ring: no rim"], None
              big = 1 + int(np.argmax(stats[1:, cv2.CC_STAT_AREA]))
              rim = (lab == big)
              ys, xs = np.where(rim)
              if ys.size < 500:
                  return a, ["ring: rim too small"], None
              fw = float(xs.max() - xs.min() + 1); fh = float(ys.max() - ys.min() + 1); cx = (xs.min() + xs.max()) / 2.0
              # work only on the frame's area (plus a margin): much faster on a big photo
              my = int(0.35 * fh) + 10; mx = 20
              Y0, Y1 = max(0, int(ys.min()) - 10), min(H, int(ys.max()) + my)
              X0, X1 = max(0, int(xs.min()) - mx), min(W, int(xs.max()) + mx)
              R_ = rim[Y0:Y1, X0:X1]; h_, w_ = R_.shape
              from scipy import ndimage as _ndi
              mid_c = cx - X0                                   # the middle of the frame, in the crop
              def lens_holes_of(mask):
                  outside = _ndi.binary_propagation(_border(~mask), mask=~mask)
                  holes = ~mask & ~outside
                  lab_h, nh = _ndi.label(holes)
                  out_ = np.zeros_like(holes)
                  if nh == 0:
                      return out_
                  sz = _ndi.sum(holes, lab_h, range(1, nh + 1))
                  for i, v in enumerate(sz):
                      if v >= 0.04 * fw * fh:
                          out_ |= (lab_h == i + 1)
                  return out_
              def enclosed_lenses(mask, with_area=False):
                  hs = lens_holes_of(mask)
                  _l, n_ = _ndi.label(hs)
                  return (n_, float(hs.sum())) if with_area else n_
              # the rim's thickness where it is intact
              dt = cv2.distanceTransform(R_.astype(np.uint8), cv2.DIST_L2, 5)
              RW = float(np.clip(2 * np.percentile(dt[dt > 0], 92) if (dt > 0).any() else 12.0, 6, 40))
              # REAL RIM ENDS, NOT SPURS (1 Oct): trim the skeleton's short side-branches
              # (shorter than 1.5 rim widths), then the remaining ends are where the rim
              # really stops. They sit a little back along the rim; the trace below
              # starts there and follows the rim out into the gap.
              sk = skeletonize(R_).astype(np.uint8)
              k = np.array([[1, 1, 1], [1, 10, 1], [1, 1, 1]])
              N = int(1.5 * RW)
              # branches leaving each skeleton point: count 0->1 changes around its 8
              # neighbours (a staircase corner has 2 like any line point; an end 1; a
              # real fork 3 or more)
              pad = np.pad(sk, 1)
              ring = [pad[0:-2, 1:-1], pad[0:-2, 2:], pad[1:-1, 2:], pad[2:, 2:], pad[2:, 1:-1], pad[2:, 0:-2], pad[1:-1, 0:-2], pad[0:-2, 0:-2]]
              trans = np.zeros(sk.shape, np.int32)
              for i in range(8):
                  trans += ((ring[i] == 0) & (ring[(i + 1) % 8] == 1)).astype(np.int32)
              nbr = np.where(sk > 0, trans, 0)
              nbr = np.where((sk > 0) & (cv2.filter2D(sk, -1, k) == 11), 1, nbr)   # a single neighbour is always an end
              # the cut end of a thick rim thins into a little "V" of two prongs: points
              # closer together than 1.5 rim widths are one end (the middle of the V)
              raw = [(int(p[0]), int(p[1])) for p in np.argwhere(nbr == 1)]
              ends = []
              used = [False] * len(raw)
              for i in range(len(raw)):
                  if used[i]:
                      continue
                  grp = [raw[i]]; used[i] = True
                  for j in range(i + 1, len(raw)):
                      if not used[j] and np.hypot(raw[i][0] - raw[j][0], raw[i][1] - raw[j][1]) <= N:
                          grp.append(raw[j]); used[j] = True
                  gy = int(round(np.mean([q[0] for q in grp]))); gx = int(round(np.mean([q[1] for q in grp])))
                  # keep the point ON the rim (the middle of a V can fall just outside it)
                  if not R_[gy, gx]:
                      gy, gx = min(grp, key=lambda q: (q[0] - gy) ** 2 + (q[1] - gx) ** 2)
                  ends.append((gy, gx))
              if len(ends) < 2:
                  return a, ["ring: no break-off points"], None
              # WHICH GAPS TO CLOSE (1 Oct, after VG-1007): not "is the gap long enough"
              # but "does joining these two rim ends turn a lens back into a closed ring".
              src = colour_rgb[Y0:Y1, X0:X1].astype(np.float32)
              g = cv2.cvtColor(colour_rgb[Y0:Y1, X0:X1], cv2.COLOR_RGB2GRAY).astype(np.float32)
              labimg = cv2.cvtColor(colour_rgb[Y0:Y1, X0:X1], cv2.COLOR_RGB2LAB).astype(np.float32)
              def grad(ch):
                  return np.hypot(cv2.Sobel(ch, cv2.CV_32F, 1, 0, ksize=3), cv2.Sobel(ch, cv2.CV_32F, 0, 1, ksize=3))
              E = np.maximum(grad(g), 0.6 * np.maximum(grad(labimg[:, :, 1]), grad(labimg[:, :, 2])))
              E = cv2.GaussianBlur(E, (0, 0), 1.0)
              E = np.clip(E / max(1e-6, np.percentile(E, 99.5)), 0, 1)
              band_c = np.zeros((h_, w_), np.uint8)
              work = R_.copy()
              base_n = enclosed_lenses(work)
              closed = 0
              def piece_from(P, RWp):
                  dd = np.r_[0, np.cumsum(np.hypot(np.diff(P[:, 0]), np.diff(P[:, 1])))]
                  tt = np.linspace(0, dd[-1], max(8, int(dd[-1])))
                  yy = np.interp(tt, dd, P[:, 0]); xx = np.interp(tt, dd, P[:, 1])
                  win = min(31, (len(tt) // 2) * 2 - 1)
                  if win >= 5:
                      yy2 = savgol_filter(yy, win, 2); xx2 = savgol_filter(xx, win, 2)
                      yy2[0], xx2[0], yy2[-1], xx2[-1] = yy[0], xx[0], yy[-1], xx[-1]; yy, xx = yy2, xx2
                  Pi = np.round(np.c_[yy, xx]).astype(np.int32)
                  line = np.zeros((h_, w_), np.uint8)
                  for i in range(len(Pi) - 1):
                      cv2.line(line, (int(Pi[i, 1]), int(Pi[i, 0])), (int(Pi[i + 1, 1]), int(Pi[i + 1, 0])), 255, 1)
                  se = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (int(RWp) | 1, int(RWp) | 1))
                  return cv2.dilate(line, se) > 0, float(dd[-1])
              for _round in range(4):
                  if base_n >= 2:
                      break
                  pairs = []
                  for i in range(len(ends)):
                      for j in range(i + 1, len(ends)):
                          d = float(np.hypot(ends[i][0] - ends[j][0], ends[i][1] - ends[j][1]))
                          if 4 <= d <= 0.7 * fw:
                              pairs.append((d, ends[i], ends[j]))
                  pairs.sort(key=lambda z: z[0])
                  # THE WHOLE LENS, NOT A SLICE (1 Oct): of all joins that close something,
                  # take the one that encloses the LARGEST opening (a line cut across the
                  # glass only encloses a slice of it); among near-equal ones, the shortest
                  before_h = lens_holes_of(work)
                  cands = []
                  for d, p, q in pairs[:200]:
                      test = work.astype(np.uint8).copy()
                      cv2.line(test, (p[1], p[0]), (q[1], q[0]), 1, 3)
                      after_h = lens_holes_of(test > 0)
                      new_ = after_h & ~before_h
                      if not new_.any():
                          continue
                      nx = np.where(new_.any(axis=0))[0]
                      # a lens lies on ONE side of the bridge: anything crossing the middle is not a lens
                      if nx.min() < mid_c - 0.03 * fw and nx.max() > mid_c + 0.03 * fw:
                          continue
                      cands.append((float(new_.sum()), d, p, q))
                  if not cands:
                      break
                  best_area = max(c_[0] for c_ in cands)
                  found = min([c_ for c_ in cands if c_[0] >= 0.95 * best_area], key=lambda c_: c_[1])
                  _gain, d, (y0, x0), (y1, x1) = found
                  # rim thickness measured next to THIS gap, not over the whole frame
                  loc = []
                  for (ey, ex) in ((y0, x0), (y1, x1)):
                      win_ = dt[max(0, ey - 3 * N):ey + 3 * N + 1, max(0, ex - 3 * N):ex + 3 * N + 1]
                      skw = sk[max(0, ey - 3 * N):ey + 3 * N + 1, max(0, ex - 3 * N):ex + 3 * N + 1] > 0
                      if (skw & (win_ > 0)).any():
                          loc.append(2 * float(np.median(win_[skw & (win_ > 0)])))
                  RWg = float(np.clip(np.median(loc) if loc else RW, 6, 40))
                  side = "left" if (x0 + x1) / 2.0 + X0 < cx else "right"
                  # trace along the photo's faint rim; the rim itself is cheap near the two
                  # ends (the trace starts inside it) and forbidden elsewhere
                  m = int(max(20, 0.6 * d))
                  # follow the MIDDLE of the rim: a clear rim shows two edge lines, and a
                  # blur about a third of the rim's width puts the strongest response
                  # between them
                  Ec = cv2.GaussianBlur(E, (0, 0), max(1.0, RWg / 3.0))
                  Ec = np.clip(Ec / max(1e-6, np.percentile(Ec, 99.5)), 0, 1)
                  cost = 1.0 / (0.03 + Ec)
                  near = np.zeros((h_, w_), np.uint8)
                  cv2.circle(near, (x0, y0), N + int(RW), 1, -1); cv2.circle(near, (x1, y1), N + int(RW), 1, -1)
                  cost[work & (near == 0)] = 1e6
                  cost[:max(0, min(y0, y1) - m), :] = 1e6; cost[min(h_, max(y0, y1) + m + int(0.2 * fh)):, :] = 1e6
                  cost[:, :max(0, min(x0, x1) - m)] = 1e6; cost[:, min(w_, max(x0, x1) + m):] = 1e6
                  attempt = []
                  try:
                      path, _c = route_through_array(cost, (y0, x0), (y1, x1), fully_connected=True, geometric=True)
                      P = np.asarray(path, dtype=np.float64)
                      arc = float(np.sum(np.hypot(np.diff(P[:, 0]), np.diff(P[:, 1]))))
                      if arc <= 2.2 * d + 40:
                          attempt.append(("traced", P))
                  except Exception:
                      pass
                  if d <= 4 * RWg:
                      # a straight join only for a SHORT gap; a long one must follow the real rim
                      n_ = max(3, int(d)); attempt.append(("straight", np.c_[np.linspace(y0, y1, n_), np.linspace(x0, x1, n_)]))
                  done = False
                  for how, P in attempt:
                      piece, length = piece_from(P, RWg)
                      trial = work | piece
                      new_n = enclosed_lenses(trial)
                      if new_n > base_n:
                          work = trial; band_c |= piece; base_n = new_n; closed += 1; done = True
                          notes.append("ring: %s lens -- closed, %d px of rim brought back (%s, rim %.0f px thick)" % (side, int(length), how, RWg))
                          break
                  if not done:
                      notes.append("ring: %s lens -- the rim could not be followed in the photo, left for FIX (RIM BACK)" % side); break
              if closed == 0 and not notes:
                  notes.append("ring: no gap found whose closing makes a lens a closed ring")
              band = np.zeros((H, W), np.uint8); band[Y0:Y1, X0:X1] = band_c
              band = band > 0
              if not band.any():
                  return a, notes, None
              full = colour_rgb.astype(np.float32)
              free = (~band) & (~rim)
              den = cv2.blur(free.astype(np.float32), (41, 41))[:, :, None] + 1e-6
              bg = cv2.blur(full * free[:, :, None], (41, 41)) / den
              diff = np.abs(full - bg).max(2)
              a_band = np.maximum(min_alpha, np.clip((diff - 8) / (34 - 8), 0, 1))
              soft = cv2.GaussianBlur(band.astype(np.float32), (0, 0), 1.2)
              ring_a = np.where(band, a_band, 0) * np.clip(soft * 1.6, 0, 1)
              return np.maximum(a, ring_a.astype(a.dtype)), notes, band

          def frame_matches(p, want):
              """FRAME CODES IN THE RUN BOX (1 Oct): admin keeps a frame's code at the
              start of its NAME ("VG-1007 Frames"), not in a field of its own, so the
              box accepts the code, the full name, the id or the sku, any case."""
              w = str(want or "").strip().lower()
              if not w:
                  return False
              name = str(p.get("name") or "").strip().lower()
              code = name.split()[0] if name else ""
              return w in (str(p.get("id") or "").lower(), str(p.get("sku") or "").lower(), name, code)

          def angle_anchors(png_bytes):
              """
              45-DEGREE FIT POINTS (2026-10-01): for a 45 or side cut-out, where the
              frame's bridge and its two lens openings are, in the cut-out's own
              pixels, so the try-on can sit the frame on a turned face: bridge on the
              nose bridge, lens height matched. Returns None when the two openings
              cannot be found (the try-on then falls back to the picture's box).
              """
              try:
                  from scipy import ndimage
                  im = Image.open(io.BytesIO(png_bytes)).convert("RGBA")
                  a = np.asarray(im)[:, :, 3] > 127
                  H, W = a.shape
                  if a.sum() < 400:
                      return None
                  outside = ndimage.binary_propagation(_border(~a), mask=~a)
                  holes = ~a & ~outside
                  lab_, n = ndimage.label(holes)
                  if n < 2:
                      return None
                  fys, fxs = np.where(a)
                  fh = float(fys.max() - fys.min() + 1); fw = float(fxs.max() - fxs.min() + 1)
                  sizes = ndimage.sum(holes, lab_, range(1, n + 1))
                  boxes = []
                  for i in [int(i) + 1 for i in np.argsort(sizes)[::-1][:6]]:
                      ys, xs = np.where(lab_ == i)
                      h = int(ys.max() - ys.min() + 1); w = int(xs.max() - xs.min() + 1)
                      # A LENS, NOT A SPECK (1 Oct): an opening only counts as a lens when it is
                      # at least a quarter of the frame's height and not a sliver
                      if h < 0.25 * fh or len(xs) < 0.015 * fh * fw or w < 0.06 * fw:
                          continue
                      boxes.append({"cx": float(xs.mean()), "cy": float(ys.mean()), "x0": int(xs.min()), "x1": int(xs.max()),
                                    "y0": int(ys.min()), "y1": int(ys.max()), "h": h, "w": w, "area": int(len(xs))})
                  if len(boxes) < 2:
                      return None
                  boxes = boxes[:2]
                  if boxes[1]["area"] < 0.12 * boxes[0]["area"]:
                      return None                                   # the far lens is not really visible
                  if abs(boxes[0]["cy"] - boxes[1]["cy"]) > 0.35 * fh:
                      return None                                   # not two lenses side by side
                  near, far = boxes[0], boxes[1]                   # the bigger opening is the lens nearer the camera
                  left, right = (near, far) if near["cx"] < far["cx"] else (far, near)
                  bridge_x = (left["x1"] + right["x0"]) / 2.0
                  bridge_y = (left["cy"] + right["cy"]) / 2.0
                  ys, xs = np.where(a)
                  return {"w": W, "h": H, "frame": [int(xs.min()), int(ys.min()), int(xs.max()), int(ys.max())],
                          "bridge": [round(bridge_x, 1), round(bridge_y, 1)],
                          "near": {k: near[k] for k in ("cx", "cy", "w", "h")}, "far": {k: far[k] for k in ("cx", "cy", "w", "h")},
                          "nearSide": "left" if near is left else "right",
                          "lensHeightPx": int(near["h"]), "lensLine": round((near["cy"] + far["cy"]) / 2.0, 1)}
              except Exception:
                  return None

          def _lens_shape_ring(a, colour_rgb, lens_mask, rim_alpha=0.72):
              """
              CLOSE THE RING FROM THE LENS SHAPE (1 Oct 2026, VG-1007 Ocelot). The lens
              step already knows each lens opening exactly (found from the rim line in the
              photo). On a full-rim frame the rim runs all the way round that opening, so
              where the cut lost the rim -- a transparent lower rim looks like background
              to the AI -- it is rebuilt as a band right against the lens edge, from the
              photo's own pixels. No edge tracing, so a bright floor line under the frame
              cannot pull the rim down. A transparent rim comes back see-through but
              clearly there (at least 72% solid), never painted.
              Second run on VG-1007 (1 Oct): the rim was not only OPEN in places but also
              THINNED (left bottom 31% of the right). A frame is symmetric, so every
              direction is compared with the same direction on the other lens (mirrored);
              where this side is much thinner, it is brought back up to the other side's
              width -- only by adding the photo's pixels, never by removing anything.
              Returns (new alpha, band mask or None, notes).
              """
              import cv2
              from scipy import ndimage
              notes = []
              L = lens_mask.astype(bool)
              if L.shape != a.shape:
                  return a, None, ["ring: lens shape not usable (size differs)"]
              lab_, n = ndimage.label(L)
              if n < 1:
                  return a, None, ["ring: no lens shape"]
              sizes = ndimage.sum(L, lab_, range(1, n + 1))
              order = [int(i) + 1 for i in np.argsort(sizes)[::-1][:2] if sizes[i] > 0.2 * sizes.max()]
              H, W = a.shape
              src = colour_rgb.astype(np.float32)
              band = np.zeros((H, W), bool)
              def one_pass(A, band, first):
                  notes = []
                  # ---- 1. measure every lens: 72 directions, the rim's width in each ----
                  info = []
                  for k in order:
                      lens = lab_ == k
                      ys, xs = np.where(lens)
                      cy, cx = ys.mean(), xs.mean()
                      dist_out = cv2.distanceTransform((~lens).astype(np.uint8), cv2.DIST_L2, 5)
                      th_at, lost, offs = {}, [], []
                      for ang in range(0, 360, 5):
                          dy, dx = np.sin(np.radians(ang)), np.cos(np.radians(ang))   # image y points down
                          r = 0.0
                          while True:
                              y, x = int(round(cy + dy * r)), int(round(cx + dx * r))
                              if y < 0 or x < 0 or y >= H or x >= W:
                                  y = None; break
                              if not lens[y, x]:
                                  break
                              r += 1.0
                          if y is None:
                              continue
                          # a hairline of background between the lens edge and the rim is not a loss
                          r_edge = r
                          for _skip in range(8):
                              y, x = int(round(cy + dy * r)), int(round(cx + dx * r))
                              if y < 0 or x < 0 or y >= H or x >= W or A[y, x]:
                                  break
                              r += 1.0
                          gap_px = r - r_edge
                          solid = 0
                          while True:
                              y, x = int(round(cy + dy * r)), int(round(cx + dx * r))
                              if y < 0 or x < 0 or y >= H or x >= W or not A[y, x]:
                                  break
                              solid += 1; r += 1.0
                          if solid <= 1:
                              lost.append(ang)
                              continue
                          # width read as the distance from the lens edge at the rim's far side,
                          # so a ray crossing the rim at a slant does not over-measure
                          yl, xl = int(round(cy + dy * (r - 1))), int(round(cx + dx * (r - 1)))
                          th_at[ang] = max(2.0, float(dist_out[min(H - 1, max(0, yl)), min(W - 1, max(0, xl))]) - gap_px)
                          offs.append(gap_px)
                      info.append(dict(lens=lens, cy=cy, cx=cx, dist=dist_out, th=th_at, lost=lost, offs=offs,
                                       name="left" if cx < W / 2.0 else "right"))
                  # ---- 2. compare with the mirrored direction on the other lens ----
                  pair = {}
                  if len(info) == 2:
                      l_, r_ = sorted(info, key=lambda d: d["cx"])
                      pair[id(l_)] = r_; pair[id(r_)] = l_
                  for d in info:
                      name = d["name"]
                      other = pair.get(id(d))
                      # the bridge side is not rim (its width varies by design): leave it out
                      bridge_ang = 0 if (other is not None and other["cx"] > d["cx"]) else 180
                      def near_bridge(g):
                          return min(abs(g - bridge_ang), 360 - abs(g - bridge_ang)) <= 12
                      thin = []
                      if other is not None:
                          for g, tv in d["th"].items():
                              m = (180 - g) % 360
                              if near_bridge(g) or m not in other["th"]:
                                  continue
                              if tv < 0.6 * other["th"][m]:
                                  thin.append(g)
                      # a tapering tip where the rim was cut (e.g. at the end of a missing
                      # stretch, on BOTH lenses alike, so the other lens shows the same tip):
                      # thinner than half of what its own neighbours on both sides measure
                      thn = d["th"]
                      for g in sorted(thn):
                          if near_bridge(g) or g in thin:
                              continue
                          prev_n = [thn[(g - 5 * j) % 360] for j in (1, 2, 3) if (g - 5 * j) % 360 in thn]
                          next_n = [thn[(g + 5 * j) % 360] for j in (1, 2, 3) if (g + 5 * j) % 360 in thn]
                          if len(prev_n) >= 2 and len(next_n) >= 2:
                              ref_ = min(float(np.median(prev_n)), float(np.median(next_n)))
                              if thn[g] < 0.55 * ref_:
                                  thin.append(g)
                      fix = sorted(set(d["lost"]) | set(thin))
                      # (directions with NO rim are always rebuilt, also near the bridge; only the
                  #  "thinner than the other lens" comparison skips the bridge side)
                      if not fix:
                          notes.append("ring: %s lens -- rim whole all round the lens, nothing to rebuild" % name)
                          continue
                      good = {g: v for g, v in d["th"].items() if g not in thin}
                      if len(fix) > 36:
                          notes.append("ring: %s lens -- rim missing or thin in %d of 72 directions, too much to rebuild safely, left as is" % (name, len(fix)))
                          continue
                      if len(good) < 12:
                          notes.append("ring: %s lens -- too little rim left to measure, left as is" % name)
                          continue
                      med_all = float(np.median(list(good.values())))
                      # the width each direction should have: the same direction on the other
                      # lens when that one is whole; otherwise blended from this lens's own rim
                      # on both sides of the damage (middle value of the four nearest rays)
                      known = sorted(good)
                      ext = [k - 360 for k in known] + known + [k + 360 for k in known]
                      Tbin = np.zeros(72, np.float32)
                      for g in fix:
                          m = (180 - g) % 360
                          t_mirror = None
                          if other is not None and m in other["th"] and m not in other["lost"]:
                              t_mirror = float(np.clip(other["th"][m], 0.5 * med_all, 1.6 * med_all))
                          before = [k for k in ext if k < g][-4:]
                          after_ = [k for k in ext if k > g][:4]
                          prev_, next_ = before[-1], after_[0]
                          tp = float(np.median([good[k % 360] for k in before]))
                          tn = float(np.median([good[k % 360] for k in after_]))
                          w_ = (g - prev_) / float(max(1, next_ - prev_))
                          t_own = float(np.clip((1 - w_) * tp + w_ * tn, 0.5 * med_all, 1.2 * med_all))
                          # the fuller of the two: a rebuilt piece a little thick still closes the
                          # ring and is only the photo's own pixels; a piece too thin leaves a gap
                          Tbin[g // 5] = max(t_own, t_mirror) if t_mirror is not None else t_own
                      OFF = float(np.median(d["offs"])) if d["offs"] else 0.0   # the rim starts this far out from the lens edge
                      yy0, xx0 = np.mgrid[0:H, 0:W]
                      pa = (np.degrees(np.arctan2(yy0 - d["cy"], xx0 - d["cx"])) + 360.0) % 360.0
                      Tpix = Tbin[(np.round(pa / 5.0).astype(int)) % 72]
                      sector = np.zeros((H, W), bool)
                      for g in fix:
                          dg = np.abs(((pa - g) + 180.0) % 360.0 - 180.0)
                          sector |= dg <= 7.5          # rays are 5 degrees apart: overlap, so no sliver is left between two
                      ring = (d["dist"] > OFF) & (d["dist"] <= OFF + Tpix + 0.5) & sector
                      miss = ring & ~A
                      if miss.sum() < 20:
                          continue
                      # seal hairline slivers where the rebuilt piece meets the surviving rim
                      # (a 1-2 px seam there would still leave the lens "open to the outside")
                      near = np.zeros((H, W), bool)
                      for g in fix:
                          dg = np.abs(((pa - g) + 180.0) % 360.0 - 180.0)
                          near |= dg <= 25.0
                      near &= (d["dist"] > OFF) & (d["dist"] <= OFF + Tpix + 6)
                      se_ = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (9, 9))
                      sealed = cv2.morphologyEx((A | band | miss).astype(np.uint8), cv2.MORPH_CLOSE, se_) > 0
                      miss |= sealed & ~A & near
                      band |= miss
                      notes.append("ring: %s lens -- rim rebuilt round the lens shape: %d directions open, %d thinner than the other lens "
                                   "(rim %.0f-%.0f px thick there)" % (name, len(set(d["lost"]) & set(fix)), len(thin),
                                                                       min(Tbin[g // 5] for g in fix), max(Tbin[g // 5] for g in fix)))

                  return band, notes
              # TWO PASSES (1 Oct): the first rebuilds what is missing or thin against the
              # other lens; where BOTH lenses lost the rim in the same place there was no
              # good side to compare with, so the second pass measures again on the repaired
              # rim and brings any side that is still thinner up to the other.
              band, n1 = one_pass(a > 0.5, band, True)
              notes += n1
              if band.any():
                  band, n2 = one_pass((a > 0.5) | band, band, False)
                  notes += [x for x in n2 if "rebuilt" in x]
              if not band.any():
                  return a, None, notes
              A = a > 0.5
              # see-through where the rim is clear, solid where the photo shows rim colour
              free = (~band) & (~A)
              den = cv2.blur(free.astype(np.float32), (41, 41))[:, :, None] + 1e-6
              bg = cv2.blur(src * free[:, :, None], (41, 41)) / den
              diff = np.abs(src - bg).max(2)
              a_band = np.maximum(rim_alpha, np.clip((diff - 8) / (34 - 8), 0, 1))
              # soften only the OUTER edge of the rebuilt piece: where it meets the surviving
              # rim it stays fully strong, so no hairline seam shows between the two
              soft = np.clip(cv2.GaussianBlur((band | A).astype(np.float32), (0, 0), 0.8) * 1.6, 0, 1)
              out = np.maximum(a, (np.where(band, a_band, 0) * soft).astype(a.dtype))
              return out, band, notes


          def _seal_cracks(a, lens_mask=None, k=3):
              """
              HAIRLINE CRACKS (1 Oct 2026, from the REAL VG-1007 cut-out of run 1193): the
              rebuilt rim and the surviving rim met with 1-2 px cracks. The rim check fires a
              ray through the rim and stops at the first crack that reaches the outside, so a
              rim 18 px thick read as 2-3 px and the frame was rejected (68%). Closing those
              cracks (only ever ADDING pixels, never inside a lens opening) took the same
              real cut to 81%. Returns a boolean mask of the pixels to add.
              """
              import cv2
              A = (a > 0.5).astype(np.uint8)
              closed = cv2.morphologyEx(A, cv2.MORPH_CLOSE, cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (k, k))) > 0
              add = closed & (a <= 0.5)
              if lens_mask is not None:
                  add &= ~lens_mask
              return add


          def _recover_end_plates(a, rgb, lens_mask):
              """
              END-PIECE PLATES (1 Oct 2026, Rauf: "hinges outside area, rim is cut"): the pale
              metal plate on the outer side of each end piece is almost the colour of the wall,
              so the cut dropped it on both sides of VG-1007. Here it is brought back: pixels
              that differ clearly from the wall, only in the outer 9% at each end of the frame,
              only in the upper 72% of its height (where end pieces are), only touching the
              part already kept, never inside or next to a lens opening. Only ADDS pixels.
              Returns a boolean mask of the pixels to add.
              """
              import cv2
              A = a > 0.5
              H, W = A.shape
              none = np.zeros((H, W), bool)
              if lens_mask is None or rgb.shape[:2] != A.shape:
                  return none
              ys, xs = np.where(A)
              if len(xs) < 500:
                  return none
              x0, x1, y0, y1 = xs.min(), xs.max(), ys.min(), ys.max()
              fw, fh = float(x1 - x0), float(y1 - y0)
              far = ~(cv2.dilate(A.astype(np.uint8), np.ones((41, 41), np.uint8)) > 0)
              if far.sum() < 2000:
                  return none
              src = rgb.astype(np.float32)
              den = cv2.blur(far.astype(np.float32), (121, 121))[:, :, None] + 1e-6
              bg = cv2.blur(src * far[:, :, None], (121, 121)) / den
              diff = np.abs(src - bg).max(2)
              strip = np.zeros_like(A); strip[:, :x0 + int(0.09 * fw)] = True; strip[:, x1 - int(0.09 * fw):] = True
              rows = np.zeros_like(A); rows[max(0, y0 - 6):int(y0 + 0.72 * fh), :] = True
              reach = cv2.dilate(A.astype(np.uint8), cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (35, 35))) > 0
              lens_near = cv2.dilate(lens_mask.astype(np.uint8), np.ones((9, 9), np.uint8)) > 0
              cand = (diff > 28) & ~A & strip & rows & reach & ~lens_near
              cand = cv2.morphologyEx(cand.astype(np.uint8), cv2.MORPH_OPEN, np.ones((3, 3), np.uint8)) > 0
              cand = cv2.morphologyEx(cand.astype(np.uint8), cv2.MORPH_CLOSE, cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (7, 7))) > 0
              cand &= ~A & ~lens_near
              touch = cv2.dilate(A.astype(np.uint8), np.ones((5, 5), np.uint8)) > 0
              n, lab, st, _ = cv2.connectedComponentsWithStats(cand.astype(np.uint8))
              keep = np.zeros((H, W), bool)
              for i in range(1, n):
                  comp = lab == i
                  if st[i, 4] >= 60 and (comp & touch).any():
                      keep |= comp
              return keep


          def _rim_fit_setup(a, rgb, lens_mask):
              """Shared set-up for the rim outer-edge steps: kept mask, lens ids, and how much darker/brighter each photo pixel is than the wall."""
              import cv2
              from scipy import ndimage
              A = a > 0.5; H, W = A.shape; L = lens_mask.astype(bool)
              lab, n = ndimage.label(L)
              if n < 1 or rgb.shape[:2] != A.shape:
                  return None
              sizes = ndimage.sum(L, lab, range(1, n + 1))
              ids = [int(i) + 1 for i in np.argsort(sizes)[::-1][:2] if sizes[i] > 0.2 * sizes.max()]
              g = cv2.GaussianBlur(cv2.cvtColor(rgb, cv2.COLOR_RGB2GRAY).astype(np.float32), (0, 0), 0.8)
              far = ~(cv2.dilate(A.astype(np.uint8), np.ones((61, 61), np.uint8)) > 0)
              if far.sum() < 2000:
                  return None
              wall = cv2.blur(g * far, (161, 161)) / (cv2.blur(far.astype(np.float32), (161, 161)) + 1e-6)
              return A, H, W, L, lab, ids, g - wall


          def _rim_fit_rays(A, H, W, lab, ids, d_all, dark, max_out):
              """For the lower half of each lens: along rays from the lens centre, where the kept rim starts/ends and where its DARK band ends."""
              def px(cy, cx, dy, dx, r):
                  y, x = int(round(cy + dy * r)), int(round(cx + dx * r))
                  return (y, x) if 0 <= y < H and 0 <= x < W else None
              res = []
              for i in ids:
                  ys, xs = np.where(lab == i); cy, cx = ys.mean(), xs.mean(); info = {}
                  for ang in range(15, 166, 2):
                      dy, dx = np.sin(np.radians(ang)), np.cos(np.radians(ang)); r = 0.0
                      while True:
                          p = px(cy, cx, dy, dx, r)
                          if p is None or lab[p] != i:
                              break
                          r += 1.0
                      if p is None:
                          continue
                      for _s in range(8):
                          p = px(cy, cx, dy, dx, r)
                          if p is None or A[p]:
                              break
                          r += 1.0
                      rs = r; n_run = 0
                      while True:
                          p = px(cy, cx, dy, dx, r)
                          if p is None or not A[p]:
                              break
                          n_run += 1; r += 1.0
                      if n_run <= 1:
                          continue
                      dv = []
                      for k in range(n_run + max_out + 1):
                          q = px(cy, cx, dy, dx, rs + k)
                          dv.append(float(d_all[q]) if q is not None else 0.0)
                      dark_idx = [k for k in range(n_run) if dv[k] < -dark]
                      if not dark_idx:
                          continue
                      e_dark = max(dark_idx); trim_len = (n_run - 1) - e_dark
                      ext = 0
                      if trim_len <= 1:
                          for k in range(0, max_out + 1):
                              if dv[n_run + k] < -dark:
                                  ext = k + 1
                              elif k - ext >= 1:
                                  break
                      info[ang] = dict(dy=dy, dx=dx, rs=rs, n=n_run, e=e_dark, trim=trim_len, ext=ext)
                  res.append((cy, cx, info))
              return res


          def _rim_fit_quad(cy, cx, p1, p2, r1a, r1b, r2a, r2b, H, W):
              import cv2
              pts = np.array([[cx + p1['dx'] * r1a, cy + p1['dy'] * r1a], [cx + p1['dx'] * r1b, cy + p1['dy'] * r1b],
                              [cx + p2['dx'] * r2b, cy + p2['dy'] * r2b], [cx + p2['dx'] * r2a, cy + p2['dy'] * r2a]])
              m = np.zeros((H, W), np.uint8); cv2.fillPoly(m, [np.round(pts).astype(np.int32)], 1)
              return m > 0


          def _grow_to_rim_edge(a, rgb, lens_mask, dark=20, max_out=12, px_dark=12, verbose=False):
              """
              LOWER RIM, MISSING PART (1 Oct 2026, real VG-1007 / VG-1008 cuts). A clear rim is a DARK band
              (clearly darker than the wall) next to a bright inner highlight. Where the cut stops inside that
              band, grow outward -- but only over the PHOTO PIXELS that are themselves darker than the wall
              (before, whole strips were added, which left blocky pale patches of wall and floor outside the
              rim). At most max_out px; a ray with no dark band is left alone. Only adds pixels.
              """
              import cv2
              S = _rim_fit_setup(a, rgb, lens_mask)
              if S is None:
                  return np.zeros(a.shape, bool)
              A, H, W, L, lab, ids, d_all = S
              add = np.zeros((H, W), bool)
              for cy, cx, info in _rim_fit_rays(A, H, W, lab, ids, d_all, dark, max_out):
                  keys = sorted(info)
                  if not keys:
                      continue
                  ext = {k: info[k]['ext'] for k in keys}
                  sm = {k: int(round(float(np.median([ext[keys[t]] for t in range(max(0, j - 3), min(len(keys), j + 4))])))) for j, k in enumerate(keys)}
                  for j in range(len(keys) - 1):
                      k1, k2 = keys[j], keys[j + 1]
                      if k2 - k1 != 2 or (sm[k1] < 1 and sm[k2] < 1):
                          continue
                      i1, i2 = info[k1], info[k2]
                      add |= _rim_fit_quad(cy, cx, i1, i2, i1['rs'] + i1['n'] - 1, i1['rs'] + i1['n'] + sm[k1] + .5,
                                           i2['rs'] + i2['n'] - 1, i2['rs'] + i2['n'] + sm[k2] + .5, H, W)
              add = add & ~A & ~L & (d_all < -px_dark)
              add = cv2.morphologyEx(add.astype(np.uint8), cv2.MORPH_CLOSE, cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (3, 3))) > 0
              add &= ~A & ~L
              if verbose:
                  print("rim growth: %d px" % int(add.sum()))
              return add


          def _trim_pale_outside(a, rgb, lens_mask, dark=14, max_trim=14, px_pale=-6):
              """
              EXTRA PALE BITS OUTSIDE THE RIM (1 Oct 2026, Rauf, VG-1008: "both"): the cut keeps bits of the
              bright floor and the pale wall beyond the rim's dark outer edge. Along the same rays as the growth
              step: where kept pixels lie BEYOND the dark band's outer end, and each such pixel is itself not
              darker than the wall, it is removed (at most max_trim px per ray, never the inner 8 px of rim, a
              ray with no dark band is left alone). This is COSMETIC finishing: it runs after the approval
              decision and is undone if it would open the ring. Returns a boolean mask of pixels to remove.
              """
              S = _rim_fit_setup(a, rgb, lens_mask)
              if S is None:
                  return np.zeros(a.shape, bool)
              A, H, W, L, lab, ids, d_all = S
              rem = np.zeros((H, W), bool)
              for cy, cx, info in _rim_fit_rays(A, H, W, lab, ids, d_all, dark, 0):
                  ok = {k for k in info if 1 < info[k]['trim'] <= max_trim and info[k]['e'] + 2 >= 8}
                  for k1 in sorted(info):
                      k2 = k1 + 2
                      if k2 not in info or k1 not in ok or k2 not in ok:
                          continue
                      i1, i2 = info[k1], info[k2]
                      rem |= _rim_fit_quad(cy, cx, i1, i2, i1['rs'] + i1['e'] + 1.5, i1['rs'] + i1['n'] + .5,
                                           i2['rs'] + i2['e'] + 1.5, i2['rs'] + i2['n'] + .5, H, W)
              return rem & A & ~L & (d_all > px_pale)


          def close_full_rim_ring(a, colour_rgb, min_alpha=0.42, lens_mask=None):
              """
              Close the ring on a full-rim frame. FIRST from the lens shape (when the lens
              step found the openings) -- exact placement, no tracing; THEN, if the rim is
              still open anywhere, the traced repair (long gaps) and short-break bridging.
              Returns (new alpha, notes, band) as before.
              """
              notes = []
              band0 = None
              if lens_mask is not None:
                  try:
                      a, band0, n0 = _lens_shape_ring(a, colour_rgb, lens_mask)
                      notes += n0
                  except Exception as ex:
                      notes.append("ring: lens-shape rebuild could not run (%s)" % str(ex)[:60])
              a2, n1, band1 = _close_ring_trace(a, colour_rgb, min_alpha)
              notes += [x for x in n1 if not (band0 is not None and x in ("ring: no break-off points",))]
              if band0 is None:
                  band = band1
              else:
                  band = band0 if band1 is None else (band0 | band1)
              # finishing touches on the repaired frame (only ever add pixels)
              try:
                  add = np.zeros(a2.shape, bool)
                  seal = _seal_cracks(a2, lens_mask)
                  if seal.any():
                      add |= seal
                      notes.append("ring: %d px of hairline cracks in the rim sealed" % int(seal.sum()))
                  grow = np.zeros(a2.shape, bool)
                  if lens_mask is not None and lens_mask.shape == a2.shape:
                      grow = _grow_to_rim_edge(np.maximum(a2, seal.astype(a2.dtype)), colour_rgb, lens_mask)
                  if grow.any():
                      add |= grow
                      notes.append("ring: %d px added along the outer edge of the lower rim (the cut ended inside the rim)" % int(grow.sum()))
                  plate = _recover_end_plates(np.maximum(a2, (seal | grow).astype(a2.dtype)), colour_rgb, lens_mask)
                  if plate.any():
                      add |= plate
                      notes.append("ring: %d px of the pale metal plate on the outer end pieces brought back" % int(plate.sum()))
                  if add.any():
                      a2 = np.maximum(a2, (add * 0.9).astype(a2.dtype))
                      band = add if band is None else (band | add)
              except Exception as ex:
                  notes.append("ring: finishing touches could not run (%s)" % str(ex)[:60])
              # WHAT IS CHECKED MUST BE WHAT IS SAVED (1 Oct, review of build 01g): a rim repaired
              # along a clear rim could be saved at alpha 0.35-0.42 while the approval check counted
              # it as fully solid -- the gate said "closed" and the saved PNG had an open lens. Every
              # repaired pixel is now saved at 0.55 or more (still see-through, clearly there), so
              # the ring is closed at the same threshold (0.5) the check and the try-on use.
              if band is not None:
                  a2 = np.maximum(a2, (np.asarray(band).astype(bool) * np.float32(0.55)).astype(a2.dtype))
              return a2, notes, band

          def rim_bottom_loss(alpha):
              """
              SECOND TRIGGER for close-the-ring (2026-09-30): the left/right comparison
              misses a loss that hits BOTH lower rims the same way. Here each lens is
              judged against its own ring: the rim's thickness below the lens compared
              with its thickness at the top and sides. Returns the worst bottom/rest
              ratio (1.0 = as thick as the rest), or None when two enclosed lenses
              cannot be found (that case is caught by the rim check itself).
              """
              from scipy import ndimage
              A = alpha > 0.5
              H, W = A.shape
              outside = ndimage.binary_propagation(_border(~A), mask=~A)
              holes = ~A & ~outside
              lab_, n = ndimage.label(holes)
              if n < 2:
                  return None
              sizes = ndimage.sum(holes, lab_, range(1, n + 1))
              two = [int(i) + 1 for i in np.argsort(sizes)[-2:]]
              if sizes[two[0] - 1] < 0.5 * sizes[two[1] - 1]:
                  return None
              worst = 1.0
              for i in two:
                  ys, xs = np.where(lab_ == i)
                  cy, cx = ys.mean(), xs.mean()
                  bottom, rest = [], []
                  for ang in range(0, 360, 10):
                      dy, dx = -np.sin(np.radians(ang)), np.cos(np.radians(ang))
                      r, in_hole, solid = 0.0, True, 0
                      while True:
                          y, x = int(round(cy + dy * r)), int(round(cx + dx * r))
                          if y < 0 or x < 0 or y >= H or x >= W:
                              solid = None; break
                          if in_hole:
                              if lab_[y, x] != i:
                                  in_hole = False
                                  if not A[y, x]:
                                      break
                                  solid = 1
                          else:
                              if A[y, x]:
                                  solid += 1
                              else:
                                  break
                          r += 0.5
                      if solid is None:
                          continue
                      (bottom if 240 <= ang <= 300 else rest).append(solid)
                  if bottom and rest:
                      ratio = float(np.median(bottom)) / max(1.0, float(np.median(rest)))
                      worst = min(worst, ratio)
              return worst

          def rim_balance(alpha):
              """RIM CHECK (2026-09-21, Rauf: the rim must be as thick as in the photo).
              A frame is symmetric: measure the rim's thickness around each lens in 36
              directions (from the lens edge outward to the background) and compare the
              left lens with the mirrored right lens. Returns (worst ratio thinner/
              thicker, direction in degrees, which side is thinner) or None."""
              from scipy import ndimage
              A = alpha > 0.5
              H, W = A.shape
              outside = ndimage.binary_propagation(_border(~A), mask=~A)
              holes = ~A & ~outside
              lab_, n = ndimage.label(holes)
              if n < 2:
                  return None
              sizes = ndimage.sum(holes, lab_, range(1, n + 1))
              two = [int(i) + 1 for i in np.argsort(sizes)[-2:]]
              if sizes[two[0] - 1] < 0.5 * sizes[two[1] - 1]:
                  return None
              cen = {}
              for i in two:
                  ys, xs = np.where(lab_ == i)
                  cen[i] = (ys.mean(), xs.mean(), ys, xs)
              li, ri = sorted(two, key=lambda i: cen[i][1])
              step = 0.5
              def thick(i, ang):
                  cy, cx = cen[i][0], cen[i][1]
                  dy, dx = -np.sin(np.radians(ang)), np.cos(np.radians(ang))
                  r, in_hole = 0.0, True
                  solid = 0
                  while True:
                      y, x = int(round(cy + dy * r)), int(round(cx + dx * r))
                      if y < 0 or x < 0 or y >= H or x >= W:
                          return None
                      if in_hole:
                          if lab_[y, x] != i:
                              in_hole = False
                          else:
                              r += step
                              continue
                      if outside[y, x] or (lab_[y, x] > 0 and lab_[y, x] != i):
                          return solid * step
                      if A[y, x]:
                          solid += 1
                      r += step
                      if r > 3 * max(H, W):
                          return None
              worst = (1.0, None, None)
              # 2026-09-23: skip the bridge direction. A ray fired from the lens centre
              # toward the nose can slip through the gap under the bridge and measure
              # almost nothing, which read as "left rim only 8%" on the cat-eye and held
              # a good frame off the website. The bridge is not rim, and its thickness
              # varies by design.
              angs = [a_ for a_ in range(0, 360, 10) if not (a_ <= 25 or a_ >= 335)]
              tl = [thick(li, a_) for a_ in angs]
              tr = [thick(ri, 180 - a_) for a_ in angs]      # mirrored direction
              for k, a_ in enumerate(angs):
                  vals = []
                  for j in (k - 1, k, k + 1):                 # 3 neighbouring directions, against noise
                      l_, r_ = tl[j % len(angs)], tr[j % len(angs)]
                      if l_ is None or r_ is None or max(l_, r_) < 4:
                          continue
                      vals.append((min(l_, r_) / max(l_, r_), "left" if l_ < r_ else "right"))
                  if len(vals) == 3:
                      m = max(v[0] for v in vals)              # all three must agree it is thin
                      if m < worst[0]:
                          worst = (m, a_, vals[1][1])
              return worst


          def side_arm_span(alpha):
              """How far a thin strip (thinner than 12% of the frame's depth) reaches out
              beyond the frame's ends, as a fraction of the frame's width -- the larger
              of the two sides. Measures only, never cuts."""
              A = alpha > 0.5
              heights = A.sum(axis=0)
              cols = np.where(heights > 0)[0]
              if cols.size < 10:
                  return 0.0
              depth = float(heights.max()); x0, x1 = int(cols.min()), int(cols.max())
              thin = heights < depth * 0.12
              l = x0
              while l < x1 and thin[l]:
                  l += 1
              r = x1
              while r > l and thin[r]:
                  r -= 1
              return max(l - x0, x1 - r) / float(max(1, x1 - x0 + 1))


          def cut_end_to_end(alpha):
              """
              The front try-on picture: arms removed, end pieces kept.

              Walking in from each side, a column belonging to an arm is far
              shorter than a column belonging to a rim. Columns shorter than 12%
              of the frame's depth are dropped; the walk stops at the first proper
              column, which is the end piece. Nothing is thinned: whole columns of
              arm are dropped, never a pixel of what is kept.
              """
              # measure with the solid part only: the soft edge the matting adds
              # around a thin arm must not make it look as deep as a rim
              A = alpha > 0.5
              heights = A.sum(axis=0)
              if not heights.any():
                  return alpha
              depth = float(heights.max())
              thin = heights < depth * 0.12
              W = alpha.shape[1]
              left = 0
              while left < W and (heights[left] == 0 or thin[left]):
                  left += 1
              right = W - 1
              while right > left and (heights[right] == 0 or thin[right]):
                  right -= 1
              out = alpha.copy()
              out[:, :left] = 0.0
              out[:, right + 1:] = 0.0
              return out


          def measurements(alpha):
              """Lens centres, widths, bridge and front width, in pixels and as
              fractions of the front width -- the numbers the try-on engine uses."""
              from scipy import ndimage
              lens, _ = lens_holes(alpha)
              ys, xs = np.where(alpha > 0.2)
              if not xs.size:
                  return {}
              front_w = int(xs.max() - xs.min() + 1)
              front_h = int(ys.max() - ys.min() + 1)
              out = {"frontWidthPx": front_w, "frontHeightPx": front_h}
              lab, n = ndimage.label(lens)
              if n < 1:
                  return out
              boxes = []
              for i in range(1, n + 1):
                  yy, xx = np.where(lab == i)
                  boxes.append((xx.min(), xx.max(), yy.min(), yy.max(), xx.size))
              boxes.sort(key=lambda b: -b[4])
              boxes = sorted(boxes[:2], key=lambda b: b[0])
              eyes = []
              for (x0, x1, y0, y1, _s) in boxes:
                  eyes.append({
                      "centreX": float((x0 + x1) / 2.0),
                      "centreY": float((y0 + y1) / 2.0),
                      "widthPx": int(x1 - x0 + 1),
                      "heightPx": int(y1 - y0 + 1),
                      "centreXFrac": float(((x0 + x1) / 2.0 - xs.min()) / front_w),
                  })
              out["lenses"] = eyes
              if len(boxes) == 2:
                  out["bridgePx"] = int(boxes[1][0] - boxes[0][1])
                  out["pupilGapPx"] = float(eyes[1]["centreX"] - eyes[0]["centreX"])
              return out


          # ---------------------------------------------------------------- reading
          # The shop's own rules for shape, rim type, material and colour, moved
          # from the phone (where they ran on a weak cut) onto the robot's clean
          # cut. Every reading is a suggestion: it fills an empty box in admin and
          # never overwrites a choice the shop made.

          NAMED_COLOURS = [
              ("black", (27, 27, 32)), ("gunmetal", (75, 78, 85)), ("grey", (141, 141, 149)),
              ("silver", (185, 188, 194)), ("white", (236, 239, 242)),
              ("brown", (107, 74, 42)), ("tortoise", (122, 74, 30)), ("gold", (154, 115, 40)), ("amber", (156, 86, 32)),
              ("navy", (29, 47, 87)), ("blue", (47, 91, 140)), ("green", (47, 107, 69)), ("forest", (34, 80, 58)),
              ("red", (166, 48, 48)), ("burgundy", (107, 31, 46)), ("pink", (192, 122, 142)),
              ("purple", (91, 58, 104)), ("plum", (77, 42, 86)),
              ("light blue", (143, 179, 217)), ("light purple", (183, 156, 207)), ("light pink", (227, 180, 196)),
              ("light grey", (196, 198, 204)), ("light green", (157, 201, 168)), ("light brown", (184, 145, 106)),
              ("transparent blue", (169, 196, 222)), ("transparent purple", (195, 169, 214)),
              ("transparent brown", (201, 168, 130)), ("transparent pink", (230, 194, 207)), ("transparent green", (180, 212, 188)),
          ]


          def name_colour(rgb, bg_lum):
              r, g, b = rgb
              lum = r * .299 + g * .587 + b * .114
              mx, mn = max(rgb), min(rgb)
              sat = (mx - mn) / mx if mx else 0
              if sat < 0.10 and bg_lum > 0 and abs(lum - bg_lum) < 28:
                  return "transparent"
              if sat < 0.10 and lum > 205:
                  return "white"
              best, bd = "black", 1e18
              for n, c in NAMED_COLOURS:
                  d = (r - c[0]) ** 2 * 0.3 + (g - c[1]) ** 2 * 0.59 + (b - c[2]) ** 2 * 0.11
                  if d < bd:
                      bd, best = d, n
              return best


          def read_colours(rgb, alpha, bg_lum):
              """Top and bottom band of the rim: two names, and whether they differ."""
              solid = alpha >= 0.8
              ys_, _xs = np.where(solid)
              if not ys_.size:
                  return None
              # 2026-09-22: the bands were taken from the whole picture, so a frame
              # sitting in the middle of a tall photo gave no colour at all. Measure
              # the top and bottom of the FRAME.
              fy0, fy1 = int(ys_.min()), int(ys_.max()) + 1
              fh = max(1, fy1 - fy0)
              out = []
              for y0, y1 in ((fy0, fy0 + int(fh * 0.40)), (fy0 + int(fh * 0.60), fy1)):
                  m = solid[y0:y1]
                  px = rgb[y0:y1][m]
                  out.append(px.reshape(-1, 3).mean(axis=0) if px.size else None)
              top, bot = out
              if top is None:
                  return None
              tn = name_colour(tuple(top), bg_lum)
              bn = name_colour(tuple(bot), bg_lum) if bot is not None else tn
              hx = lambda c: "#%02x%02x%02x" % tuple(int(round(v)) for v in c)
              return {"top": tn.title(), "bottom": bn.title(), "topHex": hx(top),
                      "bottomHex": hx(bot) if bot is not None else hx(top), "twoTone": tn != bn}


          def read_shape(alpha):
              """Shape, rim type and material from the two lens openings.

              Everything about the OPENING is judged from the enclosed hole itself
              (lens_holes), never from "anything transparent inside its box": the
              corners of a round lens's box lie outside the frame and would make
              every round frame read as square. The RIM is judged from the alpha
              just outside the hole."""
              from scipy import ndimage
              H, W = alpha.shape
              OPEN = 40 / 255.0
              lens, _ = lens_holes(alpha)
              lab, n = ndimage.label(lens)
              if n < 2:
                  # no enclosed openings: a full rim always makes two, so this is a
                  # half rim or rimless front. Shape cannot be read; the rim can.
                  return {"shape": "", "rim": "Half rim", "material": "", "shapeSure": False,
                          "rimSure": False, "detail": {"holes": int(n)}}
              sizes = ndimage.sum(lens, lab, range(1, n + 1))
              idx = [i + 1 for i in sorted(range(n), key=lambda i: -sizes[i])[:2]]
              holes = []
              for i in idx:
                  yy, xx = np.where(lab == i)
                  holes.append((int(xx.min()), int(xx.max()), int(yy.min()), int(yy.max()), lab == i))
              holes.sort(key=lambda b: b[0])
              per = []
              for i, (x0, x1, y0, y1, hole) in enumerate(holes):
                  bw, bh = x1 - x0 + 1, y1 - y0 + 1
                  if bw < 8 or bh < 8:
                      return None
                  rows = hole[y0:y1 + 1].sum(axis=1).astype(float)      # opening width per row
                  q = max(1, bh // 4)
                  top_w, bot_w, mid_w = rows[:q].mean(), rows[-q:].mean(), rows.max()
                  fill = float(hole.sum()) / (bw * bh)                    # 0.785 circle, ~0.95 square
                  outer = (i == 0)
                  # the top edge of the opening, outer band vs inner band (cat eye lifts the outer)
                  def edge_top(f0, f1):
                      tops = []
                      for x in range(x0 + int(round(bw * f0)), min(x1, x0 + int(round(bw * f1))) + 1):
                          col = np.where(hole[:, x])[0]
                          if col.size: tops.append(col.min() - y0)
                      return float(np.mean(tops)) if tops else 0.0
                  outer_edge = edge_top(0.05, 0.30) if outer else edge_top(0.70, 0.95)
                  inner_edge = edge_top(0.70, 0.95) if outer else edge_top(0.05, 0.30)
                  lift = (inner_edge - outer_edge) / bh
                  # the opening's outer side: does it reach further out at the top than at the bottom?
                  def outer_reach(f0, f1):
                      vals = []
                      for y in range(y0 + int(round(bh * f0)), min(y1, y0 + int(round(bh * f1))) + 1):
                          r = np.where(hole[y])[0]
                          if r.size: vals.append((x0 + bw - r.min()) if outer else (r.max() - x0))
                      return float(np.mean(vals)) if vals else 0.0
                  flare = (outer_reach(0.05, 0.25) - outer_reach(0.75, 0.95)) / bw
                  # rim thickness above and below, thinnest of three columns
                  def thick(xf, d):
                      cx = min(x1, x0 + int(round(bw * xf)))
                      col = np.where(hole[:, cx])[0]
                      if not col.size: return 0
                      y = (col.min() - 1) if d < 0 else (col.max() + 1)
                      k = 0
                      while 0 <= y < H and alpha[y, cx] >= OPEN and k < H:
                          k += 1; y += d
                      return k
                  rim_top = min(thick(0.3, -1), thick(0.5, -1), thick(0.7, -1))
                  rim_bot = min(thick(0.3, 1), thick(0.5, 1), thick(0.7, 1))
                  per.append(dict(ratio=bw / bh, fill=fill, topBot=top_w / bot_w if bot_w else 9.0,
                                  lift=lift, flare=flare, rimTop=rim_top, rimBot=rim_bot, bh=bh))
              m = lambda k: (per[0][k] + per[1][k]) / 2
              ratio, fill, top_bot = m("ratio"), m("fill"), m("topBot")
              lift, flare, rim_top, rim_bot, bh = m("lift"), m("flare"), m("rimTop"), m("rimBot"), m("bh")
              if lift > 0.08: shape = "Cat eye"
              elif rim_top > 0 and rim_bot > 0 and rim_top > rim_bot * 2.4: shape = "Browline"
              elif top_bot > 1.35 and fill < 0.88: shape = "Aviator"          # teardrop: wide top, narrow bottom
              elif flare > 0.08 or (top_bot > 1.12 and fill >= 0.80): shape = "Wayfarer"
              elif ratio < 1.15: shape = "Square" if fill >= 0.86 else "Round"
              else: shape = "Rectangle" if fill >= 0.86 else "Oval"
              rim = "Rimless" if (rim_bot == 0 and rim_top == 0) else ("Half rim" if rim_bot == 0 else "Full rim")
              rel = rim_top / bh if bh else 0
              material = "" if rim == "Rimless" else ("Metal" if rel <= 0.06 else ("Acetate" if rel >= 0.10 else ""))
              shape_sure = not ((0.82 < fill < 0.90) or (0.05 < lift < 0.11) or (1.25 < top_bot < 1.45) or
                                (1.08 < ratio < 1.22 and shape in ("Square", "Round", "Rectangle", "Oval")))
              rim_sure = rim_bot >= 3 if rim == "Full rim" else True
              return {"shape": shape, "rim": rim, "material": material,
                      "shapeSure": bool(shape_sure), "rimSure": bool(rim_sure),
                      "detail": {k: round(float(v), 3) for k, v in
                                 dict(ratio=ratio, fill=fill, topBot=top_bot, lift=lift, flare=flare,
                                      rimTop=rim_top, rimBot=rim_bot).items()}}


          def read_frame(img, alpha):
              """What a camera can see about the frame, from the finished cut."""
              out = {}
              try:
                  rgb = np.asarray(img.convert("RGB"))
                  H, W = alpha.shape
                  border = np.concatenate([rgb[0, :], rgb[-1, :], rgb[:, 0], rgb[:, -1]]).astype(np.float64)
                  bg_lum = float((border[:, 0] * .299 + border[:, 1] * .587 + border[:, 2] * .114).mean())
                  col = read_colours(rgb, alpha, bg_lum)
                  if col: out["colour"] = col
              except Exception as e:
                  out["colourError"] = str(e)[:80]
              try:
                  geo = read_shape(alpha)
                  if geo: out["geometry"] = geo
              except Exception as e:
                  out["shapeError"] = str(e)[:80]
              return out


          def apply_reading(p, reading):
              """Fill the boxes the shop left empty. Never overwrite a choice."""
              filled = []
              was_auto = set(p.get("autoFields") or [])
              def put(field, value, sure=True):
                  if not value: return
                  if p.get(field) and field not in was_auto: return
                  if p.get(field) == value: return
                  p[field] = value; was_auto.add(field); filled.append(field + ("" if sure else "?"))
              col = reading.get("colour") or {}
              geo = reading.get("geometry") or {}
              if col:
                  put("colour", col.get("top"), True)
                  if col.get("twoTone"): put("colour2", col.get("bottom"), False)
              if geo:
                  put("shape", geo.get("shape"), geo.get("shapeSure", False))
                  put("rim", geo.get("rim"), geo.get("rimSure", False))
                  put("material", geo.get("material"), False)
              p["autoFields"] = sorted(was_auto)
              p["robotRead"] = reading
              return filled


          def sheet_colour(rgb):
              """The sheet the frame lies on: the median of the picture's border."""
              b = np.concatenate([rgb[0, :], rgb[-1, :], rgb[:, 0], rgb[:, -1]]).astype(np.float64)
              return np.median(b, axis=0)


          def pad_with_sheet(img, frac=0.15):
              """A photo cropped tight to the frame has no sheet around it, and the
              model then answers "the object is everything". Give it a margin of
              sheet colour; the margin is removed again after cutting."""
              rgb = np.asarray(img)
              H, W = rgb.shape[:2]
              py, px = int(H * frac), int(W * frac)
              col = tuple(int(round(v)) for v in sheet_colour(rgb))
              out = Image.new("RGB", (W + 2 * px, H + 2 * py), col)
              out.paste(img, (px, py))
              return out, (px, py)


          def only_lens_shaped(before, after):
              """Put back every removed piece that is not lens-shaped. A lens seen at
              45 degrees is still at least a quarter of the frame's height and no more
              than about three times as wide as tall; a slot along a temple is long and
              thin. Returns the corrected alpha and how many glass pixels stayed removed."""
              from scipy import ndimage
              b = before > 0.5; a2 = after > 0.5
              removed = b & ~a2
              if not removed.any():
                  return after, 0
              ys, xs = np.where(b)
              frame_h = (ys.max() - ys.min() + 1) if ys.size else 1
              lab, n = ndimage.label(removed)
              out = after.copy(); kept = 0
              for i, sl in enumerate(ndimage.find_objects(lab), start=1):
                  if sl is None:
                      continue
                  h = sl[0].stop - sl[0].start; w = sl[1].stop - sl[1].start
                  piece = lab[sl] == i
                  area = int(piece.sum())
                  lens_like = h >= 0.25 * frame_h and w <= 3.0 * h and area >= 0.35 * h * w
                  if lens_like:
                      kept += area
                  else:
                      out[sl][piece] = before[sl][piece]              # frame, not glass: back it goes
              return out, kept


          def clear_glass_by_colour(img, alpha, band_px):
              """
              The glass shows the sheet through it, so inside the frame a pixel
              close to the sheet colour is glass, not rim: rim sits about 210 away
              from the sheet, glass about 82 (measured on the shop's own photo).
              Only pixels well INSIDE the frame outline are considered, so the
              outer edge of the rim is never touched.
              """
              import cv2
              rgb = np.asarray(img).astype(np.float64)
              sheet = sheet_colour(np.asarray(img))
              dist = np.sqrt(((rgb - sheet) ** 2).sum(axis=2))
              solid = (alpha > 0.5).astype(np.uint8)
              inside = cv2.distanceTransform(solid, cv2.DIST_L2, 5) > band_px      # away from the outer edge
              rim_ref = np.percentile(dist[(solid == 1) & ~inside], 60) if ((solid == 1) & ~inside).any() else 200.0
              if rim_ref < 70:
                  # a crystal or very pale rim sits almost on the sheet colour: glass and
                  # rim cannot be told apart by colour, and the rim must never be thinned
                  return alpha, False
              thresh = max(35.0, min(0.45 * rim_ref, 90.0))
              glass = inside & (dist < thresh)
              if not glass.any():
                  return alpha, False
              k = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (5, 5))
              glass = cv2.morphologyEx(glass.astype(np.uint8), cv2.MORPH_OPEN, k).astype(bool)
              out = alpha.copy()
              out[glass] = 0.0
              return out, True


          def fill_lens_hulls(alpha, band_px):
              """A temple or hinge seen through the glass leaves a dark notch in
              the opening. Each opening is a smooth shape, so its convex hull is
              the true opening; fill it -- but only where that is clear of the
              rim's outer edge, which keeps rounded corners and the rim itself."""
              import cv2
              from scipy import ndimage
              lens, outside = lens_holes(alpha)
              if not lens.any():
                  return alpha
              solid = (alpha > 0.5).astype(np.uint8)
              inside = cv2.distanceTransform(solid | lens.astype(np.uint8), cv2.DIST_L2, 5) > band_px * 1.5
              lab, n = ndimage.label(lens)
              out = alpha.copy()
              for i in range(1, n + 1):
                  ys, xs = np.where(lab == i)
                  if xs.size < 50:
                      continue
                  pts = np.stack([xs, ys], axis=1).astype(np.int32)
                  hull = cv2.convexHull(pts)
                  canvas = np.zeros(alpha.shape, np.uint8)
                  cv2.fillConvexPoly(canvas, hull, 1)
                  fill = (canvas == 1) & inside & ~outside
                  out[fill] = 0.0
              return out


          def tighten_edge(alpha):
              """
              The matte leaves a wide soft band either side of the edge. The true
              edge is where alpha crosses one half; that line is kept exactly where
              it is (so the rim is never thinned), while pixels well below a half go
              to zero and pixels well above go to one. What remains is a 1-2 px
              soft edge instead of a 10-30 px glow.
              """
              return np.clip((alpha - 0.25) / 0.5, 0.0, 1.0).astype(np.float32)


          def strip_sheet_ring(img, alpha, lens_mask=None, local=False):
              """
              Right next to the rim the sheet is slightly darkened by the frame's
              shadow, so the model keeps a thin ring of it as if it were frame. A
              pixel on the transparent boundary whose colour is still close to the
              sheet is sheet, and goes. Guarded exactly like the glass rule: never
              when the rim itself is near the sheet colour.
              """
              import cv2
              if local:
                  # LOCAL WALL COLOUR (1 Oct 2026, real VG-1007 photo). The rule below judges "sheet-coloured" against ONE
                  # colour taken far from the frame (here the grey of the upper background, 130/142/134), but the wall
                  # next to the lower rim is brighter and the rim's own dark band is close to that one colour -- so it
                  # erased the lower rim's dark band (measured on a good cut: 8,400 px of rim, 6,400 of them in the
                  # lower rim). Here every pixel is judged against the wall colour AT THAT PLACE (a smooth model from
                  # pixels far from the frame), with a fixed small distance, never within 12 px of a lens opening (the
                  # inner edge of the rim), and three passes at most. Same 3x3 edge smoothing afterwards.
                  rgbf = np.asarray(img).astype(np.float32)
                  A0 = alpha > 0.5
                  if not A0.any():
                      return alpha
                  far = ~(cv2.dilate(A0.astype(np.uint8), np.ones((61, 61), np.uint8)) > 0)
                  if far.sum() < 2000:
                      return alpha
                  wallc = cv2.blur(rgbf * far[:, :, None], (161, 161)) / (cv2.blur(far.astype(np.float32), (161, 161))[:, :, None] + 1e-6)
                  dist_l = cv2.GaussianBlur(np.sqrt(((rgbf - wallc) ** 2).sum(axis=2)).astype(np.float32), (3, 3), 0)
                  protect = np.zeros(alpha.shape, bool)
                  if lens_mask is not None and lens_mask.shape == alpha.shape:
                      protect = cv2.dilate(lens_mask.astype(np.uint8), cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (25, 25))) > 0
                  out = alpha.copy()
                  for _ in range(3):
                      solid = (out > 0.5).astype(np.uint8)
                      near_edge = cv2.distanceTransform(solid, cv2.DIST_L2, 5) <= 3
                      ring = (out > 0) & near_edge & (dist_l < 40.0) & ~protect
                      if not ring.any():
                          break
                      out[ring] = 0.0
                  edge = (out > 0) & (out < 1)
                  edge = cv2.dilate(edge.astype(np.uint8), np.ones((3, 3), np.uint8)) > 0
                  smooth = cv2.GaussianBlur(out, (3, 3), 0)
                  return np.where(edge, smooth, out).astype(np.float32)
              rgb = np.asarray(img).astype(np.float64)
              sheet = sheet_colour(np.asarray(img))
              dist = np.sqrt(((rgb - sheet) ** 2).sum(axis=2))
              dist = cv2.GaussianBlur(dist.astype(np.float32), (3, 3), 0)   # judge by neighbourhood, not lone pixels
              solid = (alpha > 0.5).astype(np.uint8)
              if not solid.any():
                  return alpha
              rim_ref = np.percentile(dist[solid == 1], 60)
              if rim_ref < 70:
                  return alpha
              thresh = max(35.0, min(0.45 * rim_ref, 90.0))
              out = alpha.copy()
              for _ in range(4):                       # peel the ring a few pixels at a time
                  solid = (out > 0.5).astype(np.uint8)
                  near_edge = cv2.distanceTransform(solid, cv2.DIST_L2, 5) <= 3
                  ring = (out > 0) & near_edge & (dist < thresh)
                  if not ring.any():
                      break
                  out[ring] = 0.0
              # a 3x3 smoothing of the edge only: symmetric, so the half-way line --
              # the rim's true edge -- stays where it is; nothing is thinned
              edge = (out > 0) & (out < 1)
              edge = cv2.dilate(edge.astype(np.uint8), np.ones((3, 3), np.uint8)) > 0
              smooth = cv2.GaussianBlur(out, (3, 3), 0)
              out = np.where(edge, smooth, out).astype(np.float32)
              return out


          def nearest_colour(rgb, mask):
              """For every pixel, the colour of the NEAREST pixel where mask is true.
              Used twice below: to read the sheet's colour close by instead of one
              median for the whole photo, and to give invisible pixels the rim's
              own colour."""
              import cv2
              if not mask.any():
                  return None
              H, W = mask.shape
              dist, lbl = cv2.distanceTransformWithLabels(
                  (~mask).astype(np.uint8), cv2.DIST_L2, 5,
                  labelType=cv2.DIST_LABEL_PIXEL)
              ys, xs = np.where(mask)
              table = np.zeros(int(lbl.max()) + 1, dtype=np.int64)
              table[lbl[mask]] = ys * W + xs
              return rgb.reshape(-1, 3)[table[lbl]].reshape(H, W, 3)


          def unmix_edge(img, alpha):
              """
              The pale 'ice' fringe: an edge pixel is part rim, part sheet, and the
              cut keeps the mixed colour. Undo the mix so every partly transparent
              pixel carries the rim's own colour, transparency unchanged.

              Three rules, 2026-09-20 (measured on a test frame: the pale halo on a
              face dropped from +21 to +0.5 brightness points):
                1. the matting library's foreground estimate stays the main method;
                2. the fallback reads the sheet's colour NEARBY, not one median for
                   the whole photo (a shadow on the sheet made the median wrong);
                3. below 20 percent opacity nothing is divided -- those pixels take
                   the colour of the nearest solid rim pixel. An invisible pixel
                   still carries a colour, and the phone mixes that colour in when
                   it shrinks the cut-out onto a face: white there is the halo.
              Transparency and shape are NOT touched by any of this; only colour.
              """
              rgb = np.asarray(img).astype(np.float64) / 255.0
              solid = alpha >= 0.98
              try:
                  from pymatting import estimate_foreground_ml
                  fg = estimate_foreground_ml(rgb, alpha.astype(np.float64))
              except Exception:
                  bg = nearest_colour(rgb, alpha < 0.05)
                  if bg is None:
                      bg = np.ones_like(rgb) * (sheet_colour(np.asarray(img)) / 255.0)
                  a3 = np.clip(alpha, 0.2, 1.0)[..., None]      # never divide by a tiny number
                  fg = (rgb - (1 - a3) * bg) / a3
              fg = np.clip(fg, 0, 1)
              # solid pixels keep the photo exactly; only the soft edge is un-mixed
              out = np.where(solid[..., None], rgb, fg)
              faint = alpha < 0.2
              if faint.any() and solid.any():
                  near = nearest_colour(rgb, solid)
                  if near is not None:
                      out = np.where(faint[..., None], near, out)
              return (out * 255).round().astype(np.uint8)


          def front_box(img):
              """Rauf's rule (2026-09-21): find the front's LEFT and RIGHT end points
              and its TOP and BOTTOM, copy only that box, and throw everything
              outside it away (temples going back, table, surface, wall) BEFORE
              any cutting. A thin strip of background is kept outside the end
              points so the end pieces are never sliced; it becomes transparent
              anyway. Returns (left, top, right, bottom) or None (= no crop)."""
              try:
                  pad, (qx, qy) = pad_with_sheet(img)
                  m = largest_component(coarse_mask(pad))
                  H, W = m.shape
                  m = m[qy:H - qy, qx:W - qx]
                  ys, xs = np.where(m > 0.5)
                  if xs.size < 500:
                      return None
                  x0, x1, y0, y1 = int(xs.min()), int(xs.max()), int(ys.min()), int(ys.max())
                  w, h = img.size
                  if (x1 - x0) * (y1 - y0) > 0.9 * w * h:
                      return None                                   # nothing to throw away
                  mx = max(4, int(round(0.03 * (x1 - x0))))
                  my = max(4, int(round(0.06 * (y1 - y0))))
                  box = (max(0, x0 - mx), max(0, y0 - my), min(w, x1 + mx + 1), min(h, y1 + my + 1))
                  log("    front box: %s of %dx%d -- everything outside thrown away" % (box, w, h))
                  return box
              except Exception as e:
                  log("    front box skipped: %s" % str(e)[:120])
                  return None


          SAM_ON = True                    # MobileSAM helps find the glass (free, Apache licence)
          SAM_URL = "https://github.com/ChaoningZhang/MobileSAM/raw/master/weights/mobile_sam.pt"
          _SAM = [None]


          def sam_predictor():
              """MobileSAM, downloaded once and kept in the run cache. If anything is
              missing the robot simply carries on with its own lens finding."""
              if _SAM[0] is not None:
                  return _SAM[0] or None
              try:
                  import torch
                  from mobile_sam import sam_model_registry, SamPredictor
                  w = os.path.join(os.path.expanduser("~"), ".cache", "mobile_sam.pt")
                  if not os.path.exists(w):
                      os.makedirs(os.path.dirname(w), exist_ok=True)
                      log("    fetching MobileSAM once (about 40 MB)")
                      with open(w, "wb") as f:
                          f.write(download(SAM_URL))
                  sam = sam_model_registry["vit_t"](checkpoint=w)
                  sam.eval()
                  _SAM[0] = SamPredictor(sam)
                  log("    MobileSAM ready")
              except Exception as e:
                  _SAM[0] = False
                  log("    MobileSAM not available (%s) -- carrying on without it" % str(e)[:80])
              return _SAM[0] or None


          def sam_open_lenses(img, alpha, lens, band_px):
              """Ask MobileSAM for the glass, one lens at a time, prompted with a point
              inside the opening the robot already found.

              The answer may only ADD to what is already cleared, never take away, and
              never reach the band along the frame's outer edge. An answer that does
              not contain what we had, or is far larger, is ignored. So the worst case
              is today's result; the best case is a lens cleared properly on a rim the
              edge rules cannot read (a streaked crystal rim, a 4 px metal rim).
              Returns (new lens mask, note)."""
              from scipy import ndimage
              pred = sam_predictor()
              if pred is None:
                  return lens, ""
              lab, n = ndimage.label(lens)
              if n < 2:
                  return lens, "SAM: skipped, no pair to prompt with"
              sizes = ndimage.sum(lens, lab, range(1, n + 1))
              two = [int(i) + 1 for i in np.argsort(sizes)[-2:]]
              rgb = np.asarray(img.convert("RGB"))
              solid = alpha > 0.5
              outside = ndimage.binary_propagation(_border(~solid), mask=~solid)
              keep_off = ndimage.binary_dilation(outside, iterations=int(band_px))
              try:
                  pred.set_image(rgb)
              except Exception as e:
                  return lens, "SAM: could not read the picture (%s)" % str(e)[:60]
              out = lens.copy(); added = 0
              for i in two:
                  comp = lab == i
                  ys, xs = np.where(comp)
                  cy, cx = int(ys.mean()), int(xs.mean())
                  if not comp[cy, cx]:                      # centre of gravity outside the shape
                      cy, cx = int(ys[len(ys) // 2]), int(xs[len(xs) // 2])
                  try:
                      masks, scores, _ = pred.predict(
                          point_coords=np.array([[cx, cy]]), point_labels=np.array([1]), multimask_output=True)
                  except Exception as e:
                      return lens, "SAM: no answer (%s)" % str(e)[:60]
                  best = None
                  for m in masks:
                      m = m.astype(bool)
                      if (m & keep_off).any():
                          continue                          # reaches the frame's outer edge: not glass
                      inside = (m & comp).sum() / float(max(1, comp.sum()))
                      grow = m.sum() / float(max(1, comp.sum()))
                      if inside < 0.85 or grow > 1.6 or grow < 0.9:
                          continue                          # must contain what we had, and stay its size
                      if best is None or m.sum() > best.sum():
                          best = m
                  if best is not None:
                      gain = int((best & ~out).sum())
                      if gain > 0:
                          out |= best; added += gain
              return out, ("SAM: +%d px of glass" % added if added else "SAM: nothing to add")


          def photo_lens_openings(img, alpha, band_px, angled=False):
              """
              LENS STEP (2026-09-21). The AI often keeps part of the glass as frame:
              the wall or table seen through demo glass, an arm behind the lens, a
              printed logo. The steps after it only ever ENLARGE a clear patch the
              AI already made, so glass it kept stays. This step finds each lens
              opening from the PHOTO itself: the rim's inner edge is a clean closed
              line, so the areas inside it (split up by the arm and the wall line)
              are joined into one smooth lens shape per side and cleared.
              Safety: only transparency is ever added; nothing within band_px of the
              AI's outer outline is touched; tiny slivers (which sit INSIDE a clear
              rim) never count as lens; if the two lenses do not look like a pair,
              nothing at all is changed. Returns (lens_mask or None, note).
              """
              import cv2
              from scipy import ndimage
              rgb = np.asarray(img)
              H0, W0 = alpha.shape
              solid = alpha > 0.5
              ys, xs = np.where(solid)
              if xs.size == 0:
                  return None, "no frame in the mask"
              x0, x1 = max(0, xs.min() - 10), min(W0, xs.max() + 11)
              y0, y1 = max(0, ys.min() - 10), min(H0, ys.max() + 11)
              crop = rgb[y0:y1, x0:x1]
              H, W = crop.shape[:2]
              s = W / 1350.0
              not_frame = ~solid
              outside = ndimage.binary_propagation(_border(not_frame), mask=not_frame)
              # distance of every pixel from the real outside (background around the frame)
              d_out = ndimage.distance_transform_edt(~outside[y0:y1, x0:x1])                                   # sizes below were measured at 1350 px wide
              g = cv2.cvtColor(crop, cv2.COLOR_RGB2GRAY)
              e = cv2.Canny(cv2.GaussianBlur(g, (5, 5), 0), 30, 80)
              free = (cv2.dilate(e, np.ones((3, 3), np.uint8)) == 0).astype(np.uint8)
              n, lab, st, _ = cv2.connectedComponentsWithStats(free, 4)
              dist = cv2.distanceTransform(free, cv2.DIST_L2, 5)
              def border(i):
                  return st[i][0] == 0 or st[i][1] == 0 or st[i][0] + st[i][2] == W or st[i][1] + st[i][3] == H
              big_a, thin_a, deep = 3000 * s * s, 2000 * s * s, 30 * s
              rims = [i for i in range(1, n) if st[i][2] > 0.6 * W and not border(i)]
              how = "rim line"
              # ANGLED VIEWS (2026-09-26): at 45 degrees the bridge is not in the middle
              # of the frame, so the split between the lenses is taken from the two
              # biggest openings themselves; the rim line is only a fallback there.
              if rims and not angled:
                  rim = max(rims, key=lambda i: st[i][4])
                  mid = st[rim][0] + st[rim][2] / 2.0
              else:
                  # 2026-09-21: a solid black rim (Sizzler) or a thin metal rim (Lot)
                  # gives no rim band. The middle is then found from the two biggest
                  # lens-shaped openings standing side by side at the same height.
                  rim = -1
                  cands = sorted([i for i in range(1, n) if st[i][4] >= big_a and not border(i)
                                  and dist[lab == i].max() >= deep], key=lambda i: -st[i][4])[:2]
                  if len(cands) < 2:
                      if angled and rims:
                          rim = max(rims, key=lambda i: st[i][4]); mid = st[rim][0] + st[rim][2] / 2.0
                          cands = None
                      else:
                          return None, "no rim line and no two lens openings found"
                  if cands is not None:
                      a_, b_ = sorted(cands, key=lambda i: st[i][0])
                      why_not = ""
                      if st[a_][0] + st[a_][2] > st[b_][0]:
                          why_not = "the two biggest openings overlap sideways"
                      else:
                          ca = st[a_][1] + st[a_][3] / 2.0; cb = st[b_][1] + st[b_][3] / 2.0
                          if abs(ca - cb) > 0.25 * max(st[a_][3], st[b_][3]):
                              why_not = "the two biggest openings are not level"
                      if why_not:
                          if angled and rims:               # an angled view falls back to the rim line
                              rim = max(rims, key=lambda i: st[i][4]); mid = st[rim][0] + st[rim][2] / 2.0
                          else:
                              return None, why_not
                      else:
                          mid = (st[a_][0] + st[a_][2] + st[b_][0]) / 2.0
                          how = "two openings"
              def ok(i):
                  return i != rim and not border(i) and not (st[i][0] < mid < st[i][0] + st[i][2])
              sides = {"L": [], "R": []}
              for i in range(1, n):
                  if st[i][4] >= big_a and ok(i) and dist[lab == i].max() >= deep:
                      sides["L" if st[i][0] + st[i][2] < mid else "R"].append(i)
              if not sides["L"] or not sides["R"]:
                  return None, "could not find both lenses"
              lens = np.zeros((H, W), np.uint8)
              areas = []
              ones_ = {}
              reach = max(3, int(round(6 * s)))     # a thin line (wall line, lens edge), never a rim
              # ENTIRE demo area (Rauf 2026-09-21: "the entire demo area has to be
              # transparent"). When the rim is one closed band in the photo (its band
              # plus the rim-pattern patches against the frame's outer edge), every
              # glass piece it encloses belongs to the lens -- e.g. a hinge corner cut
              # off by an arm seen through the glass. Only real pieces of glass join
              # (not thin strips like the rim's golden inner edge); the lens outline is
              # still drawn from the pieces, so the rim is never thinned.
              inner = None
              if rim > 0:
                  outer_ids = [i for i in range(1, n) if border(i)]
                  outer_m = cv2.dilate(np.isin(lab, outer_ids).astype(np.uint8),
                                       np.ones((2 * reach + 1, 2 * reach + 1), np.uint8)) > 0
                  rim_m = lab == rim
                  for i in range(1, n):
                      if i == rim or border(i) or st[i][4] < 50:
                          continue
                      if (outer_m & (lab == i)).any():
                          rim_m |= lab == i
                  band = cv2.morphologyEx(rim_m.astype(np.uint8), cv2.MORPH_CLOSE, np.ones((9, 9), np.uint8))
                  reach_out = ndimage.binary_propagation(_border(band == 0), mask=(band == 0))
                  inner = (band == 0) & ~reach_out
                  inner_lab, _ = ndimage.label(inner)
              glass_a, glass_t = 300 * s * s, 6.5 * s
              for key in ("L", "R"):
                  main = max(sides[key], key=lambda i: st[i][4])
                  ids = [main]
                  cand = [i for i in range(1, n) if i != main and st[i][4] >= thin_a and ok(i)
                          and ((st[i][0] + st[i][2] < mid) == (key == "L"))]
                  grown = True
                  while grown:
                      grown = False
                      near = cv2.dilate(np.isin(lab, ids).astype(np.uint8), np.ones((2 * reach + 1, 2 * reach + 1), np.uint8)) > 0
                      for i in list(cand):
                          if (near & (lab == i)).any():
                              ids.append(i); cand.remove(i); grown = True
                  bx = (min(st[i][0] for i in ids) - 3, min(st[i][1] for i in ids) - 3,
                        max(st[i][0] + st[i][2] for i in ids) + 3, max(st[i][1] + st[i][3] for i in ids) + 3)
                  # a lens corner cut off by an arm seen through the glass (the hinge
                  # corner) does not touch the lens, but lies fully INSIDE the lens area:
                  # it joins too. Anything reaching outside the lens area (e.g. the patch
                  # between an arm and the top rim above the frame) never joins.
                  for i in list(cand):
                      x, y, w, h, a_ = st[i]
                      if x >= bx[0] and y >= bx[1] and x + w <= bx[2] and y + h <= bx[3]:
                          ids.append(i); cand.remove(i)
                  main_in, zone_ok, zone = [], False, None
                  if inner is not None:
                      main_in = [h for h in np.unique(inner_lab[lab == main]) if h > 0]
                      if main_in:
                          zone = inner_lab == max(main_in, key=lambda h: int(((inner_lab == h) & (lab == main)).sum()))
                          zone_ok = zone.sum() <= 1.35 * float((lab == main).sum() + sum(st[i][4] for i in ids if i != main))
                          if zone_ok:
                              for i in range(1, n):
                                  if i in ids or i == rim or border(i) or st[i][4] < glass_a:
                                      continue
                                  comp = lab == i
                                  if (comp & zone).sum() >= 0.95 * comp.sum() and dist[comp].max() >= glass_t:
                                      ids.append(i)
                  zone_lens = None
                  if inner is not None and main_in and zone_ok:
                      zone_lens = zone
                  one = np.zeros((H, W), np.uint8)
                  pieces = np.isin(lab, ids)
                  hull = cv2.convexHull(cv2.findNonZero(pieces.astype(np.uint8)))
                  cv2.fillPoly(one, [hull], 1)
                  # the rounding (hull) is for arms and arm tips coming in from the OUTER
                  # side; on the NOSE side (the quarter of the lens next to the bridge)
                  # only what the photo shows open is cleared, so nose-pad arms stay
                  lx0_, lx1_ = bx[0] + 3, bx[2] - 3
                  q = int(round(0.25 * (lx1_ - lx0_)))
                  nose = np.zeros((H, W), bool)
                  if key == "L":
                      nose[:, max(0, lx1_ - q):] = True
                  else:
                      nose[:, :min(W, lx0_ + q)] = True
                  # keep only what is THICKER than a line there (pads, pad arms);
                  # a thin line (the wall line, a lens edge) is still cleared
                  gaps = ((one > 0) & nose & ~pieces).astype(np.uint8)
                  k_ = np.ones((2 * reach + 1, 2 * reach + 1), np.uint8)
                  thick = cv2.dilate(cv2.erode(gaps, k_), k_) > 0
                  one[thick] = 0
                  if zone is not None and zone_ok:
                      # ENTIRE demo area, last step: the glass left in a corner between the
                      # lens and the rim's inner edge. Grow the lens into the enclosed area
                      # only over pixels whose colour is closer to this lens's own glass
                      # than to this rim's own colour (the golden edge, tortoise, black).
                      lab_c = cv2.cvtColor(crop, cv2.COLOR_RGB2LAB).astype(np.float32)
                      glass_px = lab_c[(one > 0) & ~(cv2.dilate(pieces.astype(np.uint8) * 0 + (one == 0).astype(np.uint8),
                                                                  np.ones((7, 7), np.uint8)) > 0)]
                      rim_ring = (cv2.dilate(one, np.ones((2 * reach + 9, 2 * reach + 9), np.uint8)) > 0) & (one == 0) & rim_m
                      rim_px = lab_c[rim_ring]
                      if len(glass_px) > 500 and len(rim_px) > 200:
                          g_mu = np.median(glass_px, axis=0); r_mu = np.median(rim_px, axis=0)
                          d_g = np.linalg.norm(lab_c - g_mu, axis=2); d_r = np.linalg.norm(lab_c - r_mu, axis=2)
                          looks_glass = (d_g < 0.6 * d_r) & zone
                          grow_px = 0
                          for _ in range(int(3 * reach)):
                              ring_ = (cv2.dilate(one, np.ones((3, 3), np.uint8)) > 0) & (one == 0) & looks_glass
                              if not ring_.any():
                                  break
                              one[ring_] = 1; grow_px += int(ring_.sum())
                  ones_[key] = one.copy()
                  areas.append(int(one.sum()))
                  lens |= one
              # PAIR RULE (2026-09-21, VG-1002: the left "lens" took in part of the
              # see-through left rim). The two lenses of a frame are the same size. If
              # one is more than 7% bigger, it is trimmed to the MIRROR image of the
              # other (a few pixels of tolerance): rim it took is given back. When in
              # doubt a sliver of glass stays -- never rim.
              if not angled and max(areas) > 0 and min(areas) < 0.93 * max(areas) and ones_.get("L") is not None and ones_.get("R") is not None:
                  big_k, small_k = ("L", "R") if areas[0] > areas[1] else ("R", "L")
                  mx = np.clip(np.round(2 * mid - np.arange(W)).astype(int), 0, W - 1)
                  tp = max(2, int(round(3 * s)))          # 3 px: rim always given back
                  tol = np.ones((2 * tp + 1, 2 * tp + 1), np.uint8)
                  allowed = cv2.dilate(ones_[small_k][:, mx], tol) > 0
                  before = int(ones_[big_k].sum())
                  trimmed = (ones_[big_k] > 0) & allowed
                  lens[(ones_[big_k] > 0) & ~allowed] = 0
                  areas[0 if big_k == "L" else 1] = int(trimmed.sum())
                  how += ", %s lens trimmed to match the other (%d -> %d px)" % (
                      "left" if big_k == "L" else "right", before, int(trimmed.sum()))
              box_area = float(H * W)
              if not angled and min(areas) < 0.85 * max(areas):
                  return None, "the two lenses are not a pair even after trimming (%d vs %d px)" % tuple(areas)
              if min(areas) < (0.03 if angled else 0.06) * box_area or max(areas) > 0.45 * box_area:
                  return None, "lens size out of range (%.0f%%, %.0f%% of the frame box)" % (
                      100.0 * areas[0] / box_area, 100.0 * areas[1] / box_area)
              lens = cv2.erode(lens, np.ones((5, 5), np.uint8)).astype(bool)   # 2 px off the rim's inner edge
              full0 = np.zeros((H0, W0), bool)
              full0[y0:y1, x0:x1] = lens
              if SAM_ON:
                  full0, snote = sam_open_lenses(img, alpha, full0, band_px)
                  if snote:
                      how += ", " + snote
                  lens = full0[y0:y1, x0:x1]
              full = np.zeros((H0, W0), bool)
              full[y0:y1, x0:x1] = lens
              guard = ndimage.binary_dilation(outside, iterations=int(band_px))
              full &= ~guard                                   # never near the frame's outer outline
              return full, "lenses %d + %d px (found by %s)" % (areas[0], areas[1], how)


          def cut(photo_bytes, front=True, rim_kind="", half_rim_hint=None, colour_bytes=None,
                  front_crop=False, lens_fix=False, size=None, angled=False):
              """One photo in, one transparent PNG (and its numbers) out.
              rim_kind comes from the rim type typed in admin (see rim_kind_of).
              rim_kind == "" is the OLD method (the one that cut Sizzler well on
              2026-09-19): every step added since then is skipped, so the result
              is the same as that robot's. Only frames in NEW_METHOD_IDS get a
              rim_kind (the thin-metal method made for Lot)."""
              if half_rim_hint is None:
                  half_rim_hint = rim_kind in ("half", "rimless")
              LENS_MODE[0] = bool(front and lens_fix)
              import cv2
              img = Image.open(io.BytesIO(photo_bytes)).convert("RGB")
              if max(img.size) > 1600:
                  s = 1600.0 / max(img.size)
                  img = img.resize((int(img.width * s), int(img.height * s)), Image.LANCZOS)
              colour_img = None
              if colour_bytes:
                  # SHAPE from the photo above (unchanged); COLOURS from the plain
                  # photo, which has no sharpening, so no white lines on the rim.
                  # Same Cloudinary crop, so every pixel lines up; if the size
                  # differs at all, the normal colours are kept.
                  ci = Image.open(io.BytesIO(colour_bytes)).convert("RGB")
                  if max(ci.size) > 1600:
                      s2 = 1600.0 / max(ci.size)
                      ci = ci.resize((int(ci.width * s2), int(ci.height * s2)), Image.LANCZOS)
                  if ci.size == img.size:
                      colour_img = ci
                      log("    colours taken from the plain photo (shape unchanged)")
                  else:
                      log("    plain photo size %s differs from %s: normal colours kept" % (ci.size, img.size))
              off_x = off_y = 0
              if front_crop:
                  box = front_box(img)
                  if box:
                      img = img.crop(box)
                      if colour_img is not None:
                          colour_img = colour_img.crop(box)
                      off_x, off_y = box[0], box[1]
              img, (px, py) = pad_with_sheet(img)                   # margin for the model

              m = coarse_mask(img)                                  # step 2
              m = largest_component(m)
              band_px = max(6, min(24, int(round(12 * max(img.size) / 1440.0))))
              band_tri = band_px
              if rim_kind == "full":
                  # A thin metal rim is only ~12 px wide here. With the usual band
                  # (13 px eaten from each side to find "surely frame") no part of
                  # the rim is sure, the whole rim is left to the matting to guess,
                  # and next to the shiny sheet it guesses wrong. For a full rim the
                  # band follows the rim's own thickness, read from the model's
                  # first mask: about a third of it, so the rim keeps a solid core.
                  import cv2 as _cv2
                  # measured on the DARK metal inside the model's mask (the model
                  # often keeps the glass solid, so its mask alone would read the
                  # whole lens as "thick"); a light or crystal frame gives too few
                  # dark pixels and keeps the usual band
                  _rgb = np.asarray(img).astype(np.float32)
                  _lum = _rgb[..., 0] * 0.299 + _rgb[..., 1] * 0.587 + _rgb[..., 2] * 0.114
                  _sheet_l = float(np.dot(sheet_colour(np.asarray(img)), [0.299, 0.587, 0.114]))
                  _metal = (m > 0.5) & (_lum < 0.5 * _sheet_l)
                  if _metal.sum() < 0.15 * max(1, int((m > 0.5).sum())):
                      _metal = np.zeros_like(_metal)
                  _dt = _cv2.distanceTransform(_metal.astype(np.uint8), _cv2.DIST_L2, 5)
                  _ridge = (_dt > 0) & (_dt >= _cv2.dilate(_dt, np.ones((3, 3), np.uint8)))
                  if _ridge.any():
                      _thick = 2.0 * float(np.median(_dt[_ridge]))
                      _b = int(max(2, min(band_px, round(0.3 * _thick))))
                      log("    full rim: rim about %.0f px thick, edge band %d px (was %d)" % (_thick, _b, band_px))
                      band_tri = _b
              tri = make_trimap(m, band_tri)                        # step 3 (only the trimap uses the rim-sized band)
              a = matte(img, tri)                                   # step 4
              a = tighten_edge(a)                                   # step 4b: a 1-2 px edge, not a glow
              a = heal_rim(a)                                       # step 4c: a highlight slit inside the rim is rim
              if rim_kind:
                  a = firm_rim(a)                                   # new method only: a speckled metal bar/rim is made solid inside
              # HALF-RIM: metal on top only, the demo lens on a thread below. No closed
              # hole, so trace the lens edge from the photograph instead; its ring is
              # made solid for the moment so every rule below sees a proper opening.
              half_ring = None; half_regions = []; tint_mask = None; edge_mask = None
              LAST_SOURCE[0] = None
              if front and rim_kind == "full":
                  # FULL RIM (typed in admin): never the half-rim path. If the
                  # model kept the glass solid, the traced outline is used only to
                  # find the openings; the rim itself is left exactly as cut.
                  h0, _ = lens_holes(a)
                  h_lab, h_n = ndimage_label_count(h0)
                  log("    rim type: full rim (%d clean lens holes)" % h_n)
                  if h_n < 2:
                      half_regions = half_rim_lenses(img, a)
                      if half_regions:
                          a = open_full_rim_lenses(img, a, half_regions)
              elif front:
                  h0, _ = lens_holes(a)
                  h_lab, h_n = ndimage_label_count(h0)
                  log("    rim type: %s (%d clean lens holes)" % (rim_kind or "not set", h_n))
                  # OLD METHOD (rim_kind == ""): the half-rim tracing runs ONLY when the
                  # rim text says half rim. Sizzler's good cut (run 68, commit 7aafc1f)
                  # had no half-rim step at all; a later robot also ran it whenever the
                  # model kept the glass solid (h_n < 2), and on a full-rim frame that
                  # traced the wrong outline and spoiled the corners and hinges.
                  if half_rim_hint or (rim_kind and h_n < 2):
                      half_regions = half_rim_lenses(img, a)
                      if half_regions:
                          a, half_ring = apply_half_rim(img, a, half_regions)
                          if rim_kind:
                              a = firm_rim(a)                      # new method only
              lens_ran = False
              lens_mask = None
              LAST_VIEW_GLASS[0] = None
              if (front and lens_fix) or angled:
                  # step 5z (LENS STEP): lens openings found from the photo's own
                  # edges and cleared. Only frames in LENS_FIX_IDS, or a test-lens run.
                  # 2026-09-26: also on a 45-degree view, in angled mode.
                  try:
                      lz, lnote = photo_lens_openings(img, a, band_px, angled=angled)
                  except Exception as ex:
                      lz, lnote = None, "error: %s" % str(ex)[:120]
                  if lz is not None:
                      lens_ran = True
                      lens_mask = lz
                      was = int(((a > 0.5) & lz).sum())
                      a = np.where(lz, np.float32(0.0), a).astype(np.float32)
                      log("    %slens step: %s; %d pixels of glass cleared" % ("angled " if angled else "", lnote, was))
                      LAST_VIEW_GLASS[0] = True
                  else:
                      log("    %slens step skipped, nothing changed: %s" % ("angled " if angled else "", lnote))
                      LAST_VIEW_GLASS[0] = False
              a_before_glass = a.copy()
              holes, _ = lens_holes(a)
              if not holes.any():
                  # the model kept the lenses solid (common for clear glass):
                  # clear them by colour where the sheet shows through
                  a, _ = clear_glass_by_colour(img, a, band_px)     # step 5a
              a = fill_lens_hulls(a, band_px)                       # step 5b: temple/hinge through the glass
              a = clear_inner_lens(a)                               # step 5c: tinted glass, leftovers
              if not front:
                  # ANGLED AND SIDE VIEWS (2026-09-26, shop): at 45 degrees the near temple
                  # is close to the camera, thick enough to count as "inside the frame",
                  # and its shiny inner face reflects the white box -- so the glass steps
                  # took it for glass and cut a slot along the arm. On a view, a removed
                  # piece must be LENS-SHAPED (tall and roundish); a long thin strip is
                  # frame and goes back.
                  a, kept_glass = only_lens_shaped(a_before_glass, a)
                  if angled and kept_glass and not LAST_VIEW_GLASS[0]:
                      LAST_VIEW_GLASS[0] = True                     # the glass was cleared by colour, lens-shaped
              if front:
                  # step 6a: the shop shoots with the arms OPEN, so arms rising above the
                  # front are removed here (v2, 2026-09-18: the first version also cut
                  # hinge blocks and the top of the bridge; this one never examines the
                  # bridge and keeps anything seated on the front's top edge).
                  if LENS_MODE[0]:
                      # 2026-09-21, Rauf: the arm rules guessed wrong and cut hinges and
                      # corners. In lens mode they never cut: the arm rule only MEASURES,
                      # and arms clearly showing above the frame put a re-shoot note on
                      # the frame instead (the photo is the problem, not the frame).
                      _, arms_above = remove_arms_above(a.copy(), img)
                  else:
                      a, arms_above = remove_arms_above(a, img)
                  arms_side = 0.0
                  if half_ring is None and LENS_MODE[0]:
                      # 2026-09-21, Rauf: this step cut VG-1002's short hinge tabs. In lens
                      # mode it never cuts: short tabs are the end pieces; a long thin
                      # strip beyond an end is an arm -> the photo is rejected below
                      arms_side = side_arm_span(a)
                  elif half_ring is None:
                      a = cut_end_to_end(a)                         # step 6b: arms beyond the ends
                  # (a half-rim's end pieces are thin metal and would be mistaken for arm)
                  if not LENS_MODE[0]:
                      a = trim_narrow_above(a, globals().get("LAST_RIM_T", 24.0))   # step 6b2: narrow stubs above the front
                      a = mirror_top(a, globals().get("LAST_RIM_T", 24.0))          # step 6b3: a flat arm along one brow, by symmetry
                      a = smooth_top_steps(a, globals().get("LAST_RIM_T", 24.0))    # step 6b4: a symmetric arm sliver, by its step
                  a = clean_ghosts(a)                                            # step 6b5: no floating soft outlines
                  a = clear_behind_glass(a)                         # step 6c: nothing seen through the lenses
                  a = trim_ends(a)                                  # step 6d: half a millimetre off each end
              if LENS_MODE[0]:
                  _n_before = int((a > 0.5).sum())
                  a = strip_sheet_ring(img, a, lens_mask=lens_mask, local=True)   # step 7 (lens mode): judged against the wall colour at each place
                  log("    sheet-ring peel (local wall colour): %d px taken off the edge" % (_n_before - int((a > 0.5).sum())))
              else:
                  a = strip_sheet_ring(img, a)                      # step 7: the sheet's shadow ring next to the rim (old frames: unchanged)
              if front and rim_kind == "full":
                  a = clear_sheet_at_ends(img, a)                   # step 7b: sheet wedge between end piece and rim
              if front and rim_kind:
                  # NEW METHOD ONLY (the old method never dropped loose pieces).
                  # any front frame: what is not joined to the main frame -- an arm
                  # tip below the glass, a fleck along the rim's edge -- goes. This
                  # only drops pieces well apart from the frame; it never touches
                  # the frame's own outline, so the rim is never thinned.
                  before_ks = int((a > 0.5).sum())
                  a = keep_main_solid(a)
                  after_ks = int((a > 0.5).sum())
                  if half_ring is not None and half_rim_hint:
                      # trim_whiskers erodes anything thinner than its disk -- right
                      # for a genuine half-rim's demo-lens thread, too risky for a
                      # full-rim frame that only fell into this path because its
                      # first pass found fewer than 2 clean lens holes: on a thin
                      # metal frame it can sever a real hinge tab from the front,
                      # stranding it as a floating fleck. Only run it when the
                      # product's own rim type says this frame really is half-rim.
                      a = trim_whiskers(a)                          # a thread or cord a few pixels wide
                      after_tw1 = int((a > 0.5).sum())
                      log("    half-rim cleanup: solid %d -> keep_main_solid %d -> trim %d"
                          % (before_ks, after_ks, after_tw1))
                  else:
                      log("    full-rim cleanup: solid %d -> keep_main_solid %d"
                          % (before_ks, after_ks))
              if front and rim_kind == "full":
                  regs = half_regions
                  if len(regs) < 2:
                      from scipy import ndimage as _nd
                      hh, _ = lens_holes(a)
                      lab_h, n_h = _nd.label(hh)
                      if n_h >= 2:
                          sz = _nd.sum(hh, lab_h, range(1, n_h + 1))
                          order = np.argsort(sz)[::-1][:2]
                          regs = [lab_h == (i + 1) for i in order]
                  if len(regs) >= 2:
                      a, finfo = shape_full_rim_front(img, a, regs)
                      log("    full-rim front: %s" % (finfo,))
              if half_ring is not None:
                  # the demo lens edge: a thin line, as a real one shows -- painted bright
                  # into the finished pixels at the very end (25 Sep), because at a faint
                  # sheet grey it could not be seen on a face
                  edge_mask = half_ring & (a > 0.5)
                  a = np.where(edge_mask, np.float32(LENS_EDGE), a).astype(np.float32)
                  log("    lens edge line drawn (half-rim / rimless): %d px at %d%%" % (int(edge_mask.sum()), int(LENS_EDGE * 100)))

              # A LITTLE TINT ON THE DEMO, HALF-RIM AND RIMLESS ONLY (2026-09-24, shop).
              # With nothing below the lens, a fully transparent demo leaves only a bar
              # floating on the customer's face and the lens shape cannot be seen. A
              # real half-rim shows a faint sheen, so the robot leaves one: the glass
              # stays see-through, just not invisible. Full-rim frames are untouched --
              # there the rim shows the shape by itself.
              if (half_ring is not None or "rimless" in str(rim_kind).lower() or half_rim_hint) and half_regions:
                  try:
                      _tint = np.zeros(a.shape, bool)
                      for _rg in half_regions:
                          _tint |= _rg
                      _tint &= (a < 0.2)                       # only where the demo is clear
                      if _tint.any():
                          tint_mask = _tint                    # painted onto the finished pixels at the very end
                          log("    a little tint left on the demo (half-rim / rimless): %d px" % int(_tint.sum()))
                  except Exception as _ex:
                      log("    the demo tint could not be added: %s" % str(_ex)[:70])

              # the margin comes off again
              H, W = a.shape
              a = a[py:H - py, px:W - px]
              img = img.crop((px, py, W - px, H - py))
              if lens_mask is not None and lens_mask.shape != a.shape:
                  lens_mask = lens_mask[py:H - py, px:W - px]    # the glass check measures the same picture
              if tint_mask is not None and tint_mask.shape != a.shape:
                  tint_mask = tint_mask[py:H - py, px:W - px]
              if edge_mask is not None and edge_mask.shape != a.shape:
                  edge_mask = edge_mask[py:H - py, px:W - px]

              # LEVELLING (2026-09-23, Rauf: every frame on the shelf must look level,
              # the way an optical company's pictures do). They fix the camera on a
              # stand and then straighten each picture; we cannot fix the camera, so
              # the robot straightens the cut-out instead: it turns it until the line
              # between the two lens centres is level. The shelf lines up, and the
              # try-on stops drawing a tilted frame on a customer's face.
              if front:
                  try:
                      _m0 = measurements(a)
                      _e0 = _m0.get("lenses") or []
                      if len(_e0) >= 2:
                          _dx = float(_e0[1]["centreX"]) - float(_e0[0]["centreX"])
                          _dy = float(_e0[1]["centreY"]) - float(_e0[0]["centreY"])
                          _tilt = math.degrees(math.atan2(_dy, _dx)) if _dx else 0.0
                          if 0.25 <= abs(_tilt) <= 12.0:
                              _rgb = np.asarray(img.convert("RGB")).astype(np.float32)
                              _rot = lambda arr, fill: np.asarray(Image.fromarray(arr).rotate(
                                  _tilt, resample=Image.BICUBIC, expand=True, fillcolor=fill))
                              a = _rot((a * 255).astype(np.uint8), 0).astype(np.float32) / 255.0
                              img = Image.fromarray(_rot(_rgb.astype(np.uint8), (255, 255, 255)))
                              if lens_mask is not None:
                                  lens_mask = _rot(lens_mask.astype(np.uint8) * 255, 0) > 127
                              if tint_mask is not None:
                                  tint_mask = _rot(tint_mask.astype(np.uint8) * 255, 0) > 127
                              if edge_mask is not None:
                                  edge_mask = _rot(edge_mask.astype(np.uint8) * 255, 0) > 127
                              log("    levelled: the frame was %.1f degrees off, turned straight" % _tilt)
                  except Exception as _ex:
                      log("    levelling could not run: %s" % str(_ex)[:80])

              if half_regions:
                  half_regions = [rg[py:H - py, px:W - px] for rg in half_regions]
                  nums = lens_measurements(a, half_regions, half_rim=half_ring is not None)
              else:
                  nums = measurements(a)
              nums["reading"] = read_frame(img, a) if front else {}
              if (off_x or off_y) and not rim_kind:
                  for e in nums.get("lenses") or []:              # positions as in the whole photo
                      e["centreX"] = float(e["centreX"] + off_x); e["centreY"] = float(e["centreY"] + off_y)
              if front and not nums.get("reject"):
                  # THE SIZE THE CUSTOMER WILL SEE (2026-09-23). The try-on works the
                  # frame's width out from the lens centres in this cut-out and the
                  # lens + bridge the shop typed. If the cut is wrong, the frame is
                  # drawn the wrong size on a face and nothing else here would notice.
                  try:
                      _e = nums.get("lenses") or []
                      _sz = size or {}
                      _lens_mm = float(_sz.get("lens") or 0); _bridge_mm = float(_sz.get("bridge") or 0)
                      if len(_e) >= 2 and _lens_mm > 20 and _bridge_mm > 8:
                          _gap = abs(float(_e[1]["centreX"]) - float(_e[0]["centreX"]))
                          _ys2, _xs2 = np.where(a > 0.5)
                          _front_px = float(_xs2.max() - _xs2.min() + 1)
                          if _gap > 10:
                              _mm_px = (_lens_mm + _bridge_mm) / _gap
                              _front_mm = _front_px * _mm_px
                              # 2026-09-23: 11 mm was too little. Measured on the shop's
                              # own frames the cut-outs come out about 8-10 mm wider, so
                              # both end pieces are nearer 19 mm together.
                              _expect = _lens_mm * 2 + _bridge_mm + 19
                              _off = abs(_front_mm - _expect) / max(1.0, _expect)
                              log("    size check: frame works out at %.0f mm (typed %.0f + %.0f -> about %.0f mm expected)"
                                  % (_front_mm, _lens_mm, _bridge_mm, _expect))
                              if _off > SIZE_OFF:
                                  nums["reject"] = SIZE_REASON
                                  log("    SIZE CHECK: %.0f%% away from the typed numbers -> kept off the website" % (_off * 100))
                  except Exception as _ex:
                      log("    size check could not run: %s" % str(_ex)[:80])
              if front and lens_mask is not None:
                  # THE DEMO MUST BE TRANSPARENT (2026-09-23, Rauf's rule). Steps after
                  # the lens step can close part of an opening again, and the try-on
                  # then reads the lens in the wrong place (Novel sat 8mm low because
                  # only the half above the join line had cleared). Measure what is
                  # left inside the openings; clear it once more with the same mask,
                  # which has already passed every rim check; refuse if it is still
                  # not clear.
                  left = float(((a > 0.5) & lens_mask).sum()) / max(1.0, float(lens_mask.sum()))
                  if left > GLASS_LEFT:
                      a = np.where(lens_mask, np.float32(0.0), a).astype(np.float32)
                      left2 = float(((a > 0.5) & lens_mask).sum()) / max(1.0, float(lens_mask.sum()))
                      log("    glass check: %.1f%% of the lens was solid again -> cleared once more (now %.1f%%)"
                          % (left * 100, left2 * 100))
                      left = left2
                  if left > GLASS_LEFT:
                      nums["reject"] = GLASS_REASON
                      log("    GLASS CHECK: %.1f%% of the lens is still solid -> kept off the website" % (left * 100))
                  else:
                      log("    glass check: the demo is clear (%.1f%% left)" % (left * 100))
              if front and lens_mask is None and not nums.get("reject") and not half_rim_hint and half_ring is None:
                  # the lens step could not run: then the finished frame must still
                  # enclose two openings, or the demo lenses are solid (the "999"
                  # aviator went on the face with its lenses opaque)
                  from scipy import ndimage as _nd
                  _h, _ = lens_holes(a)
                  _lab, _n = _nd.label(_h)
                  _big = sorted([int(s) for s in _nd.sum(_h, _lab, range(1, _n + 1))], reverse=True) if _n else []
                  _need = 0.02 * float((a > 0.5).sum())
                  if len(_big) < 2 or _big[1] < _need:
                      nums["reject"] = GLASS_REASON
                      log("    GLASS CHECK: the demo lenses did not clear (openings found: %d) -> kept off the website"
                          % len([b for b in _big if b >= _need]))
                  else:
                      log("    glass check: two openings found in the finished cut")
              if front:
                  # SIDEWAYS PHOTO (2026-09-22, the "I spec" frame came out standing on
                  # end, one lens above the other: the try-on then reads the distance
                  # between lens centres as tiny and draws the frame huge on the face).
                  # A frame is always wider than it is tall.
                  _ys, _xs = np.where(a > 0.5)
                  if _xs.size > 100:
                      _w, _h = _xs.max() - _xs.min() + 1, _ys.max() - _ys.min() + 1
                      if _h > _w:
                          nums["reject"] = SIDEWAYS_REASON
                          log("    the frame is SIDEWAYS in the photo (%d wide x %d tall) -> REJECTED, re-shoot" % (_w, _h))
                      else:
                          # TOO FAR AWAY (2026-09-22, Rauf: set how far the camera stands
                          # from the frame). Measured against the photo itself, without
                          # the sheet margin the robot adds. A thin metal rim in a small
                          # picture is only a few pixels wide and cannot be cut cleanly.
                          _pw = max(1, a.shape[1])      # the picture as it is here: the sheet margin is already off
                          _fill = _w / float(_pw)
                          if _fill > 0.99:
                              # 2026-09-23 (the "999" aviator read 137%): the frame runs
                              # past the edge of the photo, so its ends are simply not
                              # there -- no cut can be right, and the rim check would
                              # only catch it afterwards.
                              nums["reject"] = CUT_OFF_REASON
                              log("    the frame fills %d%% of the photo's width: it is CUT OFF at the edge -> REJECTED" % (_fill * 100))
                          elif _fill < FILL_MIN:
                              nums["reject"] = FAR_REASON
                              log("    the frame fills only %d%% of the photo's width -> REJECTED, take it closer" % (_fill * 100))
                          else:
                              log("    the frame fills %d%% of the photo's width" % (_fill * 100))
                          # WHERE THE FRAME SITS IN THE PHOTO (2026-09-22, Rauf: every
                          # frame must look the same size on the shop page, whatever
                          # distance it was shot from). The shop page zooms each card
                          # photo by these numbers, so distance stops mattering.
                          nums["photoFrac"] = round(_fill, 4)
                          nums["photoCx"] = round(((_xs.min() + _xs.max()) / 2.0 - px) / float(_pw), 4)
                          nums["photoCy"] = round(((_ys.min() + _ys.max()) / 2.0 - py) / float(max(1, a.shape[0] - 2 * py)), 4)
              if front and not nums.get("reject") and half_ring is None and not half_rim_hint:
                  # (half-rim and rimless frames have no rim below the lens by design, so
                  #  comparing rim thickness around the lens means nothing there -- 25 Sep,
                  #  Eyeconic was held off for a "6% bottom rim" it never had)
                  try:
                      rb = rim_balance(a)
                  except Exception as ex:
                      rb = None
                      log("    rim check could not run: %s" % str(ex)[:100])
                  try:
                      _bl = rim_bottom_loss(a) if (rb is not None and rb[0] >= RIM_MIN) else None
                  except Exception:
                      _bl = None
                  if _bl is not None and _bl < 0.5:
                      log("    rim check: the rim below the lenses is only %d%% as thick as the rest of the ring (both sides alike)" % int(_bl * 100))
                  if lens_ran and rim_kind != "half" and rim_kind != "rimless" and (rb is None or rb[0] < RIM_MIN or (_bl is not None and _bl < 0.5)):
                      # CLOSE THE RING (30 Sep): the rim came out broken -- on a full-rim
                      # frame that is almost always a clear/gradient lower rim the matte
                      # took for background. Rebuild it from the original photo, then
                      # judge the rim again.
                      try:
                          _ci = colour_img if (colour_img is not None and colour_img.size == img.size) else img
                          a2, _notes, _band = close_full_rim_ring(a, np.asarray(_ci.convert("RGB")), lens_mask=(lens_mask if (lens_mask is not None and lens_mask.shape == a.shape) else None))
                          for _n in _notes:
                              log("    " + _n)
                          if a2 is not a:
                              a = a2
                              nums["ringClosed"] = True
                              # the gate judges the picture that is really SAVED (alpha > 0.5); the number with
                              # the repaired pixels counted as solid is only logged, to show any difference
                              rb = rim_balance(a)
                              _rb_solid = rim_balance(np.maximum(a, _band.astype(a.dtype))) if _band is not None else rb
                              _f = lambda r_: "BROKEN" if r_ is None else "%d%%" % int(r_[0] * 100)
                              log("    rim check after closing the ring: saved picture %s | repaired pixels counted as solid %s%s" % (
                                  _f(rb), _f(_rb_solid), "" if _f(rb) == _f(_rb_solid) else "   <-- DIFFERENT: the decision uses the saved picture"))
                              # COSMETIC FINISH (after the decision numbers above are taken): take away the pale bits of wall and
                              # floor that the cut kept beyond the rim's dark outer edge. Undone if it would open the ring.
                              try:
                                  _lm_t = lens_mask if (lens_mask is not None and lens_mask.shape == a.shape) else None
                                  if _lm_t is not None and rb is not None:
                                      _rem = _trim_pale_outside(a, np.asarray(_ci.convert("RGB")), _lm_t)
                                      if int(_rem.sum()) > 0:
                                          _a_t = a.copy(); _a_t[_rem] = 0
                                          _rb_t = rim_balance(_a_t)
                                          if _rb_t is not None:
                                              a = _a_t
                                              log("    trimmed %d px of pale wall/floor beyond the rim's dark outer edge (ring still closed; balance after the trim %d%%, shown only, not used for the decision)" % (int(_rem.sum()), int(_rb_t[0] * 100)))
                                          else:
                                              log("    trim of pale bits skipped: it would have opened the ring")
                              except Exception as _ex:
                                  log("    trim of pale bits could not run (%s)" % str(_ex)[:60])
                      except Exception as ex:
                          log("    close the ring could not run: %s" % str(ex)[:100])
                  if rb is None and lens_ran:
                      # the lens step cleared two lenses, but the finished frame no longer
                      # encloses two: a rim has been cut right through
                      nums["reject"] = ("Robot check: the rim came out broken (a lens is open to the outside). "
                                        "Not published -- needs a look, the photo is not the problem.")
                      nums["rimBad"] = True     # so the second try can see it even if a later check changes the reason
                      log("    RIM CHECK: the rim is broken through -> kept off the website")
                  if rb is not None and rb[1] is not None:
                      where_ = {0: "bridge side", 90: "top", 180: "outer side", 270: "bottom"}   # as seen on the left lens
                      dname = min(where_, key=lambda d: min(abs(rb[1] - d), 360 - abs(rb[1] - d)))
                      if rb[0] < RIM_MIN:
                          nums["reject"] = ("Robot check: the rim came out thinner on the %s lens (%s, %d%% of the "
                                            "other side). Not published -- needs a look, the photo is not the problem."
                                            % (rb[2], where_[dname], int(rb[0] * 100)))
                          nums["rimBad"] = True
                          log("    RIM CHECK: %s rim only %d%% of the other side near the %s -> kept off the website"
                              % (rb[2], int(rb[0] * 100), where_[dname]))
                      else:
                          log("    RIM CHECK: both rims match (thinnest spot %d%% of the other side)" % int(rb[0] * 100))
              if front and LENS_MODE[0] and arms_side > SIDE_WARN:
                  nums["reject"] = ARMS_SIDE_REASON
                  log("    arms beside the frame: %.1f%% of its width -> REJECTED, re-shoot (nothing was cut)"
                      % (arms_side * 100))
              elif front and LENS_MODE[0] and arms_above >= ARMS_WARN:
                  # 2026-09-21, Rauf: such a photo is REJECTED (kept off the website,
                  # reason shown in admin), not published with a note
                  nums["reject"] = ARMS_REASON
                  log("    arms above the frame: %.1f%% -> REJECTED, re-shoot (nothing was cut)" % (arms_above * 100))
              elif front and LENS_MODE[0]:
                  log("    arms above the frame: %.1f%% (below %.1f%%, no note)" % (arms_above * 100, ARMS_WARN * 100))
              if False:   # arms over the front are normal for this shop: no CHECK PHOTO tag
                  nums["warning"] = ("arms were angled over the front (%d%% of the picture removed) "
                                     "-- fold them flat behind, or open them straight back, and re-shoot"
                                     % round(arms_above * 100))
              if colour_img is None or colour_img.size != img.size:
                  colour_img = img
              rgba = np.dstack([unmix_edge(colour_img, a), (a * 255).round().astype(np.uint8)])
              if tint_mask is not None and tint_mask.shape == a.shape:
                  # THE DEMO TINT, painted last (2026-09-25): the colour of the finished
                  # picture comes from the plain photo and then has the sheet un-mixed
                  # out of its faint pixels, which turned the tint into a wash of sheet
                  # grey nobody could see on a face. Now the tint is a fixed pale
                  # blue-white at LENS_TINT, set directly on the output.
                  rgba = rgba.copy()
                  _m = tint_mask & (a <= LENS_TINT + 0.01)
                  rgba[_m, 0] = 232; rgba[_m, 1] = 236; rgba[_m, 2] = 244
                  rgba[_m, 3] = int(round(LENS_TINT * 255))
              if edge_mask is not None and edge_mask.shape == a.shape and edge_mask.any():
                  # the lens edge line, bright and thin, like the edge of a real demo lens
                  rgba = rgba.copy() if not rgba.flags.writeable else rgba
                  rgba[edge_mask, 0] = 242; rgba[edge_mask, 1] = 245; rgba[edge_mask, 2] = 250
                  rgba[edge_mask, 3] = int(round(LENS_EDGE * 255))
              ys, xs = np.where(a > 0.02)
              if ys.size:
                  pad = 4
                  y0, y1 = max(0, ys.min() - pad), min(a.shape[0], ys.max() + pad + 1)
                  x0, x1 = max(0, xs.min() - pad), min(a.shape[1], xs.max() + pad + 1)
                  rgba = rgba[y0:y1, x0:x1]
                  if rim_kind and nums.get("lenses"):        # new method: the lens numbers follow the final crop
                      for e in nums["lenses"]:
                          e["centreX"] = float(e["centreX"] - x0); e["centreY"] = float(e["centreY"] - y0)
                      nums["frontWidthPx"] = int(x1 - x0); nums["frontHeightPx"] = int(y1 - y0)
              buf = io.BytesIO()
              Image.fromarray(rgba, "RGBA").save(buf, "PNG", optimize=True)
              # THE SOURCE PICTURE (2026-09-26, FIX IT): the same crop of the plain
              # photo, same size and turn as the cut-out, so staff can rub an eaten rim
              # back with the true pixels. Kept as a JPEG beside every cut-out.
              try:
                  _src = np.asarray(colour_img.convert("RGB"))
                  if ys.size:
                      _src = _src[y0:y1, x0:x1]
                  _sb = io.BytesIO(); Image.fromarray(_src, "RGB").save(_sb, "JPEG", quality=90)
                  LAST_SOURCE[0] = _sb.getvalue()          # never inside nums: nums is saved as JSON
              except Exception as _ex:
                  log("    source picture could not be kept: %s" % str(_ex)[:60])
              return buf.getvalue(), nums


          # ---------------------------------------------------------------- the round

          PLAIN_PHOTO = [False]   # True only in a 'test-plain:' run


          def compare_many(pngs, names, pid, name, cname, cpreset):
              """test-lens: on a METAL frame. Uploads one picture with every version
              side by side (left to right in the order logged) and logs each size."""
              try:
                  arrs = [np.asarray(Image.open(io.BytesIO(b)).convert("RGBA")) for b in pngs]
                  for n_, a_ in zip(names, arrs):
                      log("    METAL CHECK %s (%s) %-26s %d x %d px"
                          % (pid, (name or "")[:20], n_ + ":", a_.shape[1], a_.shape[0]))
                  Hm = max(a_.shape[0] for a_ in arrs)
                  parts = []
                  for a_ in arrs:
                      h, w = a_.shape[:2]
                      yy, xx = np.mgrid[0:Hm, 0:w]
                      chk = np.where(((yy // 16 + xx // 16) % 2) == 0, 235, 200).astype(np.float32)[..., None]
                      big = np.zeros((Hm, w, 4), np.uint8); big[:h] = a_
                      al = big[..., 3:4].astype(np.float32) / 255.0
                      parts.append((big[..., :3] * al + chk * (1 - al)).astype(np.uint8))
                      parts.append(np.full((Hm, 16, 3), 255, np.uint8))
                  buf = io.BytesIO()
                  Image.fromarray(np.hstack(parts[:-1])).save(buf, "PNG", optimize=True)
                  url = cloudinary_upload(buf.getvalue(), "metalcheck-%s" % pid, cname, cpreset)
                  log("    METAL CHECK picture (" + " | ".join(names) + "): " + url)
              except Exception as ex:
                  log("    METAL CHECK could not be made: %s" % str(ex)[:150])


          def lens_compare(png_old, png_new, pid, name, cname, cpreset):
              """test-lens: only. Compares today's cut with the lens-step cut, pixel by
              pixel, logs the counts and uploads one picture: today | with lens step |
              changes in red. For Sizzler every count must be 0 (nothing may change)."""
              try:
                  a0 = np.asarray(Image.open(io.BytesIO(png_old)).convert("RGBA"))
                  a1 = np.asarray(Image.open(io.BytesIO(png_new)).convert("RGBA"))
                  if a0.shape != a1.shape:
                      # sizes differ (e.g. the ends are no longer chopped): show both side by side
                      log("    LENS CHECK %s (%s): the outline size changed %s -> %s"
                          % (pid, (name or "")[:24], a0.shape[:2], a1.shape[:2]))
                      Hm = max(a0.shape[0], a1.shape[0])
                      def flat2(rgba):
                          h, w = rgba.shape[:2]
                          yy2, xx2 = np.mgrid[0:Hm, 0:w]
                          c2 = np.where(((yy2 // 16 + xx2 // 16) % 2) == 0, 235, 200).astype(np.float32)[..., None]
                          big = np.zeros((Hm, w, 4), np.uint8); big[:h] = rgba
                          al2 = big[..., 3:4].astype(np.float32) / 255.0
                          return (big[..., :3] * al2 + c2 * (1 - al2)).astype(np.uint8)
                      pic = np.hstack([flat2(a0), np.full((Hm, 12, 3), 255, np.uint8), flat2(a1)])
                      buf = io.BytesIO()
                      Image.fromarray(pic).save(buf, "PNG", optimize=True)
                      url = cloudinary_upload(buf.getvalue(), "lenscheck-%s" % pid, cname, cpreset)
                      log("    LENS CHECK picture (today | with lens step): " + url)
                      return
                  o, nn = a0[..., 3].astype(int), a1[..., 3].astype(int)
                  cleared = int(((o > 127) & (nn <= 127)).sum())
                  added = int(((o <= 127) & (nn > 127)).sum())
                  changed = int((np.abs(o - nn) > 25).sum())
                  log("    LENS CHECK %s (%s): %d pixels cleared, %d added, %d changed in all%s"
                      % (pid, (name or "")[:24], cleared, added, changed,
                         "  -> IDENTICAL" if changed == 0 else ""))
                  H, W = o.shape
                  yy, xx = np.mgrid[0:H, 0:W]
                  chk = np.where(((yy // 16 + xx // 16) % 2) == 0, 235, 200).astype(np.float32)[..., None]
                  def flat(rgba):
                      al = rgba[..., 3:4].astype(np.float32) / 255.0
                      return (rgba[..., :3] * al + chk * (1 - al)).astype(np.uint8)
                  p0, p1 = flat(a0), flat(a1)
                  red = p0.copy()
                  red[(o > 127) & (nn <= 127)] = (230, 0, 0)
                  red[(o <= 127) & (nn > 127)] = (0, 0, 230)
                  gap = np.full((H, 12, 3), 255, np.uint8)
                  pic = np.hstack([p0, gap, p1, gap, red])
                  buf = io.BytesIO()
                  Image.fromarray(pic).save(buf, "PNG", optimize=True)
                  url = cloudinary_upload(buf.getvalue(), "lenscheck-%s" % pid, cname, cpreset)
                  log("    LENS CHECK picture (today | with lens step | red = cleared): " + url)
              except Exception as ex:
                  log("    LENS CHECK could not be made: %s" % str(ex)[:150])


          def is_metal(p):
              """Metal frames keep their own method and are never re-coloured."""
              if str(p.get("id")) in NEW_METHOD_IDS:
                  return True
              mat = str(p.get("material") or p.get("frameMaterial") or "").lower()
              return "metal" in mat


          def no_enhancement(url):
              """Same Cloudinary photo WITHOUT the e_ effects (improve, colour,
              contrast, vibrance, unsharp mask). Crop/pad and format stay. The sharpening
              draws pure-white lines along dark rims (seen on VG-1001, 2026-09-21)."""
              if "/image/upload/" not in url:
                  return url
              head, tail = url.split("/image/upload/", 1)
              parts = tail.split("/")
              keep = [s_ for s_ in parts[:-1] if not all(x.startswith("e_") for x in s_.split(","))]
              return head + "/image/upload/" + "/".join(keep + parts[-1:])


          def front_photo(p):
              ang = p.get("anglePhotos") if isinstance(p.get("anglePhotos"), dict) else {}
              # the photo AS TAKEN first (d16.62 admin uploads it plain); the
              # sharpened copies only if that is all an older frame has.
              # (2026-09-20: a version that stripped Cloudinary's sharpening from
              # the URL was built and then held back -- it changes the pixels the
              # AI sees, so it could move the cut edge. The colour fix below made
              # it unnecessary for the halo. Kept out until tested on its own.)
              for v in (p.get("rawFrontUrl"), p.get("originalUrl"), ang.get("front"), p.get("url")):
                  if isinstance(v, str) and v.startswith("http"):
                      return v
              return None


          def angle_photo(p):
              ang = p.get("anglePhotos") if isinstance(p.get("anglePhotos"), dict) else {}
              for v in (p.get("rawAngleUrl"), ang.get("angle")):
                  if isinstance(v, str) and v.startswith("http"):
                      return v
              for g in (p.get("gallery") or []):
                  if isinstance(g, dict) and g.get("view") == "angle" and str(g.get("url", "")).startswith("http"):
                      return g["url"]
              return None


          def side_photo(p):
              ang = p.get("anglePhotos") if isinstance(p.get("anglePhotos"), dict) else {}
              for v in (p.get("rawSideUrl"), p.get("sidePhoto"), ang.get("side")):
