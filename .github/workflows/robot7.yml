          def angle_right_photo(p):
              """The other 45-degree view, taken for real (admin tile 3)."""
              ang = p.get("anglePhotos") if isinstance(p.get("anglePhotos"), dict) else {}
              for v in (p.get("rawAngleRUrl"), ang.get("angleR"), ang.get("angle-right")):
                  if isinstance(v, str) and v.startswith("http"):
                      return v
              for g in (p.get("gallery") or []):
