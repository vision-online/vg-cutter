name: Cut-out robot

# The whole robot lives in this one file. Every ten minutes it takes a
# ten-second look at the shop database; only when a frame is waiting
# does it install the cutter and do the work. "Run workflow" does it
# now; the Trial box takes: first (re-cut one frame), a frame id, or
# reset (forgive rejected frames and try them again).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      recut:
        description: 'first / a frame id / reset / all (re-cut every frame)'
        required: false
        default: ''

permissions:
  contents: write

# Only one robot at a time: a new look waits until the running cut has
# finished, so two runs never cut the same frames at once.
concurrency:
  group: cut-out-robot
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unpack the robot
        run: |
          cat > vg_look.py <<'PYEOF'
          """
          The ten-second look.

          This runs every ten minutes and does almost nothing: it asks the shop
          database whether any frame is waiting for a cut-out, and writes down that
          the robot is alive. Only if something IS waiting does the real cutter get
          woken, with its half-gigabyte of libraries and its model.

          Deliberately written with nothing but what Python already has, so this
          step needs no installing at all. An idle day therefore costs seconds, not
          minutes -- which is what makes running every ten minutes sensible.
          """

          import datetime
          import json
          import os
          import urllib.error
          import urllib.request

          SUPABASE_URL = (os.environ.get("SUPABASE_URL") or "").strip().rstrip("/")
          SUPABASE_KEY = (os.environ.get("SUPABASE_KEY") or "").strip()


          def key_role():
              try:
                  import base64
                  part = SUPABASE_KEY.split(".")[1]
                  part += "=" * (-len(part) % 4)
                  return json.loads(base64.urlsafe_b64decode(part)).get("role", "?")
              except Exception:
                  return "not a legacy JWT key"
          MAX_TRIES = int(os.environ.get("MAX_TRIES", "3"))


          def call(path, method="GET", body=None, prefer=None):
              req = urllib.request.Request(SUPABASE_URL + path, method=method)
              req.add_header("apikey", SUPABASE_KEY)
              req.add_header("Authorization", "Bearer " + SUPABASE_KEY)
              req.add_header("Content-Type", "application/json")
              if prefer:
                  req.add_header("Prefer", prefer)
              data = json.dumps(body).encode() if body is not None else None
              try:
                  with urllib.request.urlopen(req, data, timeout=45) as r:
                      text = r.read().decode() or "[]"
              except urllib.error.HTTPError as e:
                  raise RuntimeError("database answered %d: %s" % (e.code, e.read().decode()[:200]))
              try:
                  return json.loads(text)
              except Exception:
                  return []


          def waiting(p):
              if p.get("tryOnLocked"):
                  return False
              if p.get("tryOnOk") is False:
                  return False          # try-on switched off by hand in admin: leave it
              if (p.get("tryOnFails") or 0) >= MAX_TRIES:
                  return False
              if p.get("tryOnReady") and p.get("tryOnUrl"):
                  return False
              ang = p.get("anglePhotos") if isinstance(p.get("anglePhotos"), dict) else {}
              return bool(p.get("rawFrontUrl") or p.get("originalUrl") or ang.get("front") or p.get("url"))


          def main():
              now = datetime.datetime.utcnow().isoformat() + "Z"
              state = {"lastLook": now, "ok": False}
              failed = False
              recut = (os.environ.get("RECUT") or "").strip()
              if not SUPABASE_URL or not SUPABASE_KEY:
                  print("::error::STOP: the SUPABASE_KEY secret is missing or empty.")
                  failed = True
              else:
                  print("::notice::Database %s, key role: %s" % (SUPABASE_URL, key_role()))
              count = 0
              try:
                  rows = call("/rest/v1/products?select=id,data&limit=3000")
                  frames = [r.get("data") or {} for r in rows if not str(r.get("id") or "").startswith("__")]
                  if recut.lower() == "all":
                      # cut every frame again with the current method (after a cutter
                      # improvement). Hand-supplied PNGs and switched-off try-ons are left.
                      redo = []
                      for r in rows:
                          d = r.get("data") or {}
                          if str(r.get("id") or "").startswith("__") or d.get("tryOnLocked") or d.get("tryOnOk") is False:
                              continue
                          d["tryOnReady"] = False; d["tryOnFails"] = 0; d.pop("tryOnFail", None)
                          d.pop("tryOnAngleUrl", None); d.pop("tryOnSideUrl", None)
                          redo.append({"id": str(r.get("id")), "data": d, "updated_at": now})
                      if redo:
                          call("/rest/v1/products?on_conflict=id", "POST", redo,
                               "resolution=merge-duplicates,return=minimal")
                      print("Re-cut all: %d frame(s) queued for a fresh cut." % len(redo))
                      recut = ""
                      frames = [r.get("data") or {} for r in rows if not str(r.get("id") or "").startswith("__")]
                  if recut.lower() == "reset":
                      # forgive every rejection: the fault was ours (a wrong secret),
                      # not the photos. The cutter then tries them all again.
                      cleared = []
                      for r in rows:
                          d = r.get("data") or {}
                          if str(r.get("id") or "").startswith("__"):
                              continue
                          if (d.get("tryOnFails") or 0) > 0:
                              d["tryOnFails"] = 0
                              d.pop("tryOnFail", None)
                              cleared.append({"id": str(r.get("id")), "data": d, "updated_at": now})
                      if cleared:
                          call("/rest/v1/products?on_conflict=id", "POST", cleared,
                               "resolution=merge-duplicates,return=minimal")
                      print("Reset: %d frame(s) forgiven and back in the queue." % len(cleared))
                      recut = ""
                  count = sum(1 for p in frames if waiting(p))
                  rejected = sum(1 for p in frames if (p.get("tryOnFails") or 0) >= MAX_TRIES)
                  # say WHY, so a rejection can be read from the run page
                  reasons = {}
                  for p in frames:
                      if (p.get("tryOnFails") or 0) >= 1 and p.get("tryOnFail"):
                          reasons.setdefault(str(p.get("tryOnFail"))[:160], []).append(str(p.get("name") or p.get("id"))[:24])
                  for why, names in sorted(reasons.items(), key=lambda kv: -len(kv[1]))[:6]:
                      print("  %d frame(s): %s  [%s]" % (len(names), why, ", ".join(names[:4])))
                  state = {"lastLook": now, "ok": True, "waiting": count,
                           "rejected": rejected, "frames": len(frames)}
                  if recut:
                      count = max(count, 1)     # a trial cut was asked for: wake the cutter
                  print("::notice::Frames: %d. Waiting: %d. Rejected: %d.%s" % (len(frames), count, rejected,
                        ("  Trial re-cut asked for: " + recut) if recut else ""))
              except Exception as e:
                  state["error"] = str(e)[:300]
                  print("::error::STOP: could not read the database: %s" % str(e)[:200].replace("\n", " "))
                  failed = True

              # The health line in admin reads this row.
              try:
                  old = call("/rest/v1/products?select=id,data&id=eq.__robot")
                  keep = (old[0].get("data") if old else None) or {}
                  keep.update(state)
                  if state.get("ok") and "error" not in state:
                      keep.pop("error", None)
                  call("/rest/v1/products?on_conflict=id", "POST",
                       [{"id": "__robot", "data": keep, "updated_at": now}],
                       "resolution=merge-duplicates,return=minimal")
              except Exception as e:
                  print("Could not write the health note: %s" % str(e)[:150])

              out = os.environ.get("GITHUB_OUTPUT")
              if out:
                  with open(out, "a") as f:
                      f.write("waiting=%d\n" % count)
              if failed:
                  raise SystemExit(1)


          if __name__ == "__main__":
              main()
          PYEOF
          cat > vg_cut.py <<'PYEOF'
          """
          Vision Gallery — the cut-out robot.

          Runs by itself on GitHub Actions. Every hour it asks the shop's own
          database which frames are still waiting for a try-on picture, cuts each
          one, puts the cut-out on Cloudinary, and writes the address back onto the
          frame. Nobody opens Colab, nobody renames a file, nobody presses anything.

          The cutting method is the one the shop settled on, unchanged:

            1. no erosion or trimming rule anywhere -- the rim is NEVER thinned
            2. a first mask from the full BiRefNet
            3. a trimap: a band of "unknown" either side of the rim edge
            4. alpha matting in that band, so the edge is soft and a crystal or
               tinted rim keeps its see-through look instead of being cut to a line
            5. the inner lens cleared to full transparency, the outer rim untouched
            6. for the front try-on only: the arms removed end piece to end piece,
               by dropping outer columns that are too short to be a rim

          What it needs to be told (GitHub -> Settings -> Secrets):
            SUPABASE_URL   the shop database address
            SUPABASE_KEY   the service_role key (a robot cannot sign in like a person)
          Cloudinary is read from the shop's own settings row; it can also be given
          as CLOUDINARY_NAME and CLOUDINARY_PRESET if it is ever missing there.
          """

          import io
          import json
          import os
          import sys
          import time

          import numpy as np
          import requests
          from PIL import Image

          START = time.time()
          MAX_MINUTES = float(os.environ.get("MAX_MINUTES", "50"))
          MAX_FRAMES = int(os.environ.get("MAX_FRAMES", "40"))
          MAX_TRIES = int(os.environ.get("MAX_TRIES", "3"))

          SUPABASE_URL = (os.environ.get("SUPABASE_URL") or "").strip().rstrip("/")
          SUPABASE_KEY = (os.environ.get("SUPABASE_KEY") or "").strip()


          def key_role():
              """Which kind of key this is, read from inside it -- without ever
              printing the key. 'service_role' is right; 'anon' cannot write."""
              try:
                  import base64
                  part = SUPABASE_KEY.split(".")[1]
                  part += "=" * (-len(part) % 4)
                  return json.loads(base64.urlsafe_b64decode(part)).get("role", "?")
              except Exception:
                  return "not a legacy JWT key (sb_... keys are not accepted here)"


          def log(*a):
              print(*a, flush=True)


          def out_of_time():
              return (time.time() - START) / 60.0 > MAX_MINUTES


          # ---------------------------------------------------------------- database

          def sb_headers(extra=None):
              h = {
                  "apikey": SUPABASE_KEY,
                  "Authorization": "Bearer " + SUPABASE_KEY,
                  "Content-Type": "application/json",
              }
              if extra:
                  h.update(extra)
              return h


          def fetch_products():
              """Every real frame. Settings rows have ids starting __ and are
              skipped here in Python: in the database's LIKE language an underscore
              is a wildcard, so a 'not like __*' filter would hide every frame."""
              url = (SUPABASE_URL + "/rest/v1/products?select=id,data&order=id.asc&limit=3000")
              r = requests.get(url, headers=sb_headers(), timeout=60)
              if not r.ok:
                  raise RuntimeError("database answered %d: %s" % (r.status_code, r.text[:200]))
              rows = r.json() or []
              out = []
              for row in rows:
                  rid = str(row.get("id") or "")
                  if rid.startswith("__"):
                      continue
                  data = row.get("data") if isinstance(row.get("data"), dict) else {}
                  data["id"] = rid
                  out.append(data)
              return out


          def fetch_setting(key):
              url = (SUPABASE_URL + "/rest/v1/products?select=id,data&id=eq.__" + key)
              try:
                  r = requests.get(url, headers=sb_headers(), timeout=30)
                  if not r.ok:
                      return None
                  rows = r.json() or []
                  return rows[0]["data"] if rows and isinstance(rows[0].get("data"), dict) else None
              except Exception:
                  return None


          def save_product(product):
              """Write the frame back, whole, exactly as the admin does."""
              import datetime
              body = [{
                  "id": str(product["id"]),
                  "data": product,
                  "updated_at": datetime.datetime.utcnow().isoformat() + "Z",
              }]
              r = requests.post(
                  SUPABASE_URL + "/rest/v1/products?on_conflict=id",
                  headers=sb_headers({"Prefer": "resolution=merge-duplicates,return=minimal"}),
                  data=json.dumps(body), timeout=60)
              r.raise_for_status()


          # ---------------------------------------------------------------- cloudinary

          def cloudinary_candidates(products):
              """Every (cloud name, preset) pair worth trying, best guess first.
              Names: the GitHub secret, the shop's saved settings, and the cloud
              name that every existing photo URL already carries. Presets: the
              secret and the shop settings."""
              names, presets = [], []
              def add(lst, v, src):
                  v = (v or "").strip()
                  if v and v not in [x for x, _ in lst]:
                      lst.append((v, src))
              add(names, os.environ.get("CLOUDINARY_NAME"), "secret")
              add(presets, os.environ.get("CLOUDINARY_PRESET"), "secret")
              for key in ("settings", "cloudinary", "shop"):
                  st = fetch_setting(key) or {}
                  c = st.get("cloudinary") if isinstance(st.get("cloudinary"), dict) else st
                  if isinstance(c, dict):
                      add(names, c.get("name"), "shop settings")
                      add(presets, c.get("preset"), "shop settings")
              import re
              for p in products:
                  for v in (p.get("url"), p.get("originalUrl"), p.get("rawFrontUrl")):
                      m = re.search(r"res\.cloudinary\.com/([^/]+)/", str(v or ""))
                      if m:
                          add(names, m.group(1), "photo URLs")
                          break
              return [(n, ns, pr, ps) for n, ns in names for pr, ps in presets]


          def cloudinary_probe(products):
              """Try each candidate with a 2x2 transparent PNG until Cloudinary accepts."""
              test = io.BytesIO()
              Image.new("RGBA", (2, 2), (0, 0, 0, 0)).save(test, "PNG")
              tried = []
              for name, ns, preset, ps in cloudinary_candidates(products):
                  try:
                      cloudinary_upload(test.getvalue(), "vg-robot-test", name, preset)
                      log("Cloudinary accepted a test upload: cloud %s (from %s), preset %s (from %s)."
                          % (name, ns, preset, ps))
                      return name, preset
                  except Exception as e:
                      tried.append("cloud %s (%s) + preset %s (%s): %s" % (name, ns, preset, ps, str(e)[:90]))
              for t in tried:
                  log("  tried " + t)
              return None, None


          def cloudinary_upload(png_bytes, public_hint, name, preset):
              r = requests.post(
                  "https://api.cloudinary.com/v1_1/%s/image/upload" % name,
                  data={"upload_preset": preset},
                  files={"file": (public_hint + ".png", png_bytes, "image/png")},
                  timeout=180)
              if not r.ok:
                  raise RuntimeError("Cloudinary refused: %s %s" % (r.status_code, r.text[:200]))
              j = r.json()
              url = j.get("secure_url") or j.get("url")
              if not url:
                  raise RuntimeError("Cloudinary gave no address back")
              return url


          # ---------------------------------------------------------------- the model

          _model = None


          def model():
              global _model
              if _model is None:
                  import torch
                  from transformers import AutoModelForImageSegmentation
                  wanted = os.environ.get("BIREFNET_MODEL", "ZhengPeng7/BiRefNet")
                  try:
                      m = AutoModelForImageSegmentation.from_pretrained(wanted, trust_remote_code=True)
                      log("Model loaded:", wanted)
                  except Exception as e:
                      log("Full model would not load (%s). Using the lite model instead." % str(e)[:120])
                      m = AutoModelForImageSegmentation.from_pretrained(
                          "ZhengPeng7/BiRefNet_lite", trust_remote_code=True)
                  m.eval()
                  torch.set_grad_enabled(False)
                  torch.set_num_threads(int(os.environ.get("THREADS", "4")))
                  _model = m
              return _model


          def coarse_mask(img):
              """BiRefNet's own opinion of the frame, as a 0..1 mask at photo size."""
              import cv2
              import torch
              from torchvision import transforms
              prep = transforms.Compose([
                  transforms.Resize((1024, 1024)),
                  transforms.ToTensor(),
                  transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),
              ])
              x = prep(img).unsqueeze(0)
              with torch.no_grad():
                  pred = model()(x)[-1].sigmoid().cpu()[0, 0].numpy()
              pred = cv2.resize(pred, img.size, interpolation=cv2.INTER_LINEAR)
              return pred.astype(np.float32)


          # ---------------------------------------------------------------- the method

          def make_trimap(mask01, band_px):
              """
              0 = surely background, 1 = surely frame, 0.5 = unknown.
              The unknown band straddles the rim edge, so the matting -- not a hard
              threshold -- decides every pixel near the rim. The rim itself is never
              eroded; erosion only marks what is safely inside.
              """
              import cv2
              hard = (mask01 > 0.5).astype(np.uint8)
              k = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (band_px * 2 + 1, band_px * 2 + 1))
              sure_fg = cv2.erode(hard, k)
              sure_bg = 1 - cv2.dilate(hard, k)
              tri = np.full(hard.shape, 0.5, np.float32)
              tri[sure_fg == 1] = 1.0
              tri[sure_bg == 1] = 0.0
              return tri


          def matte(img, trimap):
              """Continuous alpha in the unknown band, at a reduced size for speed."""
              import cv2
              from pymatting import estimate_alpha_lkm, estimate_alpha_cf
              rgb = np.asarray(img.convert("RGB")).astype(np.float64) / 255.0
              H, W = trimap.shape
              scale = min(1.0, 1600.0 / max(H, W))     # full size: a reduced matte smears the edge
              if scale < 1.0:
                  sw, sh = int(W * scale), int(H * scale)
                  rgb_s = cv2.resize(rgb, (sw, sh), interpolation=cv2.INTER_AREA)
                  tri_s = cv2.resize(trimap, (sw, sh), interpolation=cv2.INTER_NEAREST)
              else:
                  rgb_s, tri_s = rgb, trimap
              try:
                  a = estimate_alpha_lkm(rgb_s, tri_s.astype(np.float64))
              except Exception:
                  a = estimate_alpha_cf(rgb_s, tri_s.astype(np.float64))
              a = np.clip(a, 0, 1)
              if scale < 1.0:
                  a = cv2.resize(a.astype(np.float32), (W, H), interpolation=cv2.INTER_LINEAR)
              a = np.where(trimap == 1.0, 1.0, np.where(trimap == 0.0, 0.0, a))
              return a.astype(np.float32)


          def _border(mask):
              b = np.zeros_like(mask, dtype=bool)
              b[0, :] = b[-1, :] = b[:, 0] = b[:, -1] = True
              return b & mask


          def firm_rim(alpha):
              """
              A thin metal bar with a highlight along it comes out of the matting
              speckled: opaque, then half-clear, then opaque again along the same
              bar. Every pixel INSIDE the bar (not on its edge) is made fully
              opaque. Only the interior changes, so the outline is exactly as it
              was and nothing is thinned.
              """
              from scipy import ndimage
              solid = alpha > 0.5
              body = ndimage.binary_closing(solid, structure=np.ones((5, 5), bool))
              interior = ndimage.binary_erosion(body, iterations=1) & (alpha > 0.02)
              out = alpha.copy()
              out[interior] = 1.0
              return out


          def keep_main_solid(alpha):
              """
              Half-rim only: what is not joined to the front -- the tip of an arm
              showing below the glass, a fleck of the table along the lens edge --
              goes. The front, its end pieces, the nose pads and the traced lens
              rings are all one connected piece by this stage.
              """
              from scipy import ndimage
              solid = alpha > 0.5
              lab, n = ndimage.label(solid)
              if n <= 1:
                  return alpha
              sizes = ndimage.sum(solid, lab, range(1, n + 1))
              big = sizes.max()
              keep = np.zeros_like(solid)
              for i, sz in enumerate(sizes):
                  if sz >= 0.3 * big:
                      keep |= lab == (i + 1)
              near = ndimage.binary_dilation(keep, iterations=3)
              out = alpha.copy()
              out[~near] = 0.0
              return out


          def trim_whiskers(alpha, radius=6):
              """
              Half-rim only: a stray thread or cord the camera also caught --
              a filament a few pixels wide, dangling off a nose pad or the rim
              -- goes. A round structuring element wide enough to pass any real
              part (the thinnest genuine piece here, a nose pad, is well over
              20 px across) but not a several-pixel filament, even where it
              thickens briefly at a knot or where it meets the pad.
              """
              from scipy import ndimage
              yy, xx = np.ogrid[-radius:radius + 1, -radius:radius + 1]
              disk = (xx * xx + yy * yy) <= radius * radius
              opened = ndimage.binary_opening(alpha > 0.5, structure=disk)
              out = alpha.copy()
              out[(alpha > 0.02) & ~opened] = 0.0
              return out


          def largest_component(alpha):
              """Keep the frame; drop stray specks the model may have kept."""
              from scipy import ndimage
              lab, n = ndimage.label(alpha > 0.5)
              if n <= 1:
                  return alpha
              sizes = ndimage.sum(alpha > 0.5, lab, range(1, n + 1))
              keep = int(np.argmax(sizes)) + 1
              out = alpha.copy()
              out[(lab != keep) & (lab != 0)] = 0.0
              return out


          def lens_holes(alpha):
              """The enclosed openings inside the rim -- i.e. the two lenses."""
              from scipy import ndimage
              frame = alpha > 0.5
              not_frame = ~frame
              outside = ndimage.binary_propagation(_border(not_frame), mask=not_frame)
              holes = not_frame & ~outside
              lab, n = ndimage.label(holes)
              if n == 0:
                  return np.zeros_like(holes), outside
              sizes = ndimage.sum(holes, lab, range(1, n + 1))
              big = [i + 1 for i, s in enumerate(sizes) if s > holes.size * 0.004]
              return np.isin(lab, big), outside


          def clear_inner_lens(alpha):
              """
              Make the glass fully transparent -- including a tinted or mirrored
              lens the model kept as solid, and a hinge tongue showing through the
              corner. The outer rim is not touched: nothing here operates on it.
              """
              import cv2
              lens, outside = lens_holes(alpha)
              if not lens.any():
                  return alpha
              k = cv2.getStructuringElement(
                  cv2.MORPH_ELLIPSE, (int(alpha.shape[1] * 0.024) | 1,) * 2)
              lens_closed = cv2.morphologyEx(lens.astype(np.uint8), cv2.MORPH_CLOSE, k).astype(bool)
              lens_closed &= ~outside
              out = alpha.copy()
              out[lens_closed] = 0.0
              return out


          def heal_rim(alpha):
              """
              A bright highlight line along the top of a glossy rim looks like
              the sheet to the matting, which leaves a hair-thin transparent
              SLIT inside the rim, a few pixels below its edge. Every later rule
              then sees the rim as two pieces and treats the upper one as loose.
              Measured on the shop's Sizzler photo: the rim came out 14 px thinner
              because of it. Here any slit or small enclosed hole inside the
              frame is filled back to solid. Only material is ADDED, and only
              inside the frame -- the lens openings and the outside are untouched.
              """
              from scipy import ndimage
              solid = alpha > 0.5
              # horizontal slits up to 4 px tall: close vertically
              closed = ndimage.binary_closing(solid, structure=np.ones((7, 1), bool))
              # small enclosed holes (a lens opening is far larger than 0.4% of the picture)
              not_frame = ~closed
              outside = ndimage.binary_propagation(_border(not_frame), mask=not_frame)
              holes = not_frame & ~outside
              lab, n = ndimage.label(holes)
              if n:
                  sizes = ndimage.sum(holes, lab, range(1, n + 1))
                  small = np.isin(lab, [i + 1 for i, s in enumerate(sizes) if s < holes.size * 0.004])
                  closed |= small
              out = alpha.copy()
              add = closed & ~solid
              out[add] = 1.0
              return out


          def remove_arms_above(alpha, img=None):
              """
              The shop shoots the front with the arms OPEN, so from a slightly
              raised camera the arms show as bands rising above the front's top
              edge. Remove them -- and nothing else.

              1. The front's own top edge is found above each lens, from the
                 columns where the rim has its normal thickness (no arm on it),
                 and a smooth line is fitted along it. Beyond the outer end of
                 a lens the line is carried on flat, over the end piece.
              2. Only what rises above that line is examined. A piece that sits
                 on the line and is thick (a hinge block, a cat-eye wing, no more
                 than two rims high) is part of the front and is kept whole.
                 Thin bands, and anything rising higher, are arm and go -- with
                 their soft outline, so no ghost is left.
              3. The bridge (between the lenses) is never examined at all.
              Nothing at or below the top edge is touched: the rim is never thinned.
              """
              from scipy import ndimage
              lens, _ = lens_holes(alpha)
              lab, n = ndimage.label(lens)
              if n < 2:
                  return alpha, 0.0
              sizes = ndimage.sum(lens, lab, range(1, n + 1))
              idx = [i + 1 for i in sorted(range(n), key=lambda i: -sizes[i])[:2]]
              solid = alpha > 0.5
              H, W = alpha.shape
              lens_top = np.full(alpha.shape[1], -1, dtype=np.int64)
              spans = []
              for i in idx:
                  yy, xx = np.where(lab == i)
                  x0, x1 = int(xx.min()), int(xx.max())
                  cols = []
                  for x in range(x0, x1 + 1):
                      col = np.where(lab[:, x] == i)[0]
                      if not col.size:
                          continue
                      y = int(col.min()) - 1
                      top = y
                      while top >= 0 and solid[top, x]:
                          top -= 1
                      cols.append((x, top + 1, y - top))       # column, rim top, rim thickness
                  if len(cols) < 10:
                      continue
                  cols = np.array(cols, dtype=np.float64)
                  t_med = float(np.median(cols[:, 2]))
                  for cx, ct, cth in cols:
                      lens_top[int(cx)] = int(ct + cth)         # first glass pixel in this column
                  lo, hi = x0 + (x1 - x0) * 0.1, x1 - (x1 - x0) * 0.1
                  clean = cols[(cols[:, 2] <= t_med * 1.2) & (cols[:, 0] >= lo) & (cols[:, 0] <= hi)]
                  if len(clean) < 10:
                      clean = cols[cols[:, 2] <= t_med * 1.2]
                  if len(clean) < 5:
                      continue
                  deg = 2 if len(clean) >= 30 else 1
                  coef = np.polyfit(clean[:, 0], clean[:, 1], deg)
                  res = clean[:, 1] - np.polyval(coef, clean[:, 0])
                  # sit the line ON the edge, not through it: shift it up to the
                  # highest few percent of the edge points
                  coef[-1] += min(0.0, float(np.percentile(res, 10)))
                  spans.append((x0, x1, coef, t_med))
              if len(spans) < 2:
                  return alpha, 0.0
              spans.sort(key=lambda s: s[0])
              (lx0, lx1, lc, lt), (rx0, rx1, rc, rt) = spans
              rim_t = max(lt, rt)
              globals()['LAST_RIM_T'] = rim_t
              margin = 3
              # the very ends of the front (beyond the lenses) often drop away
              # from the line; read their height from the outermost columns,
              # which lie beyond where an arm starts, and slope the line to it
              cols_any = np.where(solid.any(axis=0))[0]
              xe_l, xe_r = int(cols_any.min()), int(cols_any.max())
              def top_at(x0, x1):
                  t = [int(np.argmax(solid[:, x])) for x in range(max(0, x0), min(W, x1 + 1)) if solid[:, x].any()]
                  return max(t) if t else None
              te_l = top_at(xe_l, xe_l + 4)
              te_r = top_at(xe_r - 4, xe_r)
              yl, yr = float(np.polyval(lc, lx0)), float(np.polyval(rc, rx1))
              lim = np.full(W, -1, dtype=np.int64)            # rows above lim are examined
              for x in range(W):
                  if x < lx0:
                      y = yl
                      if te_l is not None and te_l > yl and lx0 > xe_l:
                          y = yl + (te_l - yl) * (lx0 - x) / float(lx0 - xe_l)
                      lim[x] = int(np.floor(y)) - margin
                  elif x <= lx1:
                      lim[x] = int(np.floor(np.polyval(lc, x))) - margin
                  elif x > rx1:
                      y = yr
                      if te_r is not None and te_r > yr and xe_r > rx1:
                          y = yr + (te_r - yr) * (x - rx1) / float(xe_r - rx1)
                      lim[x] = int(np.floor(y)) - margin
                  elif x >= rx0:
                      lim[x] = int(np.floor(np.polyval(rc, x))) - margin
                  # between the lenses (the bridge): never examined
              above = np.zeros_like(solid)
              for x in range(W):
                  if lim[x] > 0:
                      above[:lim[x], x] = solid[:lim[x], x]
              if not above.any():
                  return alpha, 0.0
              # height of every pixel above the front's top edge
              rows = np.arange(H)[:, None]
              rise = np.where(lim[None, :] > 0, lim[None, :] - rows, 0)
              # thick pieces (hinge blocks, cat-eye wings) survive an opening that
              # wipes out the thin bands of an arm
              r = max(3, int(round(rim_t * 0.5)))
              disk = np.zeros((2 * r + 1, 2 * r + 1), bool)
              yy, xx = np.ogrid[-r:r + 1, -r:r + 1]
              disk[yy * yy + xx * xx <= r * r] = True
              thick = ndimage.binary_opening(above, structure=disk)
              centre_x = (lx1 + rx0) / 2.0
              rim_col = None
              rgb = None
              if img is not None:
                  rgb = np.asarray(img).astype(np.float64)
                  ref = []
                  for x in range(W):
                      if lens_top[x] > 0 and lim[x] > 0:
                          y0 = lens_top[x] - int(round(rim_t * 0.8))
                          y1 = lens_top[x] - int(round(rim_t * 0.2))
                          if y0 > lim[x]:
                              ref.append(rgb[y0:y1, x])
                  if ref:
                      rim_col = np.median(np.concatenate(ref), axis=0)
              def rim_coloured(comp):
                  if rim_col is None:
                      return True
                  ys, xs = np.where(comp)
                  d = np.sqrt(((rgb[ys, xs] - rim_col) ** 2).sum(axis=1))
                  return np.median(d) < 60
              def leans_inward(comp):
                  """An arm rises towards the middle of the frame: its highest point
                  sits on the inner side of the piece. A cat-eye wing rises towards
                  the outside, a hinge block is flat. True = arm."""
                  ys, xs = np.where(comp)
                  if xs.size < 20:
                      return True
                  top = ys.min()
                  xt = xs[ys <= top + max(2, int(0.15 * (ys.max() - top + 1)))].mean()
                  cx = xs.mean()
                  outward = 1.0 if cx > centre_x else -1.0       # +1: outside lies to the right
                  return (xt - cx) * outward < -0.15 * (xs.max() - xs.min() + 1)
              keep = np.zeros_like(above)
              alab, an = ndimage.label(above)
              for c in range(1, an + 1):
                  comp = alab == c
                  ys, xs = np.where(comp)
                  width = int(xs.max() - xs.min() + 1)
                  seated = sum(1 for x in range(int(xs.min()), int(xs.max()) + 1)
                               if lim[x] > 0 and comp[max(0, lim[x] - 3):lim[x], x].any())
                  height = int(rise[ys, xs].max())
                  fill = xs.size / float(max(1, width * height))
                  # a hinge block is squarish and solid (fills most of its box); an
                  # arm root or a tag remnant is a thin slanted band (fills little)
                  if height <= 1.5 * rim_t and seated >= 0.6 * width and fill >= 0.45 and not leans_inward(comp) and rim_coloured(comp):
                      keep |= comp                              # a block sitting on the front: keep whole
              tlab, tn = ndimage.label(thick & ~keep)
              for c in range(1, tn + 1):
                  comp = tlab == c
                  ys, xs = np.where(comp)
                  height = int(rise[ys, xs].max())
                  width = int(xs.max() - xs.min() + 1)
                  seated = sum(1 for x in range(int(xs.min()), int(xs.max()) + 1)
                               if lim[x] > 0 and comp[max(0, lim[x] - r - 1):lim[x], x].any())
                  fill = xs.size / float(max(1, width * height))
                  if height <= 2.0 * rim_t and seated >= 0.8 * width and fill >= 0.45 and not leans_inward(comp) and rim_coloured(comp):
                      grown = ndimage.binary_dilation(comp, structure=disk)
                      keep |= grown & above                     # a thick piece of the front
              # where an arm joins, keep a quarter rim above the edge, so the
              # corner itself is never nicked
              keep |= above & (rise <= 1)                     # the edge line itself, nothing more
              kill = above & ~keep
              # THE CORNER: at a rounded corner the fitted line runs a little above
              # the real rim, and the arm's root hides in that gap, looking like a
              # thicker rim. There, and only there, colour decides: a pixel that is
              # not the rim's colour goes -- scanning down from the line and
              # stopping at the first rim-coloured pixel, and never below the
              # rim's own normal thickness, so the rim is never thinned.
              if rim_col is not None:
                  if True:
                      for x in range(W):
                          if lim[x] <= 0:
                              continue
                          if lens_top[x] > 0:
                              floor_y = lens_top[x] - int(round(rim_t))   # normal thickness: never cut below
                          else:
                              floor_y = lim[x] + int(round(rim_t * 0.5))  # end piece: half a rim at most
                          y = lim[x]; run = 0
                          while y < floor_y and solid[y, x]:
                              if np.sqrt(((rgb[y, x] - rim_col) ** 2).sum()) < 60:
                                  run += 1
                                  if run >= 3:
                                      kill[y - 2:y + 1, x] = False
                                      break
                              else:
                                  run = 0
                              kill[y, x] = True
                              y += 1
                      # the rim itself is never cut: anything the line marked that
                      # is rim-coloured and within the rim's possible thickness of
                      # the glass is rim (a corner that rises, a thicker end) -- keep
                      # it. A bright highlight right on the edge line is rim too.
                      dist = np.sqrt(((rgb - rim_col) ** 2).sum(axis=2))
                      bright = rgb.mean(axis=2) > 180
                      rows = np.arange(H)[:, None]
                      zone = np.zeros_like(kill)
                      for x in range(W):
                          if lens_top[x] > 0:
                              pass       # over the glass the fitted line rules: a dark arm lying flat on the brow is not rim
                          elif lim[x] > 0:
                              # an end piece may rise above the line at the corner: rim-coloured
                              # pixels up to half a rim above it are rim, not arm
                              zone[max(0, lim[x] - int(round(rim_t * 0.5))):lim[x] + int(round(rim_t * 0.5)), x] = True
                      near_line = (rows >= (lim[None, :] - 8)) & (lim[None, :] > 0)
                      rim_like = zone & ((dist < 60) | (bright & near_line)) & kill
                      # a rising corner is a long low sliver along the line; an arm
                      # root of the same colour is a compact piece leaning inward
                      rlab, rn = ndimage.label(rim_like)
                      for c in range(1, rn + 1):
                          comp = rlab == c
                          ys, xs = np.where(comp)
                          h = ys.max() - ys.min() + 1; w = xs.max() - xs.min() + 1
                          if h > 0.35 * rim_t and w < 3 * h and leans_inward(comp):
                              rim_like &= ~comp
                      kill &= ~rim_like
                      # the end pieces: colour only, from the very top down, so a
                      # grey arm root or hinge line above them goes whatever the
                      # line said, and rim-coloured end piece is never touched
                      for x in range(W):
                          if lens_top[x] > 0 or lim[x] <= 0:
                              continue
                          col = np.where(solid[:, x])[0]
                          if not col.size:
                              continue
                          y = int(col.min())
                          stop = int(col.max()); run = 0
                          while y <= stop:
                              if solid[y, x]:
                                  if dist[y, x] < 60:
                                      run += 1
                                      if run >= 3:
                                          kill[y - 2:y + 1, x] = False
                                          break
                                  else:
                                      run = 0
                                  kill[y, x] = True
                              y += 1
              out = alpha.copy()
              if kill.any():
                  # take the arm's soft outline with it -- only above the edge line
                  soft = ndimage.binary_dilation(kill, iterations=3) & (rise > 0) & ~keep
                  out[kill | soft] = 0.0
                  # bits of arm tip or price tag left floating above the front
                  from scipy import ndimage as _nd
                  flab, fn = _nd.label(out > 0.5)
                  if fn > 1:
                      fs = _nd.sum(out > 0.5, flab, range(1, fn + 1))
                      main = int(np.argmax(fs)) + 1
                      ys_main = np.where(flab == main)[0]
                      mid = int((ys_main.min() + ys_main.max()) / 2)
                      stray = (flab != main) & (flab != 0)
                      stray[mid:, :] = False                        # only above the frame's middle
                      stray = _nd.binary_dilation(stray, iterations=3) & ~(flab == main)
                      stray[mid:, :] = False
                      out[stray] = 0.0
                  # a one-pixel feather along the new edge, so it is not a staircase
                  edge = _nd.binary_dilation(kill | soft, iterations=1) & (out > 0.5)
                  out[edge] *= 0.5
              removed = float((solid & ~(out > 0.5)).sum()) / max(1.0, float(solid.sum()))
              return out, removed


          def clear_behind_glass(alpha):
              """
              A customer looks THROUGH the lenses at their own face, so the glass
              must be completely clear: no arm, hinge or temple seen through it.
              Each lens opening is a smooth convex shape; everything inside its
              convex hull that is not the rim itself is cleared to fully
              transparent, and the rim (outside the hull) is never touched.
              """
              import cv2
              from scipy import ndimage
              # a thin arm or hinge line across the glass would bend the opening's
              # outline around itself; erode the frame a little so such lines
              # vanish, find the openings, and shrink the hull back by the same
              # amount so the rim is never touched
              k = 4
              solid = ndimage.binary_erosion(alpha > 0.5, iterations=k)
              not_frame = ~solid
              outside = ndimage.binary_propagation(_border(not_frame), mask=not_frame)
              holes = not_frame & ~outside
              lab, n = ndimage.label(holes)
              if n == 0:
                  return alpha
              sizes = ndimage.sum(holes, lab, range(1, n + 1))
              order = sorted(range(n), key=lambda i: -sizes[i])
              out = alpha.copy()
              for i in order[:2]:
                  if sizes[i] < holes.size * 0.004:
                      continue
                  ys, xs = np.where(lab == i + 1)
                  hull = cv2.convexHull(np.stack([xs, ys], axis=1).astype(np.int32))
                  canvas = np.zeros(alpha.shape, np.uint8)
                  cv2.fillConvexPoly(canvas, hull, 1)
                  inner = ndimage.binary_erosion(canvas.astype(bool), iterations=k + 1)
                  out[inner] = 0.0
              return out


          def trim_ends(alpha, frac=0.0014):
              """
              The front is measured end to end and 0.2 mm is trimmed off each
              end (0.14% of the width: 140 mm becomes 139.6 mm), as the shop
              asked, so any last hair of hinge is gone while the frame's own
              rounded corners stay. Whole columns only: nothing is thinned.
              """
              cols = np.where((alpha > 0.5).any(axis=0))[0]
              if cols.size < 10:
                  return alpha
              x0, x1 = int(cols.min()), int(cols.max())
              t = max(1, int(round((x1 - x0 + 1) * frac)))
              out = alpha.copy()
              out[:, :x0 + t] = 0.0
              out[:, x1 - t + 1:] = 0.0
              return out


          def trim_narrow_above(alpha, rim_t):
              """
              Whatever is left above the lenses after the arm step, a piece that is
              NARROW (less than one and a half rims wide) and sticks up from the
              front is not front: an arm root, a hinge line, a tag corner. The
              front's own top -- rim, bridge, end pieces, a wide cat-eye wing --
              is wide in every row and is kept exactly. Nothing below the top of
              the lens openings is examined, so nose pads and the rim are safe.
              """
              from scipy import ndimage
              lens, _ = lens_holes(alpha)
              if not lens.any():
                  return alpha
              ys = np.where(lens.any(axis=1))[0]
              top_of_glass = int(ys.min())
              solid = alpha > 0.5
              L = max(9, int(round(rim_t * 1.5)) | 1)
              opened = ndimage.binary_opening(solid, structure=np.ones((1, L), bool))
              narrow = solid & ~opened
              narrow[top_of_glass:, :] = False
              if not narrow.any():
                  return alpha
              out = alpha.copy()
              soft = ndimage.binary_dilation(narrow, iterations=2) & ~opened
              soft[top_of_glass:, :] = False
              out[narrow | soft] = 0.0
              edge = ndimage.binary_dilation(narrow | soft, iterations=1) & (out > 0.5)
              edge[top_of_glass:, :] = False
              out[edge] *= 0.5
              # hair-thin ghosts: faint pixels that touch nothing solid are gone
              near_solid = ndimage.binary_dilation(out > 0.5, iterations=2)
              ghost = (out > 0) & (out <= 0.5) & ~near_solid
              out[ghost] = 0.0
              return out


          def clean_ghosts(alpha):
              """Faint half-transparent pixels that touch nothing solid -- the soft
              outline an arm left behind -- are removed; the frame's own soft edge,
              which hugs the solid rim, is kept."""
              from scipy import ndimage
              out = alpha.copy()
              near_solid = ndimage.binary_dilation(out > 0.5, iterations=2)
              ghost = (out > 0) & (out <= 0.5) & ~near_solid
              out[ghost] = 0.0
              return out


          def mirror_top(alpha, rim_t):
              """
              A frame front is left-right symmetric. An arm lying flat along one
              brow leaves that side's top edge higher than the other side's, and
              the same colour as the rim -- nothing else can tell it apart. So the
              two sides are compared column by column, mirrored about the frame's
              centre (after allowing for the photo's tilt): where one side stands
              higher than its twin by more than a whisker, and by less than one
              rim, the excess is removed. A genuinely asymmetric design piece
              taller than a rim is left alone; where both sides rise together
              (a cat-eye wing, a hinge block) nothing changes.
              """
              from scipy import ndimage
              solid = alpha > 0.5
              H, W = alpha.shape
              cols = np.where(solid.any(axis=0))[0]
              if cols.size < 100:
                  return alpha
              T = np.full(W, -1, dtype=np.int64)
              for x in cols:
                  T[x] = int(np.argmax(solid[:, x]))
              lens, _ = lens_holes(alpha)
              lab, n = ndimage.label(lens)
              if n < 2:
                  return alpha
              sizes = ndimage.sum(lens, lab, range(1, n + 1))
              big = [i + 1 for i in sorted(range(n), key=lambda i: -sizes[i])[:2]]
              xs_l = np.where(lab == big[0])[1]; xs_r = np.where(lab == big[1])[1]
              if xs_l.mean() > xs_r.mean():
                  xs_l, xs_r = xs_r, xs_l
              # the centre line: midway between the two lenses' outer edges
              cx = (float(xs_l.min()) + float(xs_r.max())) / 2.0
              def mirror(x):
                  return int(round(2 * cx - x))
              # tilt: the median height difference between twins over the glass,
              # measured on the inner third of the lens, next to the bridge, which
              # an arm lying along the brow does not reach
              diffs = []
              span = int(xs_l.max()) - int(xs_l.min())
              for x in range(int(xs_l.max()) - span // 3, int(xs_l.max()) + 1):
                  m = mirror(x)
                  if 0 <= m < W and T[x] >= 0 and T[m] >= 0:
                      diffs.append(T[x] - T[m])
              if len(diffs) < 30:
                  return alpha
              offset = float(np.median(diffs))          # left = right + offset
              out = alpha.copy()
              lo, hi = int(cols.min()), int(cols.max())
              for x in range(lo, hi + 1):
                  m = mirror(x)
                  if not (0 <= m < W) or T[x] < 0 or T[m] < 0:
                      continue
                  if int(xs_l.max()) < x < int(xs_r.min()):
                      continue                          # the bridge is its own mirror
                  twin = T[m] + (offset if x < cx else -offset)
                  excess = twin - T[x]                  # >0: this column stands higher than its twin
                  if excess < 3 or excess > 1.0 * rim_t:
                      continue
                  cut_to = int(np.floor(twin)) - 2
                  if cut_to <= T[x]:
                      continue
                  out[:cut_to, x] = 0.0                 # everything above, soft edge included
                  if cut_to < H and out[cut_to, x] > 0.5:
                      out[cut_to, x] *= 0.5
              return out


          def smooth_top_steps(alpha, rim_t):
              """
              Both arms lie along the brow in the same way, so a thin sliver of
              arm can survive the symmetry check on both sides at once. It shows
              as a STEP in the top edge over the glass, outer side higher, where
              the arm tip ends. The brow's own edge never steps there. At such a
              step the inner side's edge is carried outwards as a straight line
              and only what stands above it is removed -- no more than an arm's
              thickness, only over the glass and one rim beyond it, never below
              the line.
              """
              from scipy import ndimage
              solid = alpha > 0.5
              H, W = alpha.shape
              lens, _ = lens_holes(alpha)
              lab, n = ndimage.label(lens)
              if n < 2:
                  return alpha
              sizes = ndimage.sum(lens, lab, range(1, n + 1))
              big = [i + 1 for i in sorted(range(n), key=lambda i: -sizes[i])[:2]]
              boxes = sorted([(int(np.where(lab == i)[1].min()), int(np.where(lab == i)[1].max())) for i in big])
              (lx0, lx1), (rx0, rx1) = boxes
              def profile(al):
                  s = al > 0.5
                  T = np.full(W, -1, dtype=np.int64)
                  for x in np.where(s.any(axis=0))[0]:
                      T[x] = int(np.argmax(s[:, x]))
                  return T
              out = alpha.copy()
              T = profile(out)
              win = max(10, int(round(rim_t * 2)))
              reach = int(round(rim_t))
              for side, (x0, x1) in ((-1, (lx0, lx1)), (1, (rx0, rx1))):
                for _round in range(4):                 # a cut can expose the next step further out
                  done = 0
                  xs = range(x0 + 3, x1 - 3) if side < 0 else range(x1 - 3, x0 + 3, -1)
                  for x in xs:
                      xin, xout = (x + 3, x) if side < 0 else (x - 3, x)
                      if T[xin] < 0 or T[xout] < 0 or T[xin] - T[xout] < 4:
                          continue                          # inner side must be lower (larger y)
                      rng = range(xin, min(W, xin + win)) if side < 0 else range(xin, max(0, xin - win), -1)
                      pts = [(xx, T[xx]) for xx in rng if T[xx] >= 0]
                      if len(pts) < 8:
                          continue
                      px, py = np.array(pts, dtype=np.float64).T
                      a, b = np.polyfit(px, py, 1)
                      stop = max(0, x0 - reach) if side < 0 else min(W - 1, x1 + reach)
                      span = range(xout, stop - 1, -1) if side < 0 else range(xout, stop + 1)
                      changed = False
                      for xx in span:
                          if T[xx] < 0:
                              break
                          line = a * xx + b
                          gap = line - T[xx]
                          if gap < 2:
                              break                         # rejoined the true edge
                          if gap > 1.3 * rim_t:
                              break                         # thicker than an arm: leave it
                          cut_to = int(np.floor(line)) - 2
                          if cut_to > T[xx]:
                              out[:cut_to, xx] = 0.0
                              if cut_to < H and out[cut_to, xx] > 0.5:
                                  out[cut_to, xx] *= 0.5
                              changed = True
                      if changed:
                          done += 1
                          T = profile(out)
                          break                         # start this side again from the outside
                  if done == 0:
                      break
              return out


          def ndimage_label_count(mask):
              from scipy import ndimage
              lab, n = ndimage.label(mask)
              if n:
                  sizes = ndimage.sum(mask, lab, range(1, n + 1))
                  n = int((sizes > mask.size * 0.004).sum())
              return lab, n


          def half_rim_lenses(img, alpha):
              """
              A HALF-RIM frame has metal along the top only; the demo lens hangs
              below it on a nylon thread. There is no closed rim, so the usual
              hole-finding never sees the glass -- and the glass then keeps
              whatever was behind it. The demo lens still has an EDGE, though,
              and the edge shows in the photograph as a thin line all the way
              round: bar underside, both sides, and the thread along the bottom.
              Trace that loop and everything inside it is glass.
              Returns the two lens regions (left, right) as masks, or [].
              """
              import cv2
              from scipy import ndimage
              gray = cv2.cvtColor(np.asarray(img), cv2.COLOR_RGB2GRAY)
              H, W = gray.shape
              solid = alpha > 0.5
              if not solid.any():
                  return []
              ed = cv2.Canny(cv2.GaussianBlur(gray, (3, 3), 0), 40, 110) > 0
              ed = ndimage.binary_closing(ed, structure=np.ones((5, 5), bool))
              free = ~ed
              outside = ndimage.binary_propagation(_border(free), mask=free)
              enclosed = ~outside & ~ed
              lab, n = ndimage.label(enclosed)
              if n == 0:
                  return []
              sizes = ndimage.sum(enclosed, lab, range(1, n + 1))
              ys_s, xs_s = np.where(solid)
              fx0, fx1 = int(xs_s.min()), int(xs_s.max())
              front_w = fx1 - fx0 + 1
              near_solid = ndimage.binary_dilation(solid, iterations=3)
              picks = []
              why = {"size": 0, "shape": 0, "place": 0, "solid": 0, "touch": 0}
              for i in range(1, n + 1):
                  s = float(sizes[i - 1])
                  if s < 0.004 * gray.size or s > 0.4 * gray.size:
                      why["size"] += 1
                      continue
                  comp = lab == i
                  yy, xx = np.where(comp)
                  w = xx.max() - xx.min() + 1; h = yy.max() - yy.min() + 1
                  if w < 0.12 * front_w or w > 0.6 * front_w or h < 0.25 * w or h > 1.5 * w:
                      why["shape"] += 1
                      continue
                  if xx.min() < fx0 - 0.02 * front_w or xx.max() > fx1 + 0.02 * front_w:
                      why["place"] += 1
                      continue                                  # not under the front
                  # (the glass itself is often still solid here -- the model keeps a
                  # demo lens -- so how much of the piece is solid says nothing)
                  top = comp & (np.arange(H)[:, None] < yy.min() + 0.15 * h)
                  touch = (top & near_solid).sum() / max(1.0, float(top.sum()))
                  if touch < 0.05:
                      why["touch"] += 1
                      continue                                  # does not hang from the bar
                  picks.append((s, i))
              picks.sort(reverse=True)
              try:
                  log("half-rim: %d enclosed pieces, %d candidates, rejected %s" % (n, len(picks), why))
              except Exception:
                  pass
              out = []
              for s, i in picks[:2]:
                  comp = lab == i
                  yy, xx = np.where(comp)
                  box = np.zeros_like(comp)
                  box[yy.min():yy.max() + 2, xx.min():xx.max() + 2] = True
                  region = ndimage.binary_fill_holes(comp | (ed & box & ~outside))
                  region[:, :fx0] = False; region[:, fx1 + 1:] = False   # never past the front's ends
                  # a thin band of table shadow hanging under the lens edge is not lens
                  r = max(3, int(round(0.03 * w)))
                  disk = np.zeros((2 * r + 1, 2 * r + 1), bool)
                  gy, gx = np.ogrid[-r:r + 1, -r:r + 1]
                  disk[gy * gy + gx * gx <= r * r] = True
                  region = ndimage.binary_fill_holes(ndimage.binary_opening(region, structure=disk))
                  if region.sum() < 0.5 * s:
                      continue
                  out.append(region)
              if len(out) == 2:
                  out.sort(key=lambda r: float(np.where(r)[1].mean()))
                  # two lenses side by side, alike in size, not overlapping
                  a, b = out
                  if (a & b).any() or abs(a.sum() - b.sum()) > 0.5 * max(a.sum(), b.sum()):
                      try:
                          log("half-rim: two pieces found but they overlap or differ too much (%d vs %d)" % (a.sum(), b.sum()))
                      except Exception:
                          pass
                      return []
                  return out
              try:
                  log("half-rim: %d lens piece(s) kept after the shadow trim -- need 2" % len(out))
              except Exception:
                  pass
              return []


          def apply_half_rim(img, alpha, regions):
              """
              Inside each traced demo lens: everything goes -- the wall or sheet
              seen through it, an arm behind it, the supplier's printing -- so
              the customer's own face shows through. The lens EDGE is kept as a
              faint thin line, as a real demo lens shows one, and so the try-on
              can find the opening. The metal bar and the nose pads lie outside
              the traced glass and are not touched.
              """
              from scipy import ndimage
              out = alpha.copy()
              ring_all = np.zeros_like(alpha, dtype=bool)
              for r in regions:
                  inner = ndimage.binary_erosion(r, iterations=2)
                  ring = r & ~inner
                  out[inner] = 0.0
                  out[ring] = 1.0                 # solid for now, so the arm rules can see the opening
                  ring_all |= ring
              return out, ring_all


          def rim_kind_of(rim_txt):
              """
              The rim type the shop typed when the frame was saved decides the
              robot's path -- it is never guessed from the photo when the shop
              has already said it.
                full    : "Full rim", "full metal", "full frame"
                half    : "Half rim", "supra", "semi rimless"
                rimless : "Rimless", "3 piece"
                ""      : not set -- the robot decides from the photo
              """
              t = str(rim_txt or "").lower()
              if "rimless" in t and "semi" not in t:
                  return "rimless"
              if any(k in t for k in ("half", "supra", "semi")):
                  return "half"
              if "full" in t:
                  return "full"
              if "3 piece" in t or "three piece" in t:
                  return "rimless"
              return ""


          def open_full_rim_lenses(img, alpha, regions):
              """
              FULL RIM whose glass the model kept solid. The traced lens outline
              says where each opening is; inside it, only what LOOKS LIKE GLASS
              goes -- the sheet seen through the lens, or the lens's own colour.
              The rim, the nose pads and the screws differ from that colour and
              keep exactly the alpha the model gave them: nothing is redrawn,
              nothing is thinned, there is no demo-lens line on a full rim.
              """
              from scipy import ndimage
              rgb = np.asarray(img).astype(np.float64)
              sheet = sheet_colour(np.asarray(img))
              d_sheet = np.sqrt(((rgb - sheet) ** 2).sum(axis=2))
              out = alpha.copy()
              for r in regions:
                  core = ndimage.binary_erosion(r, iterations=12)
                  if core.sum() < 50:
                      core = r
                  glass = np.median(rgb[core], axis=0)
                  d_glass = np.sqrt(((rgb - glass) ** 2).sum(axis=2))
                  clear = r & ((d_glass < 40) | (d_sheet < 40))
                  out[clear] = 0.0
              return out


          def clear_sheet_at_ends(img, alpha):
              """
              FULL RIM only. Between the end piece and the rim, where the arm
              leaves the front, the sheet shows through a small gap and the model
              keeps it as a pale wedge. From the transparent outside, sheet-
              coloured pixels are flooded away -- only in the outer fifth of the
              frame at each end, and only when the frame itself is far from the
              sheet colour (a dark frame on a light sheet). The metal, the screw
              and the hinge are not sheet-coloured and stay.
              """
              import cv2
              from scipy import ndimage
              rgb = np.asarray(img).astype(np.float64)
              sheet = sheet_colour(np.asarray(img))
              dist = np.sqrt(((rgb - sheet) ** 2).sum(axis=2))
              dist = cv2.GaussianBlur(dist.astype(np.float32), (3, 3), 0)
              solid = alpha > 0.5
              if not solid.any():
                  return alpha
              rim_ref = np.percentile(dist[solid], 60)
              if rim_ref < 70:
                  return alpha                         # a light frame: colour cannot tell it from the sheet
              ys, xs = np.where(solid)
              x0, x1 = xs.min(), xs.max()
              zone = np.zeros_like(solid)
              w = int(0.20 * (x1 - x0 + 1))
              zone[:, x0:x0 + w] = True
              zone[:, x1 - w + 1:x1 + 1] = True
              sheetlike = (alpha > 0) & (dist < 45) & zone
              outside = alpha <= 0.02
              seed = ndimage.binary_dilation(outside, iterations=1) & sheetlike
              gone = ndimage.binary_propagation(seed, mask=sheetlike)
              out = alpha.copy()
              out[gone] = 0.0
              return out


          def shape_full_rim_front(img, alpha, regions):
              """
              FULL RIM, last step. The front is known exactly once the two lens
              openings are known: the rim is a band of the rim's own thickness
              around each opening, the bridge sits between them, and each end
              piece sits at the outer side of its rim, level with where the rim
              is widest. Anything else in the picture is not the front.

                - the rim band is KEPT, and wherever the photo shows dark rim
                  metal that the model dropped (the bottom rim resting on the
                  sheet's reflection), it is PUT BACK -- the rim is never thinner
                  than photographed, only ever completed
                - the lens openings and the bridge keep what they have (pads,
                  screws, the bridge itself)
                - at each end only the end piece (hinge block, screw) stays: a
                  compact block level with the rim's widest point. The arm rising
                  out of it is thin and goes; the sheet showing between arm and
                  rim goes
                - arm tips crossing above the rims, the stand holes below, shadows
                  on the sheet: outside all of these zones, so they go
              Returns (alpha, info) -- info None when it could not measure.
              """
              import cv2
              from scipy import ndimage
              if len(regions) < 2:
                  return alpha, None
              regs = sorted(regions, key=lambda r: float(np.where(r)[1].mean()))[:2]
              L, R = regs[0], regs[1]
              rgb = np.asarray(img).astype(np.float64)
              lum = rgb[..., 0] * 0.299 + rgb[..., 1] * 0.587 + rgb[..., 2] * 0.114
              H, W = lum.shape
              lens = L | R
              # what the glass shows (the sheet behind it) is the local background
              cores = ndimage.binary_erosion(lens, iterations=12)
              if cores.sum() < 100:
                  cores = lens
              bg_l = float(np.median(lum[cores]))
              dark_t = 0.55 * bg_l
              dark = lum < dark_t

              # rim thickness: from each lens centre walk out along 180 rays; past
              # the opening's edge count the dark pixels. The median over all rays
              # ignores the few rays that run into an end piece or a stand hole.
              runs = []
              for r in (L, R):
                  ys, xs = np.where(r)
                  cy, cx = ys.mean(), xs.mean()
                  for ang in np.linspace(0, 2 * np.pi, 180, endpoint=False):
                      dy, dx = np.sin(ang), np.cos(ang)
                      t = 0.0; inside = True; run = 0; gap = 0; started = False
                      while True:
                          y = int(round(cy + dy * t)); x = int(round(cx + dx * t))
                          if y < 0 or y >= H or x < 0 or x >= W:
                              break
                          if inside:
                              if not r[y, x]:
                                  inside = False
                              t += 1.0
                              continue
                          if dark[y, x]:
                              run += 1 + gap; gap = 0; started = True
                          elif not started and gap < 3:
                              gap += 1
                          elif started and gap < 1:
                              gap += 1
                          else:
                              break
                          if run > 80:
                              break
                          t += 1.0
                      if run > 0:
                          runs.append(run)
              if len(runs) < 60:
                  return alpha, None
              rim_t = float(np.clip(np.median(runs), 3, 60))

              dist_out = ndimage.distance_transform_edt(~lens)
              rim_band = (dist_out > 0) & (dist_out <= rim_t + 2)
              solid = alpha > 0.5
              frame_l = float(np.median(lum[rim_band & solid])) if (rim_band & solid).any() else 255.0
              dark_frame = frame_l < 0.5 * bg_l

              # the boxes the zones are built from
              def box(r):
                  ys, xs = np.where(r)
                  return xs.min(), xs.max(), ys.min(), ys.max()
              lx0, lx1, ly0, ly1 = box(L)
              rx0, rx1, ry0, ry1 = box(R)
              lens_h = float(max(ly1 - ly0, ry1 - ry0))
              top = min(ly0, ry0)
              cL = np.where(L)[1].mean(); cR = np.where(R)[1].mean()
              midy = (ly0 + ly1 + ry0 + ry1) / 4.0

              bridge = np.zeros_like(solid)
              by0 = int(max(0, top - 3 * rim_t))
              by1 = int(min(H, midy + 0.10 * lens_h))
              bx0 = int(max(0, lx1 - 2 * rim_t)); bx1 = int(min(W, rx0 + 2 * rim_t + 1))
              bridge[by0:by1, bx0:bx1] = True

              ends = np.zeros_like(solid)
              def yc_at(r, xedge):
                  ys, xs = np.where(r)
                  sel = np.abs(xs - xedge) <= 3
                  return float(ys[sel].mean()) if sel.any() else float(ys.mean())
              band_h = 0.20 * lens_h
              reach = int(0.40 * (lx1 - lx0))
              yl = yc_at(L, lx0); yr = yc_at(R, rx1)
              ends[int(max(0, yl - band_h)):int(min(H, yl + band_h)),
                   int(max(0, lx0 - reach)):int(lx0 + 1)] = True
              ends[int(max(0, yr - band_h)):int(min(H, yr + band_h)),
                   int(rx1):int(min(W, rx1 + reach + 1))] = True
              ends &= ~rim_band & ~lens
              # the end piece is a compact block; the arm rising out of it is a
              # line of about the rim's own width -- an opening a little wider
              # than the rim keeps the block and drops the line
              end_px = ends & solid
              if dark_frame:
                  end_px &= dark | (alpha < 0.99)          # the sheet between arm and rim is not frame
              rad = int(max(3, round(rim_t * 0.9)))
              k = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (2 * rad + 1, 2 * rad + 1))
              end_px = cv2.morphologyEx(end_px.astype(np.uint8), cv2.MORPH_OPEN, k) > 0
              # only a block that actually meets the rim is an end piece
              lab, n = ndimage.label(end_px)
              touch = ndimage.binary_dilation(rim_band & (solid | dark), iterations=2)
              keep_end = np.zeros_like(end_px)
              for i in range(1, n + 1):
                  comp = lab == i
                  if (comp & touch).any():
                      keep_end |= comp
              # soften the block's edge back in (the opening squares it off a little)
              keep_end = ndimage.binary_dilation(keep_end, iterations=1) & (alpha > 0) & ends

              front = lens | rim_band | bridge | keep_end
              out = np.where(front, alpha, 0.0).astype(np.float32)
              put_back = 0
              if dark_frame:
                  # the rim as photographed: every dark pixel in the rim band is rim
                  rim_dark = rim_band & dark
                  put_back = int((rim_dark & (out < 0.5)).sum())
                  out = np.maximum(out, rim_dark.astype(np.float32))
                  # the glass edge: where the lens meets the rim the glass catches
                  # the light and the photo shows a white line hugging the rim's
                  # inside (measured on Lot: 3-5 px at lum 250-255, fully opaque).
                  # On a face it reads as a broken, patchy rim. It is glass, not
                  # metal: flooded away from the clear opening through pale pixels
                  # only, so it stops at the dark metal -- a highlight lying ON the
                  # metal, with dark on both sides, is never reached. The nose-pad
                  # corner is left alone (clear silicone pads are pale too).
                  dist_in = ndimage.distance_transform_edt(lens)
                  near_edge = (lens & (dist_in <= 8)) | rim_band
                  pads = np.zeros_like(solid)
                  px0 = int(lx1 - 0.30 * (lx1 - lx0)); px1 = int(rx0 + 0.30 * (rx1 - rx0))
                  pads[int(max(0, midy - 0.05 * lens_h)):, max(0, px0):min(W, px1 + 1)] = True
                  pale = (lum >= dark_t) & near_edge & ~pads & (out > 0.02)
                  seed = ndimage.binary_dilation(out <= 0.02, iterations=1) & pale
                  glass_edge = ndimage.binary_propagation(seed, mask=pale)
                  out[glass_edge] = 0.0
                  info_glass = int(glass_edge.sum())
              else:
                  info_glass = 0
              info = {"rimT": round(rim_t, 1), "bgL": round(bg_l), "frameL": round(frame_l),
                      "darkFrame": bool(dark_frame), "rimPutBack": put_back, "glassEdge": info_glass,
                      "removed": int((solid & ~front).sum())}
              return out, info


          def lens_measurements(alpha, regions, half_rim=True):
              """The numbers the try-on uses, from traced lens regions."""
              ys, xs = np.where(alpha > 0.2)
              if not xs.size:
                  return {}
              front_w = int(xs.max() - xs.min() + 1)
              front_h = int(ys.max() - ys.min() + 1)
              out = {"frontWidthPx": front_w, "frontHeightPx": front_h, "halfRim": bool(half_rim)}
              eyes = []
              boxes = []
              for r in regions:
                  yy, xx = np.where(r)
                  boxes.append((int(xx.min()), int(xx.max()), int(yy.min()), int(yy.max())))
              for (x0, x1, y0, y1) in boxes:
                  eyes.append({"centreX": float((x0 + x1) / 2.0), "centreY": float((y0 + y1) / 2.0),
                               "widthPx": int(x1 - x0 + 1), "heightPx": int(y1 - y0 + 1),
                               "centreXFrac": float(((x0 + x1) / 2.0 - xs.min()) / front_w)})
              out["lenses"] = eyes
              if len(boxes) == 2:
                  out["bridgePx"] = int(boxes[1][0] - boxes[0][1])
                  out["pupilGapPx"] = float(eyes[1]["centreX"] - eyes[0]["centreX"])
              return out


          def cut_end_to_end(alpha):
              """
              The front try-on picture: arms removed, end pieces kept.

              Walking in from each side, a column belonging to an arm is far
              shorter than a column belonging to a rim. Columns shorter than 12%
              of the frame's depth are dropped; the walk stops at the first proper
              column, which is the end piece. Nothing is thinned: whole columns of
              arm are dropped, never a pixel of what is kept.
              """
              # measure with the solid part only: the soft edge the matting adds
              # around a thin arm must not make it look as deep as a rim
              A = alpha > 0.5
              heights = A.sum(axis=0)
              if not heights.any():
                  return alpha
              depth = float(heights.max())
              thin = heights < depth * 0.12
              W = alpha.shape[1]
              left = 0
              while left < W and (heights[left] == 0 or thin[left]):
                  left += 1
              right = W - 1
              while right > left and (heights[right] == 0 or thin[right]):
                  right -= 1
              out = alpha.copy()
              out[:, :left] = 0.0
              out[:, right + 1:] = 0.0
              return out


          def measurements(alpha):
              """Lens centres, widths, bridge and front width, in pixels and as
              fractions of the front width -- the numbers the try-on engine uses."""
              from scipy import ndimage
              lens, _ = lens_holes(alpha)
              ys, xs = np.where(alpha > 0.2)
              if not xs.size:
                  return {}
              front_w = int(xs.max() - xs.min() + 1)
              front_h = int(ys.max() - ys.min() + 1)
              out = {"frontWidthPx": front_w, "frontHeightPx": front_h}
              lab, n = ndimage.label(lens)
              if n < 1:
                  return out
              boxes = []
              for i in range(1, n + 1):
                  yy, xx = np.where(lab == i)
                  boxes.append((xx.min(), xx.max(), yy.min(), yy.max(), xx.size))
              boxes.sort(key=lambda b: -b[4])
              boxes = sorted(boxes[:2], key=lambda b: b[0])
              eyes = []
              for (x0, x1, y0, y1, _s) in boxes:
                  eyes.append({
                      "centreX": float((x0 + x1) / 2.0),
                      "centreY": float((y0 + y1) / 2.0),
                      "widthPx": int(x1 - x0 + 1),
                      "heightPx": int(y1 - y0 + 1),
                      "centreXFrac": float(((x0 + x1) / 2.0 - xs.min()) / front_w),
                  })
              out["lenses"] = eyes
              if len(boxes) == 2:
                  out["bridgePx"] = int(boxes[1][0] - boxes[0][1])
                  out["pupilGapPx"] = float(eyes[1]["centreX"] - eyes[0]["centreX"])
              return out


          # ---------------------------------------------------------------- reading
          # The shop's own rules for shape, rim type, material and colour, moved
          # from the phone (where they ran on a weak cut) onto the robot's clean
          # cut. Every reading is a suggestion: it fills an empty box in admin and
          # never overwrites a choice the shop made.

          NAMED_COLOURS = [
              ("black", (27, 27, 32)), ("gunmetal", (75, 78, 85)), ("grey", (141, 141, 149)),
              ("silver", (185, 188, 194)), ("white", (236, 239, 242)),
              ("brown", (107, 74, 42)), ("tortoise", (122, 74, 30)), ("gold", (154, 115, 40)), ("amber", (156, 86, 32)),
              ("navy", (29, 47, 87)), ("blue", (47, 91, 140)), ("green", (47, 107, 69)), ("forest", (34, 80, 58)),
              ("red", (166, 48, 48)), ("burgundy", (107, 31, 46)), ("pink", (192, 122, 142)),
              ("purple", (91, 58, 104)), ("plum", (77, 42, 86)),
              ("light blue", (143, 179, 217)), ("light purple", (183, 156, 207)), ("light pink", (227, 180, 196)),
              ("light grey", (196, 198, 204)), ("light green", (157, 201, 168)), ("light brown", (184, 145, 106)),
              ("transparent blue", (169, 196, 222)), ("transparent purple", (195, 169, 214)),
              ("transparent brown", (201, 168, 130)), ("transparent pink", (230, 194, 207)), ("transparent green", (180, 212, 188)),
          ]


          def name_colour(rgb, bg_lum):
              r, g, b = rgb
              lum = r * .299 + g * .587 + b * .114
              mx, mn = max(rgb), min(rgb)
              sat = (mx - mn) / mx if mx else 0
              if sat < 0.10 and bg_lum > 0 and abs(lum - bg_lum) < 28:
                  return "transparent"
              if sat < 0.10 and lum > 205:
                  return "white"
              best, bd = "black", 1e18
              for n, c in NAMED_COLOURS:
                  d = (r - c[0]) ** 2 * 0.3 + (g - c[1]) ** 2 * 0.59 + (b - c[2]) ** 2 * 0.11
                  if d < bd:
                      bd, best = d, n
              return best


          def read_colours(rgb, alpha, bg_lum):
              """Top and bottom band of the rim: two names, and whether they differ."""
              H = alpha.shape[0]
              solid = alpha >= 0.8
              out = []
              for y0, y1 in ((0, int(H * 0.40)), (int(H * 0.60), H)):
                  m = solid[y0:y1]
                  px = rgb[y0:y1][m]
                  out.append(px.reshape(-1, 3).mean(axis=0) if px.size else None)
              top, bot = out
              if top is None:
                  return None
              tn = name_colour(tuple(top), bg_lum)
              bn = name_colour(tuple(bot), bg_lum) if bot is not None else tn
              hx = lambda c: "#%02x%02x%02x" % tuple(int(round(v)) for v in c)
              return {"top": tn.title(), "bottom": bn.title(), "topHex": hx(top),
                      "bottomHex": hx(bot) if bot is not None else hx(top), "twoTone": tn != bn}


          def read_shape(alpha):
              """Shape, rim type and material from the two lens openings.

              Everything about the OPENING is judged from the enclosed hole itself
              (lens_holes), never from "anything transparent inside its box": the
              corners of a round lens's box lie outside the frame and would make
              every round frame read as square. The RIM is judged from the alpha
              just outside the hole."""
              from scipy import ndimage
              H, W = alpha.shape
              OPEN = 40 / 255.0
              lens, _ = lens_holes(alpha)
              lab, n = ndimage.label(lens)
              if n < 2:
                  # no enclosed openings: a full rim always makes two, so this is a
                  # half rim or rimless front. Shape cannot be read; the rim can.
                  return {"shape": "", "rim": "Half rim", "material": "", "shapeSure": False,
                          "rimSure": False, "detail": {"holes": int(n)}}
              sizes = ndimage.sum(lens, lab, range(1, n + 1))
              idx = [i + 1 for i in sorted(range(n), key=lambda i: -sizes[i])[:2]]
              holes = []
              for i in idx:
                  yy, xx = np.where(lab == i)
                  holes.append((int(xx.min()), int(xx.max()), int(yy.min()), int(yy.max()), lab == i))
              holes.sort(key=lambda b: b[0])
              per = []
              for i, (x0, x1, y0, y1, hole) in enumerate(holes):
                  bw, bh = x1 - x0 + 1, y1 - y0 + 1
                  if bw < 8 or bh < 8:
                      return None
                  rows = hole[y0:y1 + 1].sum(axis=1).astype(float)      # opening width per row
                  q = max(1, bh // 4)
                  top_w, bot_w, mid_w = rows[:q].mean(), rows[-q:].mean(), rows.max()
                  fill = float(hole.sum()) / (bw * bh)                    # 0.785 circle, ~0.95 square
                  outer = (i == 0)
                  # the top edge of the opening, outer band vs inner band (cat eye lifts the outer)
                  def edge_top(f0, f1):
                      tops = []
                      for x in range(x0 + int(round(bw * f0)), min(x1, x0 + int(round(bw * f1))) + 1):
                          col = np.where(hole[:, x])[0]
                          if col.size: tops.append(col.min() - y0)
                      return float(np.mean(tops)) if tops else 0.0
                  outer_edge = edge_top(0.05, 0.30) if outer else edge_top(0.70, 0.95)
                  inner_edge = edge_top(0.70, 0.95) if outer else edge_top(0.05, 0.30)
                  lift = (inner_edge - outer_edge) / bh
                  # the opening's outer side: does it reach further out at the top than at the bottom?
                  def outer_reach(f0, f1):
                      vals = []
                      for y in range(y0 + int(round(bh * f0)), min(y1, y0 + int(round(bh * f1))) + 1):
                          r = np.where(hole[y])[0]
                          if r.size: vals.append((x0 + bw - r.min()) if outer else (r.max() - x0))
                      return float(np.mean(vals)) if vals else 0.0
                  flare = (outer_reach(0.05, 0.25) - outer_reach(0.75, 0.95)) / bw
                  # rim thickness above and below, thinnest of three columns
                  def thick(xf, d):
                      cx = min(x1, x0 + int(round(bw * xf)))
                      col = np.where(hole[:, cx])[0]
                      if not col.size: return 0
                      y = (col.min() - 1) if d < 0 else (col.max() + 1)
                      k = 0
                      while 0 <= y < H and alpha[y, cx] >= OPEN and k < H:
                          k += 1; y += d
                      return k
                  rim_top = min(thick(0.3, -1), thick(0.5, -1), thick(0.7, -1))
                  rim_bot = min(thick(0.3, 1), thick(0.5, 1), thick(0.7, 1))
                  per.append(dict(ratio=bw / bh, fill=fill, topBot=top_w / bot_w if bot_w else 9.0,
                                  lift=lift, flare=flare, rimTop=rim_top, rimBot=rim_bot, bh=bh))
              m = lambda k: (per[0][k] + per[1][k]) / 2
              ratio, fill, top_bot = m("ratio"), m("fill"), m("topBot")
              lift, flare, rim_top, rim_bot, bh = m("lift"), m("flare"), m("rimTop"), m("rimBot"), m("bh")
              if lift > 0.08: shape = "Cat eye"
              elif rim_top > 0 and rim_bot > 0 and rim_top > rim_bot * 2.4: shape = "Browline"
              elif top_bot > 1.35 and fill < 0.88: shape = "Aviator"          # teardrop: wide top, narrow bottom
              elif flare > 0.08 or (top_bot > 1.12 and fill >= 0.80): shape = "Wayfarer"
              elif ratio < 1.15: shape = "Square" if fill >= 0.86 else "Round"
              else: shape = "Rectangle" if fill >= 0.86 else "Oval"
              rim = "Rimless" if (rim_bot == 0 and rim_top == 0) else ("Half rim" if rim_bot == 0 else "Full rim")
              rel = rim_top / bh if bh else 0
              material = "" if rim == "Rimless" else ("Metal" if rel <= 0.06 else ("Acetate" if rel >= 0.10 else ""))
              shape_sure = not ((0.82 < fill < 0.90) or (0.05 < lift < 0.11) or (1.25 < top_bot < 1.45) or
                                (1.08 < ratio < 1.22 and shape in ("Square", "Round", "Rectangle", "Oval")))
              rim_sure = rim_bot >= 3 if rim == "Full rim" else True
              return {"shape": shape, "rim": rim, "material": material,
                      "shapeSure": bool(shape_sure), "rimSure": bool(rim_sure),
                      "detail": {k: round(float(v), 3) for k, v in
                                 dict(ratio=ratio, fill=fill, topBot=top_bot, lift=lift, flare=flare,
                                      rimTop=rim_top, rimBot=rim_bot).items()}}


          def read_frame(img, alpha):
              """What a camera can see about the frame, from the finished cut."""
              out = {}
              try:
                  rgb = np.asarray(img.convert("RGB"))
                  H, W = alpha.shape
                  border = np.concatenate([rgb[0, :], rgb[-1, :], rgb[:, 0], rgb[:, -1]]).astype(np.float64)
                  bg_lum = float((border[:, 0] * .299 + border[:, 1] * .587 + border[:, 2] * .114).mean())
                  col = read_colours(rgb, alpha, bg_lum)
                  if col: out["colour"] = col
              except Exception as e:
                  out["colourError"] = str(e)[:80]
              try:
                  geo = read_shape(alpha)
                  if geo: out["geometry"] = geo
              except Exception as e:
                  out["shapeError"] = str(e)[:80]
              return out


          def apply_reading(p, reading):
              """Fill the boxes the shop left empty. Never overwrite a choice."""
              filled = []
              was_auto = set(p.get("autoFields") or [])
              def put(field, value, sure=True):
                  if not value: return
                  if p.get(field) and field not in was_auto: return
                  if p.get(field) == value: return
                  p[field] = value; was_auto.add(field); filled.append(field + ("" if sure else "?"))
              col = reading.get("colour") or {}
              geo = reading.get("geometry") or {}
              if col:
                  put("colour", col.get("top"), True)
                  if col.get("twoTone"): put("colour2", col.get("bottom"), False)
              if geo:
                  put("shape", geo.get("shape"), geo.get("shapeSure", False))
                  put("rim", geo.get("rim"), geo.get("rimSure", False))
                  put("material", geo.get("material"), False)
              p["autoFields"] = sorted(was_auto)
              p["robotRead"] = reading
              return filled


          def sheet_colour(rgb):
              """The sheet the frame lies on: the median of the picture's border."""
              b = np.concatenate([rgb[0, :], rgb[-1, :], rgb[:, 0], rgb[:, -1]]).astype(np.float64)
              return np.median(b, axis=0)


          def pad_with_sheet(img, frac=0.15):
              """A photo cropped tight to the frame has no sheet around it, and the
              model then answers "the object is everything". Give it a margin of
              sheet colour; the margin is removed again after cutting."""
              rgb = np.asarray(img)
              H, W = rgb.shape[:2]
              py, px = int(H * frac), int(W * frac)
              col = tuple(int(round(v)) for v in sheet_colour(rgb))
              out = Image.new("RGB", (W + 2 * px, H + 2 * py), col)
              out.paste(img, (px, py))
              return out, (px, py)


          def clear_glass_by_colour(img, alpha, band_px):
              """
              The glass shows the sheet through it, so inside the frame a pixel
              close to the sheet colour is glass, not rim: rim sits about 210 away
              from the sheet, glass about 82 (measured on the shop's own photo).
              Only pixels well INSIDE the frame outline are considered, so the
              outer edge of the rim is never touched.
              """
              import cv2
              rgb = np.asarray(img).astype(np.float64)
              sheet = sheet_colour(np.asarray(img))
              dist = np.sqrt(((rgb - sheet) ** 2).sum(axis=2))
              solid = (alpha > 0.5).astype(np.uint8)
              inside = cv2.distanceTransform(solid, cv2.DIST_L2, 5) > band_px      # away from the outer edge
              rim_ref = np.percentile(dist[(solid == 1) & ~inside], 60) if ((solid == 1) & ~inside).any() else 200.0
              if rim_ref < 70:
                  # a crystal or very pale rim sits almost on the sheet colour: glass and
                  # rim cannot be told apart by colour, and the rim must never be thinned
                  return alpha, False
              thresh = max(35.0, min(0.45 * rim_ref, 90.0))
              glass = inside & (dist < thresh)
              if not glass.any():
                  return alpha, False
              k = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (5, 5))
              glass = cv2.morphologyEx(glass.astype(np.uint8), cv2.MORPH_OPEN, k).astype(bool)
              out = alpha.copy()
              out[glass] = 0.0
              return out, True


          def fill_lens_hulls(alpha, band_px):
              """A temple or hinge seen through the glass leaves a dark notch in
              the opening. Each opening is a smooth shape, so its convex hull is
              the true opening; fill it -- but only where that is clear of the
              rim's outer edge, which keeps rounded corners and the rim itself."""
              import cv2
              from scipy import ndimage
              lens, outside = lens_holes(alpha)
              if not lens.any():
                  return alpha
              solid = (alpha > 0.5).astype(np.uint8)
              inside = cv2.distanceTransform(solid | lens.astype(np.uint8), cv2.DIST_L2, 5) > band_px * 1.5
              lab, n = ndimage.label(lens)
              out = alpha.copy()
              for i in range(1, n + 1):
                  ys, xs = np.where(lab == i)
                  if xs.size < 50:
                      continue
                  pts = np.stack([xs, ys], axis=1).astype(np.int32)
                  hull = cv2.convexHull(pts)
                  canvas = np.zeros(alpha.shape, np.uint8)
                  cv2.fillConvexPoly(canvas, hull, 1)
                  fill = (canvas == 1) & inside & ~outside
                  out[fill] = 0.0
              return out


          def tighten_edge(alpha):
              """
              The matte leaves a wide soft band either side of the edge. The true
              edge is where alpha crosses one half; that line is kept exactly where
              it is (so the rim is never thinned), while pixels well below a half go
              to zero and pixels well above go to one. What remains is a 1-2 px
              soft edge instead of a 10-30 px glow.
              """
              return np.clip((alpha - 0.25) / 0.5, 0.0, 1.0).astype(np.float32)


          def strip_sheet_ring(img, alpha):
              """
              Right next to the rim the sheet is slightly darkened by the frame's
              shadow, so the model keeps a thin ring of it as if it were frame. A
              pixel on the transparent boundary whose colour is still close to the
              sheet is sheet, and goes. Guarded exactly like the glass rule: never
              when the rim itself is near the sheet colour.
              """
              import cv2
              rgb = np.asarray(img).astype(np.float64)
              sheet = sheet_colour(np.asarray(img))
              dist = np.sqrt(((rgb - sheet) ** 2).sum(axis=2))
              dist = cv2.GaussianBlur(dist.astype(np.float32), (3, 3), 0)   # judge by neighbourhood, not lone pixels
              solid = (alpha > 0.5).astype(np.uint8)
              if not solid.any():
                  return alpha
              rim_ref = np.percentile(dist[solid == 1], 60)
              if rim_ref < 70:
                  return alpha
              thresh = max(35.0, min(0.45 * rim_ref, 90.0))
              out = alpha.copy()
              for _ in range(4):                       # peel the ring a few pixels at a time
                  solid = (out > 0.5).astype(np.uint8)
                  near_edge = cv2.distanceTransform(solid, cv2.DIST_L2, 5) <= 3
                  ring = (out > 0) & near_edge & (dist < thresh)
                  if not ring.any():
                      break
                  out[ring] = 0.0
              # a 3x3 smoothing of the edge only: symmetric, so the half-way line --
              # the rim's true edge -- stays where it is; nothing is thinned
              edge = (out > 0) & (out < 1)
              edge = cv2.dilate(edge.astype(np.uint8), np.ones((3, 3), np.uint8)) > 0
              smooth = cv2.GaussianBlur(out, (3, 3), 0)
              out = np.where(edge, smooth, out).astype(np.float32)
              return out


          def unmix_edge(img, alpha):
              """
              The pale 'ice' fringe: an edge pixel is part rim, part sheet, and the
              cut keeps the mixed colour. Undo the mix so every partly transparent
              pixel carries the rim's own colour, transparency unchanged. Uses the
              matting library's foreground estimate; falls back to unmixing against
              the sheet colour if that is unavailable.
              """
              rgb = np.asarray(img).astype(np.float64) / 255.0
              try:
                  from pymatting import estimate_foreground_ml
                  fg = estimate_foreground_ml(rgb, alpha.astype(np.float64))
              except Exception:
                  sheet = sheet_colour(np.asarray(img)) / 255.0
                  a3 = np.clip(alpha, 1e-3, 1.0)[..., None]
                  fg = (rgb - (1 - a3) * sheet) / a3
              fg = np.clip(fg, 0, 1)
              # solid pixels keep the photo exactly; only the soft edge is un-mixed
              solid = (alpha >= 0.98)[..., None]
              out = np.where(solid, rgb, fg)
              return (out * 255).round().astype(np.uint8)


          def cut(photo_bytes, front=True, rim_kind=""):
              """One photo in, one transparent PNG (and its numbers) out.
              rim_kind comes from the rim type typed in admin (see rim_kind_of)."""
              half_rim_hint = rim_kind in ("half", "rimless")
              import cv2
              img = Image.open(io.BytesIO(photo_bytes)).convert("RGB")
              if max(img.size) > 1600:
                  s = 1600.0 / max(img.size)
                  img = img.resize((int(img.width * s), int(img.height * s)), Image.LANCZOS)
              img, (px, py) = pad_with_sheet(img)                   # margin for the model

              m = coarse_mask(img)                                  # step 2
              m = largest_component(m)
              band_px = max(6, min(24, int(round(12 * max(img.size) / 1440.0))))
              tri = make_trimap(m, band_px)                         # step 3
              a = matte(img, tri)                                   # step 4
              a = tighten_edge(a)                                   # step 4b: a 1-2 px edge, not a glow
              a = heal_rim(a)                                       # step 4c: a highlight slit inside the rim is rim
              a = firm_rim(a)                                       # a speckled metal bar/rim is made solid inside (any frame)
              # HALF-RIM: metal on top only, the demo lens on a thread below. No closed
              # hole, so trace the lens edge from the photograph instead; its ring is
              # made solid for the moment so every rule below sees a proper opening.
              half_ring = None; half_regions = []
              if front and rim_kind == "full":
                  # FULL RIM (typed in admin): never the half-rim path. If the
                  # model kept the glass solid, the traced outline is used only to
                  # find the openings; the rim itself is left exactly as cut.
                  h0, _ = lens_holes(a)
                  h_lab, h_n = ndimage_label_count(h0)
                  log("    rim type: full rim (%d clean lens holes)" % h_n)
                  if h_n < 2:
                      half_regions = half_rim_lenses(img, a)
                      if half_regions:
                          a = open_full_rim_lenses(img, a, half_regions)
              elif front:
                  h0, _ = lens_holes(a)
                  h_lab, h_n = ndimage_label_count(h0)
                  log("    rim type: %s" % (rim_kind or "not set"))
                  if half_rim_hint or h_n < 2:
                      half_regions = half_rim_lenses(img, a)
                      if half_regions:
                          a, half_ring = apply_half_rim(img, a, half_regions)
                          a = firm_rim(a)                          # a speckled metal bar is made solid inside
              holes, _ = lens_holes(a)
              if not holes.any():
                  # the model kept the lenses solid (common for clear glass):
                  # clear them by colour where the sheet shows through
                  a, _ = clear_glass_by_colour(img, a, band_px)     # step 5a
              a = fill_lens_hulls(a, band_px)                       # step 5b: temple/hinge through the glass
              a = clear_inner_lens(a)                               # step 5c: tinted glass, leftovers
              if front:
                  # step 6a: the shop shoots with the arms OPEN, so arms rising above the
                  # front are removed here (v2, 2026-09-18: the first version also cut
                  # hinge blocks and the top of the bridge; this one never examines the
                  # bridge and keeps anything seated on the front's top edge).
                  a, arms_above = remove_arms_above(a, img)
                  if half_ring is None:
                      a = cut_end_to_end(a)                         # step 6b: arms beyond the ends
                  # (a half-rim's end pieces are thin metal and would be mistaken for arm)
                  a = trim_narrow_above(a, globals().get("LAST_RIM_T", 24.0))   # step 6b2: narrow stubs above the front
                  a = mirror_top(a, globals().get("LAST_RIM_T", 24.0))          # step 6b3: a flat arm along one brow, by symmetry
                  a = smooth_top_steps(a, globals().get("LAST_RIM_T", 24.0))    # step 6b4: a symmetric arm sliver, by its step
                  a = clean_ghosts(a)                                            # step 6b5: no floating soft outlines
                  a = clear_behind_glass(a)                         # step 6c: nothing seen through the lenses
                  a = trim_ends(a)                                  # step 6d: half a millimetre off each end
              a = strip_sheet_ring(img, a)                          # step 7: the sheet's shadow ring next to the rim
              if front and rim_kind == "full":
                  a = clear_sheet_at_ends(img, a)                   # step 7b: sheet wedge between end piece and rim
              if front:
                  # any front frame: what is not joined to the main frame -- an arm
                  # tip below the glass, a fleck along the rim's edge -- goes. This
                  # only drops pieces well apart from the frame; it never touches
                  # the frame's own outline, so the rim is never thinned.
                  before_ks = int((a > 0.5).sum())
                  a = keep_main_solid(a)
                  after_ks = int((a > 0.5).sum())
                  if half_ring is not None and half_rim_hint:
                      # trim_whiskers erodes anything thinner than its disk -- right
                      # for a genuine half-rim's demo-lens thread, too risky for a
                      # full-rim frame that only fell into this path because its
                      # first pass found fewer than 2 clean lens holes: on a thin
                      # metal frame it can sever a real hinge tab from the front,
                      # stranding it as a floating fleck. Only run it when the
                      # product's own rim type says this frame really is half-rim.
                      a = trim_whiskers(a)                          # a thread or cord a few pixels wide
                      after_tw1 = int((a > 0.5).sum())
                      log("    half-rim cleanup: solid %d -> keep_main_solid %d -> trim %d"
                          % (before_ks, after_ks, after_tw1))
                  else:
                      log("    full-rim cleanup: solid %d -> keep_main_solid %d"
                          % (before_ks, after_ks))
              if front and rim_kind == "full":
                  regs = half_regions
                  if len(regs) < 2:
                      from scipy import ndimage as _nd
                      hh, _ = lens_holes(a)
                      lab_h, n_h = _nd.label(hh)
                      if n_h >= 2:
                          sz = _nd.sum(hh, lab_h, range(1, n_h + 1))
                          order = np.argsort(sz)[::-1][:2]
                          regs = [lab_h == (i + 1) for i in order]
                  if len(regs) >= 2:
                      a, finfo = shape_full_rim_front(img, a, regs)
                      log("    full-rim front: %s" % (finfo,))
              if half_ring is not None:
                  # the demo lens edge: a faint thin line, as a real one shows
                  a = np.where(half_ring & (a > 0.5), np.float32(0.45), a).astype(np.float32)

              # the margin comes off again
              H, W = a.shape
              a = a[py:H - py, px:W - px]
              img = img.crop((px, py, W - px, H - py))

              if half_regions:
                  half_regions = [rg[py:H - py, px:W - px] for rg in half_regions]
                  nums = lens_measurements(a, half_regions, half_rim=half_ring is not None)
              else:
                  nums = measurements(a)
              nums["reading"] = read_frame(img, a) if front else {}
              if False:   # arms over the front are normal for this shop: no CHECK PHOTO tag
                  nums["warning"] = ("arms were angled over the front (%d%% of the picture removed) "
                                     "-- fold them flat behind, or open them straight back, and re-shoot"
                                     % round(arms_above * 100))
              rgba = np.dstack([unmix_edge(img, a), (a * 255).round().astype(np.uint8)])
              ys, xs = np.where(a > 0.02)
              if ys.size:
                  pad = 4
                  y0, y1 = max(0, ys.min() - pad), min(a.shape[0], ys.max() + pad + 1)
                  x0, x1 = max(0, xs.min() - pad), min(a.shape[1], xs.max() + pad + 1)
                  rgba = rgba[y0:y1, x0:x1]
                  if nums.get("lenses"):        # the lens numbers follow the final crop
                      for e in nums["lenses"]:
                          e["centreX"] = float(e["centreX"] - x0); e["centreY"] = float(e["centreY"] - y0)
                      nums["frontWidthPx"] = int(x1 - x0); nums["frontHeightPx"] = int(y1 - y0)
              buf = io.BytesIO()
              Image.fromarray(rgba, "RGBA").save(buf, "PNG", optimize=True)
              return buf.getvalue(), nums


          # ---------------------------------------------------------------- the round

          def front_photo(p):
              ang = p.get("anglePhotos") if isinstance(p.get("anglePhotos"), dict) else {}
              # the photo AS TAKEN first (d16.62 admin uploads it plain); the
              # sharpened copies only if that is all an older frame has
              for v in (p.get("rawFrontUrl"), p.get("originalUrl"), ang.get("front"), p.get("url")):
                  if isinstance(v, str) and v.startswith("http"):
                      return v
              return None


          def angle_photo(p):
              ang = p.get("anglePhotos") if isinstance(p.get("anglePhotos"), dict) else {}
              for v in (p.get("rawAngleUrl"), ang.get("angle")):
                  if isinstance(v, str) and v.startswith("http"):
                      return v
              for g in (p.get("gallery") or []):
                  if isinstance(g, dict) and g.get("view") == "angle" and str(g.get("url", "")).startswith("http"):
                      return g["url"]
              return None


          def side_photo(p):
              ang = p.get("anglePhotos") if isinstance(p.get("anglePhotos"), dict) else {}
              for v in (p.get("rawSideUrl"), p.get("sidePhoto"), ang.get("side")):
                  if isinstance(v, str) and v.startswith("http"):
                      return v
              return None


          def waiting(p):
              """A frame is waiting if it has a photo but no ready cut-out."""
              if p.get("tryOnLocked"):
                  return False
              if p.get("tryOnOk") is False:
                  return False          # try-on switched off by hand in admin: leave it          # a cut-out the shop supplied by hand: never touch
              if (p.get("tryOnFails") or 0) >= MAX_TRIES:
                  return False          # already rejected: waiting for a better photo
              if p.get("tryOnReady") and p.get("tryOnUrl"):
                  return False
              return bool(front_photo(p))


          def plain_reason(err):
              """Turn a technical failure into something a photographer can act on."""
              t = str(err).lower()
              if "no frame" in t or "nothing" in t or "empty" in t:
                  return "no frame found in the photo"
              if "cloudinary" in t:
                  return "the photo store refused the upload (%s)" % str(err)[len("Cloudinary refused: "):][:120]
              if "timed out" in t or "timeout" in t or "connection" in t:
                  return "the photo could not be downloaded"
              if "lens" in t:
                  return "the lenses could not be made clear"
              return "the photo could not be cut (%s)" % str(err)[:80]


          def alert_numbers():
              """Numbers to message, from the shop settings: number:key, number:key."""
              raw = os.environ.get("ALERT_NUMBERS") or ""
              if not raw:
                  for key in ("settings", "shop"):
                      s = fetch_setting(key) or {}
                      raw = s.get("alertWhatsApp") or s.get("alertNumbers") or ""
                      if raw:
                          break
              out = []
              for part in str(raw).replace(";", ",").split(","):
                  part = part.strip()
                  if not part:
                      continue
                  num, _, key = part.partition(":")
                  num = "".join(ch for ch in num if ch.isdigit())
                  if num and key.strip():
                      out.append((num, key.strip()))
              return out


          def whatsapp(text):
              """Message the shop. Free service, so a failure here is never fatal."""
              for num, key in alert_numbers():
                  try:
                      requests.get("https://api.callmebot.com/whatsapp.php",
                                   params={"phone": num, "text": text, "apikey": key},
                                   timeout=45)
                      log("    alert sent to %s" % num[-4:])
                  except Exception as e:
                      log("    alert to %s failed: %s" % (num[-4:], str(e)[:80]))


          def health(patch):
              """The line the admin health check reads."""
              try:
                  import datetime
                  now = datetime.datetime.utcnow().isoformat() + "Z"
                  rows = requests.get(SUPABASE_URL + "/rest/v1/products?select=id,data&id=eq.__robot",
                                      headers=sb_headers(), timeout=30).json() or []
                  keep = (rows[0].get("data") if rows else None) or {}
                  keep.update(patch)
                  keep["lastRun"] = now
                  if patch.get("ok"):
                      keep.pop("error", None)        # a success wipes an old error note
                  requests.post(SUPABASE_URL + "/rest/v1/products?on_conflict=id",
                                headers=sb_headers({"Prefer": "resolution=merge-duplicates,return=minimal"}),
                                data=json.dumps([{"id": "__robot", "data": keep, "updated_at": now}]),
                                timeout=30)
              except Exception as e:
                  log("Could not write the health note: %s" % str(e)[:120])


          def download(url):
              r = requests.get(url, timeout=120)
              r.raise_for_status()
              return r.content


          def main():
              if not SUPABASE_URL or not SUPABASE_KEY:
                  log("STOP: SUPABASE_URL or SUPABASE_KEY is missing from the repository secrets.")
                  return 1

              log("Database: %s  key: %s" % (SUPABASE_URL, key_role()))
              try:
                  products = fetch_products()
              except Exception as e:
                  msg = str(e)
                  if "401" in msg or "403" in msg or "JWT" in msg:
                      log("::error::STOP: the database rejected the key. Replace the SUPABASE_KEY secret "
                          "with the service_role key (Supabase -> Settings -> API Keys -> Legacy).")
                  else:
                      log("::error::STOP: could not read the database: %s" % msg[:300].replace("\n", " "))
                  health({"ok": False, "error": msg[:300]})
                  return 1
              todo = [p for p in products if waiting(p)]
              recut = (os.environ.get("RECUT") or "").strip()
              if recut:
                  # a trial: cut one frame again even though it already has a cut-out
                  if recut.lower() == "first":
                      pick = next((p for p in products if front_photo(p) and not p.get("tryOnLocked")), None)
                  else:
                      pick = next((p for p in products if str(p.get("id")) == recut or str(p.get("sku")) == recut), None)
                  if pick is None:
                      log("Trial re-cut: no frame matched '%s'." % recut)
                  elif pick not in todo:
                      pick["tryOnFails"] = 0
                      todo.insert(0, pick)
                      log("Trial re-cut of %s (%s)." % (pick.get("id"), (pick.get("name") or "")[:40]))
              log("Catalogue: %d frames. Waiting for a cut-out: %d." % (len(products), len(todo)))
              if not todo:
                  log("Nothing to do.")
                  return 0

              cname, cpreset = cloudinary_probe(products)
              if not cname:
                  log("::error::STOP: Cloudinary refused every cloud name / preset combination, so nothing "
                      "was cut. The lines above list what was tried and what Cloudinary said. Fix: in "
                      "Cloudinary -> Settings -> Upload, confirm the Unsigned preset name, and put it in the "
                      "CLOUDINARY_PRESET secret exactly.")
                  health({"ok": False, "error": "Cloudinary refused every candidate"})
                  return 1

              done = failed = 0
              rejected = []
              for p in todo[:MAX_FRAMES]:
                  if out_of_time():
                      log("Time is up for this run; the rest go in the next one.")
                      break
                  pid = p.get("id")
                  try:
                      log("--- %s : %s" % (pid, (p.get("name") or "")[:50]))
                      rim_txt = str(p.get("rim") or p.get("rimType") or "").lower()
                      png, nums = cut(download(front_photo(p)), front=True,
                                      rim_kind=rim_kind_of(rim_txt))
                      url = cloudinary_upload(png, "tryon-" + str(pid), cname, cpreset)
                      p["tryOnUrl"] = url
                      p["tryOnReady"] = True
                      reading = nums.pop("reading", {}) or {}
                      warning = nums.pop("warning", None)
                      if warning:
                          p["tryOnWarning"] = warning
                          log("    CHECK PHOTO: " + warning)
                      else:
                          p.pop("tryOnWarning", None)
                      p["tryOnNumbers"] = nums
                      p["tryOnCutBy"] = "robot"
                      if reading:
                          filled = apply_reading(p, reading)
                          if filled:
                              log("    read from the photo: " + ", ".join(filled))

                      for src, field, label in ((angle_photo(p), "tryOnAngleUrl", "45 degree"),
                                                (side_photo(p), "tryOnSideUrl", "90 degree side")):
                          if src and not p.get(field) and not out_of_time():
                              try:
                                  png2, _ = cut(download(src), front=False)
                                  p[field] = cloudinary_upload(
                                      png2, "tryon-" + field + "-" + str(pid), cname, cpreset)
                                  log("    %s cut too" % label)
                              except Exception as e:
                                  log("    %s photo skipped: %s" % (label, str(e)[:110]))

                      p.pop("tryOnFail", None)
                      p["tryOnFails"] = 0
                      save_product(p)
                      done += 1
                      log("    done -> %s" % url)
                  except Exception as e:
                      failed += 1
                      why = plain_reason(e)
                      tries = (p.get("tryOnFails") or 0) + 1
                      p["tryOnFails"] = tries
                      p["tryOnFail"] = why
                      p["tryOnReady"] = False
                      try:
                          save_product(p)
                      except Exception:
                          pass
                      log("::warning::%s FAILED (%d of %d): %s" % (pid, tries, MAX_TRIES, why))
                      if tries >= MAX_TRIES:
                          rejected.append("%s: %s" % (p.get("name") or pid, why))

              if rejected:
                  whatsapp("Vision Gallery - frames rejected\n\n" + "\n".join(rejected[:10]) +
                           "\n\nThese frames are NOT on the website. Please take a proper "
                           "photo again and save it in admin.")

              health({"ok": True, "cut": done, "failed": failed,
                      "rejectedNow": len(rejected),
                      "waiting": max(0, len(todo) - done)})
              log("::notice::Finished. Cut %d, failed %d, rejected %d, still waiting %d.%s"
                  % (done, failed, len(rejected), max(0, len(todo) - done),
                     ("  Rejected: " + "; ".join(rejected[:5])) if rejected else ""))
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          cat > vg_requirements.txt <<'PYEOF'
          torch==2.4.1
          torchvision==0.19.1
          transformers==4.44.2
          timm==1.0.9
          einops==0.8.0
          kornia==0.7.3
          pillow==10.4.0
          numpy==1.26.4
          scipy==1.14.1
          pymatting==1.1.12
          opencv-python-headless==4.10.0.84
          requests==2.32.3
          PYEOF
          echo "robot unpacked: $(wc -l < vg_look.py) + $(wc -l < vg_cut.py) lines"

      - name: Is anything waiting?
        id: look
        env:
          SUPABASE_URL: https://oscpunukbyosckrmopeh.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RECUT: ${{ github.event.inputs.recut }}
        run: |
          set +e
          echo "Robot build 2026-09-18j (clean edge: full-size matte, tight edge, un-mixed colour, sheet ring off; arms-above; CHECK PHOTO)" > look.txt
          python vg_look.py >> look.txt 2>&1
          code=$?
          cat look.txt
          { echo "### What the robot found"; echo '```'; cat look.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Install the cutter
        if: steps.look.outputs.waiting != '0'
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r vg_requirements.txt

      - name: Keep the model between runs
        if: steps.look.outputs.waiting != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: birefnet-cache-v1

      - name: Cut whatever is waiting
        if: steps.look.outputs.waiting != '0'
        env:
          SUPABASE_URL: https://oscpunukbyosckrmopeh.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
          CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_PRESET }}
          ALERT_NUMBERS: ${{ secrets.ALERT_NUMBERS }}
          RECUT: ${{ github.event.inputs.recut }}
        run: |
          set +e
          python vg_cut.py > cut.txt 2>&1
          code=$?
          cat cut.txt
          { echo "### What the robot did"; echo '```'; sed -E "s/^::(warning|notice|error)::/  /" cut.txt | tail -n 80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Write the robot's report into the repo
        if: always()
        run: |
          {
            echo "Run $GITHUB_RUN_NUMBER  $(date -u)"
            echo "Trigger: $GITHUB_EVENT_NAME"
            echo
            echo "--- what the robot found ---"
            cat look.txt 2>/dev/null || echo "(the look did not run)"
            echo
            echo "--- what the robot did ---"
            { sed -E 's/^::(warning|notice|error)::/  /' cut.txt 2>/dev/null | tail -n 80; } || echo "(the cutter did not run)"
          } > robot-log.txt
          if [ -s cut.txt ]; then
            { echo "Run $GITHUB_RUN_NUMBER  $(date -u)"; echo; sed -E 's/^::(warning|notice|error)::/  /' cut.txt | tail -n 120; } > last-cut.txt
          fi
          rm -f vg_look.py vg_cut.py vg_requirements.txt look.txt cut.txt
          git config user.name  "vg-cutter"
          git config user.email "vg-cutter@users.noreply.github.com"
          git add robot-log.txt
          git add last-cut.txt 2>/dev/null || true
          git commit -m "robot log, run $GITHUB_RUN_NUMBER" || exit 0
          git pull --rebase --quiet || true
          git push || true
