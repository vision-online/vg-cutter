          VIEWS_VERSION = 2
          def cut_views(p, cname, cpreset, force=False):
              """THE THREE OTHER VIEWS ON WHITE (2026-09-26, shop): 45 left, 45 right
              and the 90-degree side are cut out like the front. On a 45-degree view
              the glass is cleared in angled mode; a view whose glass could not be
              found is still stored but NOT marked clean, so the shop keeps showing
              its photo. The side view shows no lens face, so it is clean when cut.
              Returns how many views were cut."""
              pid = str(p.get("id"))
              ok = dict(p.get("tryOnViewsOk") or {}) if isinstance(p.get("tryOnViewsOk"), dict) else {}
              n = 0
              fresh = force or int(p.get("tryOnViewsV") or 0) < VIEWS_VERSION
              locks = p.get("tryOnViewLocks") if isinstance(p.get("tryOnViewLocks"), dict) else {}
              # NOTHING REACHES CUSTOMERS UNSEEN (2026-09-29, shop): a view cut for a
              # frame that is ALREADY LIVE is held back ("pendingViews") until staff
              # approve it in TO CHECK; the frame stays live with what was approved.
              # A new frame is checked as a whole (awaitingCheck), so nothing extra.
              live_now = bool(p.get("tryOnReady")) and not p.get("awaitingCheck")
              pending = set(p.get("pendingViews") or []) if isinstance(p.get("pendingViews"), list) else set()
              problems = dict(p.get("viewProblems") or {}) if isinstance(p.get("viewProblems"), dict) else {}
              for view, src, field, angled, label in (
                      ("angle",  angle_photo(p),       "tryOnAngleUrl",  True,  "45 degree left"),
                      ("angleR", angle_right_photo(p), "tryOnAngleRUrl", True,  "45 degree right"),
                      ("side",   side_photo(p),        "tryOnSideUrl",   False, "90 degree side")):
                  if not src or out_of_time():
                      continue
                  if locks.get(view) and p.get(field):
                      log("    %s fixed by hand in admin -- left as it is" % label)
                      continue
                  if p.get(field) and not fresh:
                      continue
                  try:
                      png2, _ = cut(download(no_enhancement(src)), front=False, angled=angled)
                      p[field] = cloudinary_upload(png2, "tryon-" + field + "-" + pid, cname, cpreset)
                      # 45-degree fit points for the try-on (1 Oct): bridge and lens openings in this cut-out
                      _fit = angle_anchors(png2) if angled else None
                      p[field.replace("Url", "Fit")] = _fit
                      if not angled:
                          pass
                      elif _fit:
                          log("    %s fit points: bridge at (%d,%d), lens height %d px, near lens on the %s" % (label, _fit["bridge"][0], _fit["bridge"][1], _fit["lensHeightPx"], _fit["nearSide"]))
                      else:
                          log("    %s fit points: the two lens openings were not found -- the try-on will use the picture's box" % label)
                      # the original beside the cut-out, so PUT BACK works on this view in admin (2026-09-27)
                      if LAST_SOURCE[0]:
                          try: p[field.replace("Url", "Source")] = cloudinary_upload(LAST_SOURCE[0], "source-" + field + "-" + pid, cname, cpreset)
                          except Exception as _ex: log("    %s original could not be kept: %s" % (label, str(_ex)[:60]))
                      clean = True if not angled else bool(LAST_VIEW_GLASS[0])
                      ok[view] = clean
                      n += 1
                      problems.pop(view, None)
                      if live_now:
                          pending.add(view)
                          log("    %s held back until it is approved in TO CHECK" % label)
                      log("    %s cut too%s" % (label, "" if clean else " (glass not found -- the shop keeps the photo for this view)"))
                  except Exception as e:
                      ok[view] = False
                      problems[view] = str(e)[:140]                 # shown in TO CHECK instead of the view silently missing
                      log("    %s photo skipped: %s" % (label, str(e)[:110]))
              p["tryOnViewsOk"] = ok
              p["pendingViews"] = sorted(pending)
              p["viewProblems"] = problems
              p["tryOnViewsV"] = VIEWS_VERSION
              return n


          def waiting(p):
              """A frame is waiting if it has a photo but no ready cut-out."""
              if p.get("draft"):
                  return False          # a DRAFT: photos taken, details not typed yet (2026-09-26) -- cut when it is put live
              if p.get("tryOnLocked"):
                  return False
              if p.get("tryOnOk") is False:
                  return False          # try-on switched off by hand in admin: leave it          # a cut-out the shop supplied by hand: never touch
              if (p.get("tryOnFails") or 0) >= MAX_TRIES:
                  return False          # already rejected: waiting for a better photo
              if p.get("tryOnReady") and p.get("tryOnUrl"):
                  return False
              return bool(front_photo(p))


          def plain_reason(err):
              """Turn a technical failure into something a photographer can act on."""
              t = str(err).lower()
              if "no frame" in t or "nothing" in t or "empty" in t:
                  return "no frame found in the photo"
              if "cloudinary" in t:
                  return "the photo store refused the upload (%s)" % str(err)[len("Cloudinary refused: "):][:120]
              if "timed out" in t or "timeout" in t or "connection" in t:
                  return "the photo could not be downloaded"
              if "lens" in t:
                  return "the lenses could not be made clear"
              return "the photo could not be cut (%s)" % str(err)[:80]


          def alert_numbers():
              """Numbers to message, from the shop settings: number:key, number:key."""
              raw = os.environ.get("ALERT_NUMBERS") or ""
              if not raw:
                  for key in ("settings", "shop"):
                      s = fetch_setting(key) or {}
                      raw = s.get("alertWhatsApp") or s.get("alertNumbers") or ""
                      if raw:
                          break
              out = []
              for part in str(raw).replace(";", ",").split(","):
                  part = part.strip()
                  if not part:
                      continue
                  num, _, key = part.partition(":")
                  num = "".join(ch for ch in num if ch.isdigit())
                  if num and key.strip():
                      out.append((num, key.strip()))
              return out


          def whatsapp(text):
