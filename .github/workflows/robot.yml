name: Cut-out robot

# Every ten minutes the robot takes a ten-second look: is any frame waiting
# for a cut-out? If not, it stops there and costs almost nothing. If yes,
# it installs the cutter and does the work. "Run workflow" does it now.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      recut:
        description: 'Trial: type first to re-cut one frame, or a frame id'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the newest copy of each file
        # A phone saves a second download as "pending (1).py". Whatever the
        # name, the most recently committed copy is the one that runs.
        id: files
        run: |
          pick() {
            best=""; bt=0
            for f in $1; do
              [ -f "$f" ] || continue
              t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
              if [ "${t:-0}" -gt "$bt" ]; then bt=$t; best="$f"; fi
            done
            echo "$best"
          }
          P=$(pick "pending*.py"); C=$(pick "cutter*.py"); R=$(pick "requirements*.txt")
          echo "Using: $P | $C | $R"
          echo "pending=$P" >> "$GITHUB_OUTPUT"
          echo "cutter=$C"  >> "$GITHUB_OUTPUT"
          echo "reqs=$R"    >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Is anything waiting?
        id: look
        env:
          SUPABASE_URL: https://oscpunukbyosckrmopeh.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RECUT: ${{ github.event.inputs.recut }}
        # whatever the look says is copied onto the run's summary page,
        # so it can be read without opening the log
        run: |
          set +e
          echo "Using ${{ steps.files.outputs.pending }}" > look.txt
          python "${{ steps.files.outputs.pending }}" >> look.txt 2>&1
          code=$?
          cat look.txt
          { echo "### What the robot found"; echo '```'; cat look.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Install the cutter
        if: steps.look.outputs.waiting != '0'
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r "${{ steps.files.outputs.reqs }}"

      - name: Keep the model between runs
        if: steps.look.outputs.waiting != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: birefnet-cache-v1

      - name: Cut whatever is waiting
        if: steps.look.outputs.waiting != '0'
        env:
          SUPABASE_URL: https://oscpunukbyosckrmopeh.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
          CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_PRESET }}
          ALERT_NUMBERS: ${{ secrets.ALERT_NUMBERS }}
          RECUT: ${{ github.event.inputs.recut }}
        run: |
          set +e
          echo "Using ${{ steps.files.outputs.cutter }}" > cut.txt
          python "${{ steps.files.outputs.cutter }}" >> cut.txt 2>&1
          code=$?
          cat cut.txt
          { echo "### What the robot did"; echo '```'; grep -v "^::" cut.txt | tail -n 80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Write the robot's report into the repo
        # Always, even after a failure: robot-log.txt in the repo is
        # readable by anyone helping, without opening GitHub's logs.
        if: always()
        run: |
          {
            echo "Run $GITHUB_RUN_NUMBER  $(date -u)"
            echo "Trigger: $GITHUB_EVENT_NAME"
            echo
            echo "--- what the robot found ---"
            cat look.txt 2>/dev/null || echo "(the look did not run)"
            echo
            echo "--- what the robot did ---"
            { grep -v '^::' cut.txt 2>/dev/null | tail -n 80; } || echo "(the cutter did not run)"
          } > robot-log.txt
          # a run that actually cut something keeps its own report, so the
          # ten-minute looks that follow do not overwrite it
          if [ -s cut.txt ]; then
            { echo "Run $GITHUB_RUN_NUMBER  $(date -u)"; echo; grep -v '^::' cut.txt | tail -n 120; } > last-cut.txt
          fi
          git config user.name  "vg-cutter"
          git config user.email "vg-cutter@users.noreply.github.com"
          git add robot-log.txt
          git add last-cut.txt 2>/dev/null || true
          git commit -m "robot log, run $GITHUB_RUN_NUMBER" || exit 0
          git pull --rebase --quiet || true
          git push || true

      - name: Stay awake
        # GitHub switches off a schedule if the repository sits untouched
        # for 60 days. A dated note every three weeks prevents that.
        run: |
          if [ ! -f last-run.txt ] || [ -n "$(find last-run.txt -mtime +21)" ]; then
            date -u > last-run.txt
            git config user.name  "vg-cutter"
            git config user.email "vg-cutter@users.noreply.github.com"
            git add last-run.txt
            git commit -m "robot still alive" || exit 0
            git push
          fi
